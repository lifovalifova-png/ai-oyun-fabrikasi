<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saat Kulesi Savunması</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        canvas { display: block; background: #000; }
        #gameCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
        }
        #uiOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Allows clicks to pass through to canvas by default */
        }
        #menuScreen, #gameOverScreen, #gameWonScreen, #towerInfoPanel {
            pointer-events: auto; /* Re-enable pointer events for specific UI screens */
        }
        .ui-panel {
            background-color: rgba(0, 0, 0, 0.7);
            border: 2px solid #A17A4D; /* Brass */
            color: #D4C1A8; /* Aged Ivory */
            padding: 10px;
            box-shadow: 0 0 10px rgba(161, 122, 77, 0.8);
        }
        .btn-game {
            background-color: #7B523F; /* Copper */
            color: #D4C1A8; /* Aged Ivory */
            padding: 8px 16px;
            border-radius: 5px;
            border: 1px solid #A17A4D; /* Brass */
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }
        .btn-game:hover {
            background-color: #A17A4D; /* Brass */
            transform: translateY(-1px);
        }
        .btn-game:disabled {
            background-color: #4A3E3E; /* Dark Metal */
            border-color: #2C2C2C; /* Deep Shadow */
            cursor: not-allowed;
            color: #7B523F; /* Copper */
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div id="uiOverlay" class="relative">

        <!-- Main Menu Screen -->
        <div id="menuScreen" class="absolute inset-0 flex flex-col items-center justify-center bg-gray-900 bg-opacity-90 z-20">
            <h1 class="text-5xl font-bold mb-8 text-yellow-300 drop-shadow-lg">Saat Kulesi Savunması</h1>
            <button id="baslaBtn" class="btn-game text-xl px-12 py-4">OYUNU BAŞLAT</button>
        </div>

        <!-- Game UI -->
        <div id="gameUI" class="hidden absolute top-0 left-0 w-full p-4 z-10 pointer-events-none">
            <div class="flex justify-between items-center text-lg ui-panel">
                <div class="flex items-center space-x-4">
                    <span>❤ Can: <span id="playerHealth">10</span></span>
                    <span>💰 Altın: <span id="playerGold">100</span></span>
                    <span>⭐ Skor: <span id="playerScore">0</span></span>
                </div>
                <div class="flex items-center space-x-4">
                    <span class="font-bold text-2xl">Dalga: <span id="currentWave">1</span> / <span id="totalWaves">8</span></span>
                    <button id="timeSlowBtn" class="btn-game px-6 py-2 pointer-events-auto">⏳ Zamanı Yavaşlat (0)</button>
                </div>
            </div>
            <h2 class="hidden absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-4xl text-yellow-300 font-bold drop-shadow-lg" id="wavePrepText">Dalga Başlıyor...</h2>
        </div>

        <!-- Tower Selection Panel -->
        <div id="towerSelectionPanel" class="hidden absolute bottom-0 left-0 w-full p-4 flex justify-center space-x-4 z-10 pointer-events-auto">
            <!-- Tower buttons will be injected here by JS -->
        </div>

        <!-- Tower Info Panel -->
        <div id="towerInfoPanel" class="hidden absolute p-4 ui-panel z-10 pointer-events-auto" style="min-width: 200px;">
            <h3 id="infoTowerName" class="text-xl font-bold mb-2"></h3>
            <p>Seviye: <span id="infoTowerLevel"></span></p>
            <p>Hasar: <span id="infoTowerDamage"></span></p>
            <p>Menzil: <span id="infoTowerRange"></span></p>
            <p>Hız: <span id="infoTowerFireRate"></span></p>
            <div class="mt-4 flex flex-col space-y-2">
                <button id="upgradeTowerBtn" class="btn-game">Yükselt (<span id="upgradeCost"></span> Altın)</button>
                <button id="sellTowerBtn" class="btn-game">Sat (<span id="sellValue"></span> Altın)</button>
                <button id="closeInfoBtn" class="btn-game bg-gray-600 border-gray-500 hover:bg-gray-700">Kapat</button>
            </div>
        </div>

        <!-- Game Over Screen -->
        <div id="gameOverScreen" class="hidden absolute inset-0 flex flex-col items-center justify-center bg-gray-900 bg-opacity-90 z-20">
            <h2 class="text-5xl font-bold mb-4 text-red-500 drop-shadow-lg">OYUN SONU: KAYBETTİNİZ!</h2>
            <p class="text-2xl text-white mb-8">Skorunuz: <span id="finalScoreLost">0</span></p>
            <button id="restartBtnLost" class="btn-game text-xl px-12 py-4">YENİDEN BAŞLAT</button>
        </div>

        <!-- Game Won Screen -->
        <div id="gameWonScreen" class="hidden absolute inset-0 flex flex-col items-center justify-center bg-gray-900 bg-opacity-90 z-20">
            <h2 class="text-5xl font-bold mb-4 text-green-500 drop-shadow-lg">TEBRİKLER! KAZANDINIZ!</h2>
            <p class="text-2xl text-white mb-8">Skorunuz: <span id="finalScoreWon">0</span></p>
            <button id="restartBtnWon" class="btn-game text-xl px-12 py-4">YENİDEN BAŞLAT</button>
        </div>
    </div>

    <script>
        // --- Game Constants and Global Variables ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const PALETTE = {
            darkMetalStone: '#4A3E3E',
            copper: '#7B523F',
            brass: '#A17A4D',
            agedIvory: '#D4C1A8',
            deepShadow: '#2C2C2C',
            crimsonRed: '#B04C4C',
            highlightBlue: '#87CEEB', // For time slow effect
        };

        const GRID_SIZE = 60; // Size of each grid cell for pathfinding and tower placement
        let TOWER_SLOTS = []; // Dynamically calculated based on path
        let PATH = []; // Dynamically calculated based on canvas size

        const PLAYER_INITIAL_HEALTH = 10;
        const PLAYER_INITIAL_GOLD = 150;
        const TOTAL_WAVES = 8;
        const PREP_TIME_SECONDS = 5;

        let lastTime = 0;
        let deltaTime = 0;
        let animationFrameId;

        let game = {
            asama: 'menu', // menu, oyunda, dalga_hazirlaniyor, dalga_basladi, kazandi, kaybetti
            dalga: 1,
            can: PLAYER_INITIAL_HEALTH,
            altin: PLAYER_INITIAL_GOLD,
            skor: 0,
            zamanYavaslatmaKullanimSayisi: 0,
            timeScale: 1, // 1 for normal, 0.5 for slowed
            slowTimeRemaining: 0,
            enemyHealthMultiplier: 1, // Increases with time slow usage
            enemies: [],
            towers: [],
            projectiles: [],
            particles: [],
            floatingTexts: [],
            selectedTower: null,
            waveTimer: 0, // For prep time
            enemiesSpawnedThisWave: 0,
            currentWaveEnemies: [], // Enemies for the current wave
            lastSpawnTime: 0,
            isGameRunning: false, // For game loop control
        };

        // Global debug/test interface
        window.OYUN_DURUMU = {
            asama: game.asama,
            dalga: game.dalga,
            can: game.can,
            skor: game.skor,
        };

        // --- UI Elements ---
        const menuScreen = document.getElementById('menuScreen');
        const baslaBtn = document.getElementById('baslaBtn');
        const gameUI = document.getElementById('gameUI');
        const playerHealthSpan = document.getElementById('playerHealth');
        const playerGoldSpan = document.getElementById('playerGold');
        const playerScoreSpan = document.getElementById('playerScore');
        const currentWaveSpan = document.getElementById('currentWave');
        const totalWavesSpan = document.getElementById('totalWaves');
        const timeSlowBtn = document.getElementById('timeSlowBtn');
        const wavePrepText = document.getElementById('wavePrepText');
        const towerSelectionPanel = document.getElementById('towerSelectionPanel');
        const towerInfoPanel = document.getElementById('towerInfoPanel');
        const infoTowerName = document.getElementById('infoTowerName');
        const infoTowerLevel = document.getElementById('infoTowerLevel');
        const infoTowerDamage = document.getElementById('infoTowerDamage');
        const infoTowerRange = document.getElementById('infoTowerRange');
        const infoTowerFireRate = document.getElementById('infoTowerFireRate');
        const upgradeTowerBtn = document.getElementById('upgradeTowerBtn');
        const sellTowerBtn = document.getElementById('sellTowerBtn');
        const upgradeCostSpan = document.getElementById('upgradeCost');
        const sellValueSpan = document.getElementById('sellValue');
        const closeInfoBtn = document.getElementById('closeInfoBtn');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const finalScoreLost = document.getElementById('finalScoreLost');
        const restartBtnLost = document.getElementById('restartBtnLost');
        const gameWonScreen = document.getElementById('gameWonScreen');
        const finalScoreWon = document.getElementById('finalScoreWon');
        const restartBtnWon = document.getElementById('restartBtnWon');

        // --- Game Configuration Data ---
        const TOWER_TYPES = {
            'Dişli Atıcı': {
                name: 'Dişli Atıcı',
                price: 75,
                levels: [
                    { damage: 15, range: 120, fireRate: 600, cost: 75, sell: 37 }, // Base
                    { damage: 25, range: 150, fireRate: 500, cost: 100, sell: 87 }, // Level 1 upgrade
                    { damage: 40, range: 180, fireRate: 400, cost: 150, sell: 162 }, // Level 2 upgrade
                ],
                draw: (ctx, x, y, angle) => {
                    // Base (stone/dark metal)
                    ctx.fillStyle = PALETTE.darkMetalStone;
                    ctx.beginPath();
                    ctx.arc(x, y, 18, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = PALETTE.deepShadow;
                    ctx.lineWidth = 2;
                    ctx.stroke();

                    // Turret body (copper)
                    ctx.save();
                    ctx.translate(x, y);
                    ctx.rotate(angle);
                    ctx.fillStyle = PALETTE.copper;
                    ctx.fillRect(-5, -25, 10, 30); // Body
                    ctx.beginPath(); // Muzzle
                    ctx.arc(0, -25, 6, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = PALETTE.brass;
                    ctx.lineWidth = 1.5;
                    ctx.stroke();

                    // Gear detail (brass)
                    ctx.fillStyle = PALETTE.brass;
                    ctx.beginPath();
                    ctx.arc(0, -10, 8, 0, Math.PI * 2);
                    ctx.fill();
                    for(let i = 0; i < 8; i++){
                        const ang = (i / 8) * Math.PI * 2;
                        const x1 = Math.cos(ang) * 8;
                        const y1 = Math.sin(ang) * 8;
                        const x2 = Math.cos(ang) * 12;
                        const y2 = Math.sin(ang) * 12;
                        ctx.fillRect(x1 - 2, y1 - 2, x2 - x1 + 4, y2 - y1 + 4); // Cogs
                    }
                    ctx.fill();
                    ctx.restore();
                },
                projectileType: 'cog',
            },
            'Zaman Kırıcı': {
                name: 'Zaman Kırıcı',
                price: 150,
                levels: [
                    { damage: 10, range: 150, fireRate: 300, cost: 150, sell: 75 }, // Base (faster firing, less damage)
                    { damage: 18, range: 180, fireRate: 250, cost: 150, sell: 150 },
                    { damage: 28, range: 220, fireRate: 200, cost: 200, sell: 250 },
                ],
                draw: (ctx, x, y, angle) => {
                    // Base (dark metal)
                    ctx.fillStyle = PALETTE.darkMetalStone;
                    ctx.beginPath();
                    ctx.arc(x, y, 20, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = PALETTE.deepShadow;
                    ctx.lineWidth = 2;
                    ctx.stroke();

                    // Core (glowing aged ivory)
                    ctx.save();
                    ctx.translate(x, y);
                    ctx.rotate(angle);
                    ctx.fillStyle = PALETTE.agedIvory;
                    ctx.shadowColor = PALETTE.highlightBlue;
                    ctx.shadowBlur = 10;
                    ctx.beginPath();
                    ctx.arc(0, -10, 8, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0; // Reset shadow

                    // Panels (copper)
                    ctx.fillStyle = PALETTE.copper;
                    ctx.fillRect(-15, -30, 30, 10); // Top panel
                    ctx.fillRect(-15, -5, 5, 20); // Left arm
                    ctx.fillRect(10, -5, 5, 20); // Right arm

                    // Antenna (brass)
                    ctx.strokeStyle = PALETTE.brass;
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(0, -30);
                    ctx.lineTo(0, -40);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.arc(0, -40, 4, 0, Math.PI * 2);
                    ctx.fillStyle = PALETTE.brass;
                    ctx.fill();

                    ctx.restore();
                },
                projectileType: 'energyPulse',
            },
            'Kronometre Topu': {
                name: 'Kronometre Topu',
                price: 300,
                levels: [
                    { damage: 70, range: 180, fireRate: 1500, cost: 300, sell: 150 }, // Base (slow, high damage)
                    { damage: 100, range: 200, fireRate: 1300, cost: 250, sell: 275 },
                    { damage: 150, range: 230, fireRate: 1100, cost: 350, sell: 450 },
                ],
                draw: (ctx, x, y, angle) => {
                    // Base (dark metal stone)
                    ctx.fillStyle = PALETTE.darkMetalStone;
                    ctx.beginPath();
                    ctx.rect(x - 25, y - 25, 50, 50);
                    ctx.fill();
                    ctx.strokeStyle = PALETTE.deepShadow;
                    ctx.lineWidth = 3;
                    ctx.stroke();

                    // Cannon (copper with brass bands)
                    ctx.save();
                    ctx.translate(x, y);
                    ctx.rotate(angle);
                    ctx.fillStyle = PALETTE.copper;
                    ctx.fillRect(-10, -40, 20, 50); // Main barrel
                    ctx.strokeStyle = PALETTE.brass;
                    ctx.lineWidth = 3;
                    ctx.strokeRect(-10, -40, 20, 50);
                    ctx.beginPath();
                    ctx.arc(0, -40, 10, 0, Math.PI * 2);
                    ctx.fill();

                    // Brass bands
                    ctx.strokeStyle = PALETTE.brass;
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(-10, -20); ctx.lineTo(10, -20);
                    ctx.moveTo(-10, -30); ctx.lineTo(10, -30);
                    ctx.stroke();
                    ctx.restore();
                },
                projectileType: 'energyOrb',
            }
        };

        const ENEMY_TYPES = {
            'Cogwalker': {
                name: 'Cogwalker',
                baseHealth: 60,
                speed: 0.8,
                value: 10,
                draw: (ctx, x, y, progress) => {
                    ctx.save();
                    ctx.translate(x, y);
                    // Simple oscillating animation
                    const offset = Math.sin(progress * 0.1) * 3;
                    ctx.translate(0, offset);

                    // Body (main cog)
                    ctx.fillStyle = PALETTE.copper;
                    ctx.beginPath();
                    ctx.arc(0, 0, 15, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = PALETTE.brass;
                    ctx.lineWidth = 2;
                    ctx.stroke();

                    // Cogs (brass)
                    for(let i = 0; i < 8; i++){
                        const ang = (i / 8) * Math.PI * 2;
                        const x1 = Math.cos(ang) * 15;
                        const y1 = Math.sin(ang) * 15;
                        const x2 = Math.cos(ang) * 20;
                        const y2 = Math.sin(ang) * 20;
                        ctx.fillRect(x1 - 3, y1 - 3, x2 - x1 + 6, y2 - y1 + 6);
                    }
                    ctx.fill();

                    // Legs (dark metal)
                    ctx.fillStyle = PALETTE.darkMetalStone;
                    ctx.fillRect(-10, 15, 5, 10);
                    ctx.fillRect(5, 15, 5, 10);

                    // Antenna (brass)
                    ctx.strokeStyle = PALETTE.brass;
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(0, -15);
                    ctx.lineTo(0, -25);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.arc(0, -25, 2, 0, Math.PI * 2);
                    ctx.fillStyle = PALETTE.brass;
                    ctx.fill();

                    ctx.restore();
                }
            },
            'Gear-Golem': {
                name: 'Gear-Golem',
                baseHealth: 200,
                speed: 0.6,
                value: 25,
                draw: (ctx, x, y, progress) => {
                    ctx.save();
                    ctx.translate(x, y);
                    const offset = Math.sin(progress * 0.05) * 5;
                    ctx.translate(0, offset);

                    // Main body (dark metal stone)
                    ctx.fillStyle = PALETTE.darkMetalStone;
                    ctx.beginPath();
                    ctx.rect(-20, -20, 40, 40);
                    ctx.fill();
                    ctx.strokeStyle = PALETTE.deepShadow;
                    ctx.lineWidth = 3;
                    ctx.stroke();

                    // Central gear (brass)
                    ctx.fillStyle = PALETTE.brass;
                    ctx.beginPath();
                    ctx.arc(0, 0, 15, 0, Math.PI * 2);
                    ctx.fill();
                    for(let i = 0; i < 12; i++){
                        const ang = (i / 12) * Math.PI * 2;
                        const x1 = Math.cos(ang) * 15;
                        const y1 = Math.sin(ang) * 15;
                        const x2 = Math.cos(ang) * 20;
                        const y2 = Math.sin(ang) * 20;
                        ctx.fillRect(x1 - 2, y1 - 2, x2 - x1 + 4, y2 - y1 + 4);
                    }
                    ctx.fill();

                    // Legs (copper)
                    ctx.fillStyle = PALETTE.copper;
                    ctx.fillRect(-18, 20, 10, 15);
                    ctx.fillRect(8, 20, 10, 15);
                    ctx.fillRect(-18, -35, 10, 15); // Arms
                    ctx.fillRect(8, -35, 10, 15);

                    ctx.restore();
                }
            },
            'Chronos-Bot': { // BOSS
                name: 'Chronos-Bot',
                baseHealth: 1500, // BOSS health
                speed: 0.5,
                value: 100,
                isBoss: true,
                draw: (ctx, x, y, progress) => {
                    ctx.save();
                    ctx.translate(x, y);
                    const offset = Math.sin(progress * 0.03) * 7;
                    ctx.translate(0, offset);

                    // Main body (dark metal stone)
                    ctx.fillStyle = PALETTE.darkMetalStone;
                    ctx.beginPath();
                    ctx.rect(-30, -30, 60, 60);
                    ctx.fill();
                    ctx.strokeStyle = PALETTE.deepShadow;
                    ctx.lineWidth = 4;
                    ctx.stroke();

                    // Central glowing core (crimson red)
                    ctx.fillStyle = PALETTE.crimsonRed;
                    ctx.shadowColor = PALETTE.crimsonRed;
                    ctx.shadowBlur = 15;
                    ctx.beginPath();
                    ctx.arc(0, 0, 20, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;

                    // Large outer gears (brass)
                    ctx.fillStyle = PALETTE.brass;
                    ctx.beginPath();
                    ctx.arc(0, 0, 25, 0, Math.PI * 2);
                    ctx.fill();
                    for(let i = 0; i < 16; i++){
                        const ang = (i / 16) * Math.PI * 2;
                        const x1 = Math.cos(ang) * 25;
                        const y1 = Math.sin(ang) * 25;
                        const x2 = Math.cos(ang) * 35;
                        const y2 = Math.sin(ang) * 35;
                        ctx.fillRect(x1 - 3, y1 - 3, x2 - x1 + 6, y2 - y1 + 6);
                    }
                    ctx.fill();

                    // Legs/Supports (copper)
                    ctx.fillStyle = PALETTE.copper;
                    ctx.fillRect(-25, 30, 10, 20);
                    ctx.fillRect(15, 30, 10, 20);
                    ctx.fillRect(-25, -50, 10, 20); // Arms
                    ctx.fillRect(15, -50, 10, 20);

                    ctx.restore();
                }
            }
        };

        const WAVES = [
            { enemies: [{ type: 'Cogwalker', count: 8 }], spawnInterval: 1000 },
            { enemies: [{ type: 'Cogwalker', count: 12 }], spawnInterval: 900 },
            { enemies: [{ type: 'Cogwalker', count: 10 }, { type: 'Gear-Golem', count: 2 }], spawnInterval: 800 },
            { enemies: [{ type: 'Cogwalker', count: 10 }, { type: 'Gear-Golem', count: 5 }, { type: 'Chronos-Bot', count: 1 }], spawnInterval: 700 }, // BOSS
            { enemies: [{ type: 'Cogwalker', count: 15 }, { type: 'Gear-Golem', count: 7 }], spawnInterval: 600 },
            { enemies: [{ type: 'Cogwalker', count: 20 }, { type: 'Gear-Golem', count: 10 }], spawnInterval: 500 },
            { enemies: [{ type: 'Cogwalker', count: 15 }, { type: 'Gear-Golem', count: 12 }], spawnInterval: 400 },
            { enemies: [{ type: 'Cogwalker', count: 20 }, { type: 'Gear-Golem', count: 15 }, { type: 'Chronos-Bot', count: 2 }], spawnInterval: 350 }, // Second BOSS wave
        ];

        // --- Utility Functions ---
        function getCanvasMousePos(event) {
            const rect = canvas.getBoundingClientRect();
            let clientX, clientY;
            if (event.touches && event.touches.length > 0) {
                clientX = event.touches[0].clientX;
                clientY = event.touches[0].clientY;
            } else {
                clientX = event.clientX;
                clientY = event.clientY;
            }
            return {
                x: (clientX - rect.left) * (canvas.width / rect.width),
                y: (clientY - rect.top) * (canvas.height / rect.height)
            };
        }

        function calculateDistance(x1, y1, x2, y2) {
            return Math.sqrt(Math.pow(x2 - x1, 2) + Math.pow(y2 - y1, 2));
        }

        function getAngle(x1, y1, x2, y2) {
            return Math.atan2(y2 - y1, x2 - x1);
        }

        function getRandomColor(palette) {
            const colors = Object.values(palette);
            return colors[Math.floor(Math.random() * colors.length)];
        }

        function updateUI() {
            playerHealthSpan.textContent = game.can;
            playerGoldSpan.textContent = game.altin;
            playerScoreSpan.textContent = game.skor;
            currentWaveSpan.textContent = game.dalga;
            totalWavesSpan.textContent = TOTAL_WAVES;
            timeSlowBtn.textContent = `⏳ Zamanı Yavaşlat (${game.zamanYavaslatmaKullanimSayisi})`;

            Object.values(TOWER_TYPES).forEach(towerConfig => {
                const button = document.getElementById(`buy-${towerConfig.name.replace(/\s/g, '')}`);
                if (button) {
                    button.disabled = game.altin < towerConfig.price;
                }
            });

            window.OYUN_DURUMU = {
                asama: game.asama,
                dalga: game.dalga,
                can: game.can,
                skor: game.skor,
            };
        }

        function showScreen(screenId) {
            document.querySelectorAll('#uiOverlay > div').forEach(el => {
                el.classList.add('hidden');
                el.style.pointerEvents = 'none';
            });
            
            const screen = document.getElementById(screenId);
            if (screen) {
                screen.classList.remove('hidden');
                screen.style.pointerEvents = 'auto'; // Re-enable pointer events for the visible screen

                // Specific adjustments for game UI
                if(screenId === 'gameUI') {
                    gameUI.classList.remove('hidden');
                    towerSelectionPanel.classList.remove('hidden');
                    towerSelectionPanel.style.pointerEvents = 'auto';
                }
            }
            canvas.style.display = 'block';
        }

        // --- Game Classes ---

        class Entity {
            constructor(x, y) {
                this.x = x;
                this.y = y;
            }
        }

        class Enemy extends Entity {
            constructor(type, healthMultiplier = 1) {
                super(PATH[0].x, PATH[0].y);
                this.type = type;
                this.config = ENEMY_TYPES[type];
                this.health = this.config.baseHealth * healthMultiplier;
                this.maxHealth = this.health;
                this.speed = this.config.speed;
                this.value = this.config.value;
                this.pathIndex = 0;
                this.targetX = PATH[1].x;
                this.targetY = PATH[1].y;
                this.angle = getAngle(this.x, this.y, this.targetX, this.targetY);
                this.dead = false;
                this.progress = 0; // For animation
            }

            update(dt) {
                if (this.dead) return;

                this.progress += dt; // For drawing animation

                const actualSpeed = this.speed; // Speed already scaled by game.timeScale
                const dist = actualSpeed * dt / 1000;

                const dx = this.targetX - this.x;
                const dy = this.targetY - this.y;
                const currentDistToTarget = calculateDistance(this.x, this.y, this.targetX, this.targetY);

                if (currentDistToTarget <= dist) {
                    this.x = this.targetX;
                    this.y = this.targetY;
                    this.pathIndex++;

                    if (this.pathIndex < PATH.length) {
                        this.targetX = PATH[this.pathIndex].x;
                        this.targetY = PATH[this.pathIndex].y;
                        this.angle = getAngle(this.x, this.y, this.targetX, this.targetY);
                    } else {
                        game.can--;
                        this.dead = true;
                        if (game.can <= 0) {
                            endGame(false);
                        }
                    }
                } else {
                    this.x += dx / currentDistToTarget * dist;
                    this.y += dy / currentDistToTarget * dist;
                }
            }

            draw() {
                if (this.dead) return;
                this.config.draw(ctx, this.x, this.y, this.progress);

                // Health bar
                const barWidth = 40;
                const barHeight = 5;
                const healthPercentage = this.health / this.maxHealth;
                ctx.fillStyle = PALETTE.crimsonRed;
                ctx.fillRect(this.x - barWidth / 2, this.y - 40, barWidth, barHeight);
                ctx.fillStyle = PALETTE.highlightBlue;
                ctx.fillRect(this.x - barWidth / 2, this.y - 40, barWidth * healthPercentage, barHeight);
                ctx.strokeStyle = PALETTE.deepShadow;
                ctx.strokeRect(this.x - barWidth / 2, this.y - 40, barWidth, barHeight);

                // Boss health bar
                if (this.config.isBoss) {
                    ctx.fillStyle = PALETTE.darkMetalStone;
                    ctx.fillRect(canvas.width / 2 - 150, 20, 300, 20);
                    ctx.fillStyle = PALETTE.crimsonRed;
                    ctx.fillRect(canvas.width / 2 - 150, 20, 300 * healthPercentage, 20);
                    ctx.strokeStyle = PALETTE.brass;
                    ctx.lineWidth = 2;
                    ctx.strokeRect(canvas.width / 2 - 150, 20, 300, 20);
                    ctx.fillStyle = PALETTE.agedIvory;
                    ctx.textAlign = 'center';
                    ctx.font = 'bold 16px Arial';
                    ctx.fillText(`${this.config.name} Can: ${Math.round(this.health)}/${Math.round(this.maxHealth)}`, canvas.width / 2, 35);
                }
            }

            takeDamage(amount) {
                this.health -= amount;
                game.floatingTexts.push(new FloatingText(`-${amount}`, this.x, this.y - 20, PALETTE.crimsonRed));
                if (this.health <= 0) {
                    this.dead = true;
                    game.altin += this.value;
                    game.skor += this.value;
                    // Create particles for explosion
                    for (let i = 0; i < 10; i++) {
                        game.particles.push(new Particle(this.x, this.y, Math.random() * 6 - 3, Math.random() * 6 - 3, 5 + Math.random() * 5, getRandomColor(PALETTE), 600));
                    }
                }
            }
        }

        class Tower extends Entity {
            constructor(type, x, y) {
                super(x, y);
                this.type = type;
                this.config = TOWER_TYPES[type];
                this.level = 0; // 0 for base, 1 for upgrade 1, 2 for upgrade 2
                this.damage = this.config.levels[this.level].damage;
                this.range = this.config.levels[this.level].range;
                this.fireRate = this.config.levels[this.level].fireRate;
                this.lastShotTime = 0;
                this.target = null;
                this.angle = 0; // For turret rotation
                this.firingEffectTime = 0; // For muzzle flash
            }

            update(dt) {
                if (this.firingEffectTime > 0) {
                    this.firingEffectTime -= dt;
                }

                // If no target or target is dead/out of range, find a new one
                if (!this.target || this.target.dead || calculateDistance(this.x, this.y, this.target.x, this.target.y) > this.range) {
                    this.target = null;
                    // Find the closest enemy in range
                    let closestEnemy = null;
                    let minDistance = Infinity;

                    for (const enemy of game.enemies) {
                        if (!enemy.dead) {
                            const dist = calculateDistance(this.x, this.y, enemy.x, enemy.y);
                            if (dist <= this.range && dist < minDistance) {
                                minDistance = dist;
                                closestEnemy = enemy;
                            }
                        }
                    }
                    this.target = closestEnemy;
                }

                if (this.target) {
                    // Rotate towards target
                    this.angle = getAngle(this.x, this.y, this.target.x, this.target.y);

                    // Shoot if fire rate allows
                    if (game.isGameRunning && (performance.now() - this.lastShotTime) >= this.fireRate) {
                        game.projectiles.push(new Projectile(this.x, this.y, this.target, this.damage, this.config.projectileType));
                        this.lastShotTime = performance.now();
                        this.firingEffectTime = 100; // Muzzle flash duration
                    }
                }
            }

            draw() {
                this.config.draw(ctx, this.x, this.y, this.angle);

                // Muzzle flash effect
                if (this.firingEffectTime > 0) {
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    ctx.rotate(this.angle);
                    ctx.fillStyle = PALETTE.agedIvory;
                    ctx.shadowColor = PALETTE.agedIvory;
                    ctx.shadowBlur = 5;
                    ctx.beginPath();
                    ctx.arc(0, -35, 8, 0, Math.PI * 2); // Position relative to turret barrel
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.restore();
                }
            }

            upgrade() {
                if (this.level < this.config.levels.length - 1) {
                    const nextLevel = this.level + 1;
                    const upgradeCost = this.config.levels[nextLevel].cost - this.config.levels[this.level].cost; // Cost difference
                    if (game.altin >= upgradeCost) {
                        game.altin -= upgradeCost;
                        this.level = nextLevel;
                        this.damage = this.config.levels[this.level].damage;
                        this.range = this.config.levels[this.level].range;
                        this.fireRate = this.config.levels[this.level].fireRate;
                        updateTowerInfoPanel(this); // Update panel after upgrade
                        updateUI();
                        game.floatingTexts.push(new FloatingText(`-${upgradeCost}`, this.x, this.y - 20, PALETTE.brass));
                    } else {
                        game.floatingTexts.push(new FloatingText('Yetersiz altın!', this.x, this.y - 20, PALETTE.crimsonRed));
                    }
                }
            }

            sell() {
                game.altin += this.config.levels[this.level].sell;
                game.towers = game.towers.filter(t => t !== this);
                game.selectedTower = null;
                towerInfoPanel.classList.add('hidden');
                updateUI();
                game.floatingTexts.push(new FloatingText(`+${this.config.levels[this.level].sell}`, this.x, this.y - 20, PALETTE.brass));
                
                // Unoccupy the tower slot
                const soldTowerSlot = TOWER_SLOTS.find(slot => calculateDistance(slot.x, slot.y, this.x, this.y) < 1);
                if (soldTowerSlot) {
                    soldTowerSlot.occupied = false;
                }
            }
        }

        class Projectile extends Entity {
            constructor(x, y, target, damage, type) {
                super(x, y);
                this.target = target;
                this.damage = damage;
                this.type = type;
                this.speed = 400; // pixels per second
                this.dead = false;
                this.trail = []; // For trail effect
                this.size = 5;
            }

            update(dt) {
                if (this.dead || this.target.dead) {
                    this.dead = true;
                    return;
                }

                const actualSpeed = this.speed; // Speed already scaled by game.timeScale
                const dist = actualSpeed * dt / 1000;

                const dx = this.target.x - this.x;
                const dy = this.target.y - this.y;
                const currentDistToTarget = calculateDistance(this.x, this.y, this.target.x, this.target.y);

                // Add current position to trail
                this.trail.unshift({ x: this.x, y: this.y, alpha: 1 });
                // Keep trail short
                if (this.trail.length > 5) {
                    this.trail.pop();
                }

                if (currentDistToTarget <= dist) {
                    this.target.takeDamage(this.damage);
                    this.dead = true;
                } else {
                    this.x += dx / currentDistToTarget * dist;
                    this.y += dy / currentDistToTarget * dist;
                }
            }

            draw() {
                if (this.dead) return;

                // Draw trail
                for (let i = 0; i < this.trail.length; i++) {
                    const segment = this.trail[i];
                    ctx.globalAlpha = segment.alpha * (this.trail.length - i) / this.trail.length;
                    ctx.fillStyle = this.getProjectileColor();
                    ctx.beginPath();
                    ctx.arc(segment.x, segment.y, this.size * (this.trail.length - i) / this.trail.length / 2, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.globalAlpha = 1;

                // Draw projectile
                ctx.fillStyle = this.getProjectileColor();
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }

            getProjectileColor() {
                switch (this.type) {
                    case 'cog': return PALETTE.brass;
                    case 'energyPulse': return PALETTE.highlightBlue;
                    case 'energyOrb': return PALETTE.crimsonRed;
                    default: return PALETTE.agedIvory;
                }
            }
        }

        class Particle extends Entity {
            constructor(x, y, vx, vy, size, color, lifetime) {
                super(x, y);
                this.vx = vx;
                this.vy = vy;
                this.size = size;
                this.color = color;
                this.lifetime = lifetime; // ms
                this.currentLifetime = lifetime;
                this.dead = false;
            }

            update(dt) {
                this.currentLifetime -= dt;
                if (this.currentLifetime <= 0) {
                    this.dead = true;
                    return;
                }

                const dtSeconds = dt / 1000;
                this.x += this.vx * dtSeconds;
                this.y += this.vy * dtSeconds;
                this.vy += 9.8 * 0.1; // Simple gravity effect
                this.size -= (dt / this.lifetime) * (this.size / 2); // Shrink over time
            }

            draw() {
                if (this.dead) return;
                ctx.globalAlpha = this.currentLifetime / this.lifetime;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
            }
        }

        class FloatingText extends Entity {
            constructor(text, x, y, color = 'white', duration = 1000, vy = -30) {
                super(x, y);
                this.text = text;
                this.color = color;
                this.duration = duration;
                this.currentDuration = duration;
                this.vy = vy;
                this.dead = false;
            }

            update(dt) {
                this.currentDuration -= dt;
                if (this.currentDuration <= 0) {
                    this.dead = true;
                    return;
                }
                this.y += (this.vy * dt / 1000);
            }

            draw() {
                if (this.dead) return;
                ctx.globalAlpha = this.currentDuration / this.duration;
                ctx.fillStyle = this.color;
                ctx.font = 'bold 16px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(this.text, this.x, this.y);
                ctx.globalAlpha = 1;
            }
        }


        // --- Game Drawing Functions ---

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            calculatePathAndTowerSlots();
            draw(); // Redraw immediately on resize
        }

        function calculatePathAndTowerSlots() {
            // Define a path that makes sense for the clock tower theme.
            // Starts bottom-left, winds to center, then up to the tower base.
            const w = canvas.width;
            const h = canvas.height;

            PATH = [
                { x: w * 0.1, y: h * 0.9 },
                { x: w * 0.3, y: h * 0.9 },
                { x: w * 0.4, y: h * 0.7 },
                { x: w * 0.6, y: h * 0.7 },
                { x: w * 0.7, y: h * 0.5 },
                { x: w * 0.5, y: h * 0.3 },
                { x: w * 0.4, y: h * 0.2 },
                { x: w * 0.5, y: h * 0.1 }, // Destination: Clock tower base
            ];

            TOWER_SLOTS = [];
            // Generate tower slots around the path.
            // Iterate through the path segments to place slots
            const pathWidth = GRID_SIZE * 0.7; // How far from the path the towers can be
            for (let i = 0; i < PATH.length - 1; i++) {
                const p1 = PATH[i];
                const p2 = PATH[i + 1];

                const dx = p2.x - p1.x;
                const dy = p2.y - p1.y;
                const segmentLength = calculateDistance(p1.x, p1.y, p2.x, p2.y);
                if (segmentLength === 0) continue;

                const normalX = -dy / segmentLength; // Perpendicular vector for offset
                const normalY = dx / segmentLength;

                // Place slots to both sides of the path
                const numSteps = Math.floor(segmentLength / (GRID_SIZE * 1.5)); // Place slots every X distance
                for (let j = 0; j <= numSteps; j++) {
                    const factor = j / numSteps;
                    const px = p1.x + dx * factor;
                    const py = p1.y + dy * factor;

                    // Offset from path for tower slots
                    const offset = GRID_SIZE * 1.2;
                    const slot1 = { x: px + normalX * offset, y: py + normalY * offset, occupied: false };
                    const slot2 = { x: px - normalX * offset, y: py - normalY * offset, occupied: false };

                    // Add only if not too close to existing slots and within canvas bounds
                    const isTooClose = (newSlot) => TOWER_SLOTS.some(s => calculateDistance(s.x, s.y, newSlot.x, newSlot.y) < GRID_SIZE * 1.5);
                    const isInBounds = (slot) => slot.x > GRID_SIZE / 2 && slot.x < w - GRID_SIZE / 2 && slot.y > GRID_SIZE / 2 && slot.y < h - GRID_SIZE / 2;

                    if (isInBounds(slot1) && !isTooClose(slot1)) {
                        TOWER_SLOTS.push(slot1);
                    }
                    if (isInBounds(slot2) && !isTooClose(slot2)) {
                        TOWER_SLOTS.push(slot2);
                    }
                }
            }
        }

        function drawBackground() {
            // Gradient Sky
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, PALETTE.deepShadow);
            gradient.addColorStop(0.7, PALETTE.darkMetalStone);
            gradient.addColorStop(1, PALETTE.darkMetalStone);
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Background Gears (Decorative)
            ctx.globalAlpha = 0.2;
            for (let i = 0; i < 5; i++) {
                const gearX = Math.random() * canvas.width;
                const gearY = canvas.height * (0.3 + Math.random() * 0.5);
                const gearSize = 50 + Math.random() * 100;
                const gearColor = Math.random() > 0.5 ? PALETTE.copper : PALETTE.brass;
                drawGear(ctx, gearX, gearY, gearSize, gearColor, Math.random() * Math.PI * 2);
            }
            ctx.globalAlpha = 1;

            // Draw Path (metallic plates with rivets)
            ctx.strokeStyle = PALETTE.deepShadow;
            ctx.lineWidth = 30; // Path width
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.beginPath();
            ctx.moveTo(PATH[0].x, PATH[0].y);
            for (let i = 1; i < PATH.length; i++) {
                ctx.lineTo(PATH[i].x, PATH[i].y);
            }
            ctx.stroke();

            // Inner path color (more metallic)
            ctx.strokeStyle = PALETTE.copper;
            ctx.lineWidth = 25;
            ctx.beginPath();
            ctx.moveTo(PATH[0].x, PATH[0].y);
            for (let i = 1; i < PATH.length; i++) {
                ctx.lineTo(PATH[i].x, PATH[i].y);
            }
            ctx.stroke();

            // Add rivets/details to path
            ctx.fillStyle = PALETTE.darkMetalStone;
            const rivetSpacing = 40;
            for (let i = 0; i < PATH.length - 1; i++) {
                const p1 = PATH[i];
                const p2 = PATH[i + 1];
                const dist = calculateDistance(p1.x, p1.y, p2.x, p2.y);
                const numRivets = Math.floor(dist / rivetSpacing);
                for (let j = 0; j <= numRivets; j++) {
                    const factor = j / numRivets;
                    const rx = p1.x + (p2.x - p1.x) * factor;
                    const ry = p1.y + (p2.y - p1.y) * factor;
                    ctx.beginPath();
                    ctx.arc(rx, ry, 3, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // Draw Base Clock Tower (destination)
            const towerBaseX = PATH[PATH.length - 1].x;
            const towerBaseY = PATH[PATH.length - 1].y;
            drawClockTowerBase(ctx, towerBaseX, towerBaseY, 70, 150);
        }

        function drawClockTowerBase(ctx, x, y, width, height) {
            // Base stone block
            ctx.fillStyle = PALETTE.darkMetalStone;
            ctx.fillRect(x - width / 2, y - height, width, height);
            ctx.strokeStyle = PALETTE.deepShadow;
            ctx.lineWidth = 4;
            ctx.strokeRect(x - width / 2, y - height, width, height);

            // Clock face (aged Ivory)
            ctx.fillStyle = PALETTE.agedIvory;
            ctx.beginPath();
            ctx.arc(x, y - height * 0.7, width * 0.4, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = PALETTE.deepShadow;
            ctx.lineWidth = 2;
            ctx.stroke();

            // Clock hands (brass)
            ctx.strokeStyle = PALETTE.brass;
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            // Hour hand
            ctx.beginPath();
            ctx.moveTo(x, y - height * 0.7);
            ctx.lineTo(x + Math.cos(performance.now() * 0.00005) * width * 0.2, y - height * 0.7 + Math.sin(performance.now() * 0.00005) * width * 0.2);
            ctx.stroke();
            // Minute hand
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(x, y - height * 0.7);
            ctx.lineTo(x + Math.cos(performance.now() * 0.0005) * width * 0.35, y - height * 0.7 + Math.sin(performance.now() * 0.0005) * width * 0.35);
            ctx.stroke();

            // Top spire (copper)
            ctx.fillStyle = PALETTE.copper;
            ctx.beginPath();
            ctx.moveTo(x - width * 0.3, y - height);
            ctx.lineTo(x + width * 0.3, y - height);
            ctx.lineTo(x, y - height - 30);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = PALETTE.deepShadow;
            ctx.lineWidth = 2;
            ctx.stroke();

            // Gears on tower (decoration)
            drawGear(ctx, x - width * 0.6, y - height * 0.5, 30, PALETTE.brass, 0);
            drawGear(ctx, x + width * 0.6, y - height * 0.3, 25, PALETTE.copper, Math.PI / 4);
        }

        // Generic gear drawing helper
        function drawGear(ctx, x, y, radius, color, rotation) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(rotation);
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.arc(0, 0, radius, 0, Math.PI * 2);
            ctx.fill();
            for(let i = 0; i < 12; i++){
                const ang = (i / 12) * Math.PI * 2;
                const x1 = Math.cos(ang) * radius;
                const y1 = Math.sin(ang) * radius;
                const x2 = Math.cos(ang) * (radius + 10);
                const y2 = Math.sin(ang) * (radius + 10);
                ctx.fillRect(x1 - 5, y1 - 5, x2 - x1 + 10, y2 - y1 + 10);
            }
            ctx.fill();
            ctx.strokeStyle = PALETTE.darkMetalStone;
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.restore();
        }

        function drawGameTitle() {
            ctx.font = 'bold 30px serif';
            ctx.textAlign = 'left';
            ctx.fillStyle = PALETTE.brass;
            ctx.shadowColor = PALETTE.deepShadow;
            ctx.shadowBlur = 5;
            ctx.fillText('Saat Kulesi Savunması', 20, 40);
            ctx.shadowBlur = 0;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawBackground();
            drawGameTitle();

            // Draw tower slots (only if placing tower or selected)
            if (game.asama === 'oyunda' || game.selectedTowerType) {
                TOWER_SLOTS.forEach(slot => {
                    ctx.globalAlpha = slot.occupied ? 0.3 : 0.8;
                    ctx.fillStyle = slot.occupied ? PALETTE.crimsonRed : PALETTE.highlightBlue;
                    ctx.beginPath();
                    ctx.arc(slot.x, slot.y, GRID_SIZE / 2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.globalAlpha = 1;
                });
            }

            game.towers.forEach(tower => tower.draw());
            game.projectiles.forEach(projectile => projectile.draw());
            game.enemies.forEach(enemy => enemy.draw());
            game.particles.forEach(particle => particle.draw());
            game.floatingTexts.forEach(text => text.draw());
        }

        // --- Game Logic Functions ---

        function initGame() {
            game = {
                asama: 'dalga_hazirlaniyor',
                dalga: 1,
                can: PLAYER_INITIAL_HEALTH,
                altin: PLAYER_INITIAL_GOLD,
                skor: 0,
                zamanYavaslatmaKullanimSayisi: 0,
                timeScale: 1,
                slowTimeRemaining: 0,
                enemyHealthMultiplier: 1,
                enemies: [],
                towers: [],
                projectiles: [],
                particles: [],
                floatingTexts: [],
                selectedTower: null,
                selectedTowerType: null, // For placement
                waveTimer: PREP_TIME_SECONDS * 1000,
                enemiesSpawnedThisWave: 0,
                currentWaveEnemies: [],
                lastSpawnTime: 0,
                isGameRunning: true,
            };
            // Clear all tower slots
            TOWER_SLOTS.forEach(slot => slot.occupied = false);

            showScreen('gameUI');
            updateUI();
            startNextWavePrep();
            if (!animationFrameId) {
                animationFrameId = requestAnimationFrame(gameLoop);
            }
        }

        function startGame() {
            initGame();
        }

        function restartGame() {
            cancelAnimationFrame(animationFrameId);
            animationFrameId = null;
            initGame();
        }

        function startNextWavePrep() {
            game.asama = 'dalga_hazirlaniyor';
            game.waveTimer = PREP_TIME_SECONDS * 1000;
            wavePrepText.classList.remove('hidden');
            game.currentWaveEnemies = []; // Clear for new wave
            game.enemiesSpawnedThisWave = 0;

            // Generate enemies for the new wave
            if (game.dalga <= TOTAL_WAVES) {
                const waveConfig = WAVES[game.dalga - 1];
                waveConfig.enemies.forEach(enemyType => {
                    for (let i = 0; i < enemyType.count; i++) {
                        // Health scales per wave and by time slow multiplier
                        const healthMultiplier = 1 + (game.dalga - 1) * 0.25 + game.enemyHealthMultiplier * 0.1;
                        game.currentWaveEnemies.push(new Enemy(enemyType.type, healthMultiplier));
                    }
                });
            } else {
                endGame(true); // Player won!
                return;
            }

            updateUI();
        }

        function spawnEnemy() {
            if (game.enemiesSpawnedThisWave < game.currentWaveEnemies.length) {
                const enemy = game.currentWaveEnemies[game.enemiesSpawnedThisWave];
                game.enemies.push(enemy);
                game.enemiesSpawnedThisWave++;
                game.lastSpawnTime = performance.now();
            }
        }

        function endGame(won) {
            game.isGameRunning = false;
            cancelAnimationFrame(animationFrameId);
            animationFrameId = null;
            if (won) {
                finalScoreWon.textContent = game.skor;
                showScreen('gameWonScreen');
            } else {
                finalScoreLost.textContent = game.skor;
                showScreen('gameOverScreen');
            }
        }

        function handleCanvasClick(event) {
            const pos = getCanvasMousePos(event);

            // If a tower type is selected for placement
            if (game.selectedTowerType) {
                // Find the closest empty tower slot
                let closestSlot = null;
                let minDistance = Infinity;
                TOWER_SLOTS.forEach(slot => {
                    const dist = calculateDistance(pos.x, pos.y, slot.x, slot.y);
                    if (dist < GRID_SIZE / 2 && dist < minDistance && !slot.occupied) {
                        minDistance = dist;
                        closestSlot = slot;
                    }
                });

                if (closestSlot) {
                    const towerConfig = TOWER_TYPES[game.selectedTowerType];
                    if (game.altin >= towerConfig.price) {
                        game.altin -= towerConfig.price;
                        game.towers.push(new Tower(game.selectedTowerType, closestSlot.x, closestSlot.y));
                        closestSlot.occupied = true;
                        game.selectedTowerType = null; // Clear selection after placement
                        towerSelectionPanel.querySelectorAll('.kule-btn').forEach(btn => btn.classList.remove('border-green-500', 'border-2')); // Remove highlight
                        updateUI();
                    } else {
                        game.floatingTexts.push(new FloatingText('Yetersiz Altın!', pos.x, pos.y, PALETTE.crimsonRed));
                    }
                }
            } else {
                // Check if an existing tower was clicked
                game.selectedTower = null;
                towerInfoPanel.classList.add('hidden');
                for (const tower of game.towers) {
                    const dist = calculateDistance(pos.x, pos.y, tower.x, tower.y);
                    if (dist < GRID_SIZE / 2) { // Assuming tower occupies a similar area to a grid cell
                        game.selectedTower = tower;
                        updateTowerInfoPanel(tower);
                        return;
                    }
                }
            }
        }

        function updateTowerInfoPanel(tower) {
            if (!tower) {
                towerInfoPanel.classList.add('hidden');
                return;
            }

            towerInfoPanel.classList.remove('hidden');
            infoTowerName.textContent = tower.config.name;
            infoTowerLevel.textContent = tower.level === 0 ? 'Temel' : (tower.level === 1 ? 'Seviye 1' : 'Seviye 2 (Max)');
            infoTowerDamage.textContent = tower.damage;
            infoTowerRange.textContent = Math.round(tower.range);
            infoTowerFireRate.textContent = `${Math.round(1000 / tower.fireRate)}/sn`;

            sellValueSpan.textContent = tower.config.levels[tower.level].sell;

            if (tower.level < tower.config.levels.length - 1) {
                const nextLevel = tower.level + 1;
                const upgradeCost = tower.config.levels[nextLevel].cost - tower.config.levels[tower.level].cost;
                upgradeCostSpan.textContent = upgradeCost;
                upgradeTowerBtn.disabled = game.altin < upgradeCost;
                upgradeTowerBtn.classList.remove('hidden');
            } else {
                upgradeTowerBtn.classList.add('hidden');
            }

            // Position panel near the tower
            const panelWidth = towerInfoPanel.offsetWidth;
            const panelHeight = towerInfoPanel.offsetHeight;
            let panelX = tower.x + GRID_SIZE / 2 + 10;
            let panelY = tower.y - panelHeight / 2;

            // Adjust if out of bounds
            if (panelX + panelWidth > canvas.width - 20) panelX = tower.x - GRID_SIZE / 2 - panelWidth - 10;
            if (panelY < 20) panelY = 20;
            if (panelY + panelHeight > canvas.height - 20) panelY = canvas.height - panelHeight - 20;

            towerInfoPanel.style.left = `${panelX}px`;
            towerInfoPanel.style.top = `${panelY}px`;
        }

        // --- Game Loop ---
        function gameLoop(currentTime) {
            if (!lastTime) lastTime = currentTime;
            deltaTime = currentTime - lastTime;
            lastTime = currentTime;

            // Apply time scale only to game logic updates (enemies, projectiles, tower firing)
            // Timers like wave prep and slowTimeRemaining are updated with unscaled deltaTime.
            const scaledDeltaTime = deltaTime * game.timeScale;

            update(scaledDeltaTime);
            draw();

            if (game.isGameRunning) {
                animationFrameId = requestAnimationFrame(gameLoop);
            }
        }

        function update(dt) {
            // Update game state for global access
            window.OYUN_DURUMU.asama = game.asama;
            window.OYUN_DURUMU.dalga = game.dalga;
            window.OYUN_DURUMU.can = game.can;
            window.OYUN_DURUMU.skor = game.skor;

            if (game.asama === 'dalga_hazirlaniyor') {
                game.waveTimer -= deltaTime; // Unscaled time for UI timer
                wavePrepText.textContent = `Dalga ${game.dalga} Başlıyor... (${Math.ceil(game.waveTimer / 1000)})`;
                if (game.waveTimer <= 0) {
                    game.asama = 'dalga_basladi';
                    wavePrepText.classList.add('hidden');
                    game.lastSpawnTime = performance.now(); // Reset spawn timer for the actual wave start
                }
            } else if (game.asama === 'dalga_basladi') {
                const waveConfig = WAVES[game.dalga - 1];
                const spawnInterval = waveConfig.spawnInterval;

                // Spawn enemies
                if (game.enemiesSpawnedThisWave < game.currentWaveEnemies.length && (performance.now() - game.lastSpawnTime) >= spawnInterval) {
                    spawnEnemy();
                }

                // Check for end of wave
                const livingEnemies = game.enemies.filter(e => !e.dead);
                if (game.enemiesSpawnedThisWave >= game.currentWaveEnemies.length && livingEnemies.length === 0) {
                    if (game.dalga < TOTAL_WAVES) {
                        game.dalga++;
                        startNextWavePrep();
                    } else {
                        endGame(true); // All waves completed
                    }
                }
            }

            // Time slow update
            if (game.slowTimeRemaining > 0) {
                game.slowTimeRemaining -= deltaTime; // Unscaled time for timer itself
                if (game.slowTimeRemaining <= 0) {
                    game.timeScale = 1; // Revert to normal speed
                }
            }

            // Update entities using the scaled deltaTime
            game.towers.forEach(tower => tower.update(dt));
            game.enemies.forEach(enemy => enemy.update(dt));
            game.projectiles.forEach(projectile => projectile.update(dt));
            game.particles.forEach(particle => particle.update(dt));
            game.floatingTexts.forEach(text => text.update(dt));

            // Clean up dead/off-screen entities
            game.enemies = game.enemies.filter(e => !e.dead);
            game.projectiles = game.projectiles.filter(p => !p.dead);
            game.particles = game.particles.filter(p => !p.dead);
            game.floatingTexts = game.floatingTexts.filter(t => !t.dead);

            updateUI(); // Always update UI
        }

        // --- Event Listeners and Initial Setup ---

        // Initialize tower selection panel buttons
        function setupTowerSelectionPanel() {
            towerSelectionPanel.innerHTML = '';
            Object.values(TOWER_TYPES).forEach(towerConfig => {
                const button = document.createElement('button');
                button.id = `buy-${towerConfig.name.replace(/\s/g, '')}`;
                button.className = `kule-btn btn-game flex flex-col items-center p-2 text-sm`;
                button.innerHTML = `
                    <span class="font-bold">${towerConfig.name}</span>
                    <span>${towerConfig.price} Altın</span>
                `;
                button.onclick = () => {
                    if (game.altin >= towerConfig.price) {
                        game.selectedTowerType = towerConfig.name;
                        // Highlight selected button
                        towerSelectionPanel.querySelectorAll('.kule-btn').forEach(btn => btn.classList.remove('border-green-500', 'border-2'));
                        button.classList.add('border-green-500', 'border-2');
                    } else {
                        game.floatingTexts.push(new FloatingText('Yetersiz Altın!', canvas.width/2, canvas.height * 0.8, PALETTE.crimsonRed));
                    }
                };
                towerSelectionPanel.appendChild(button);
            });
        }


        baslaBtn.addEventListener('click', startGame);
        restartBtnLost.addEventListener('click', restartGame);
        restartBtnWon.addEventListener('click', restartGame);

        timeSlowBtn.addEventListener('click', () => {
            if (game.asama === 'dalga_basladi' && game.slowTimeRemaining <= 0) {
                game.timeScale = 0.5; // Slow down time
                game.slowTimeRemaining = 5000; // 5 seconds slow time
                game.zamanYavaslatmaKullanimSayisi++;
                game.enemyHealthMultiplier += 0.1; // Next wave enemies are 10% stronger
                game.floatingTexts.push(new FloatingText('Zaman Yavaşladı!', canvas.width/2, canvas.height/2, PALETTE.highlightBlue, 2000));
                timeSlowBtn.disabled = true; // Disable during cooldown
                setTimeout(() => timeSlowBtn.disabled = false, 5000); // Re-enable after 5s
            }
        });

        canvas.addEventListener('click', handleCanvasClick);
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault(); // Prevent scrolling on mobile
            handleCanvasClick(e);
        }, { passive: false });

        upgradeTowerBtn.addEventListener('click', () => {
            if (game.selectedTower) {
                game.selectedTower.upgrade();
            }
        });

        sellTowerBtn.addEventListener('click', () => {
            if (game.selectedTower) {
                game.selectedTower.sell();
            }
        });

        closeInfoBtn.addEventListener('click', () => {
            game.selectedTower = null;
            towerInfoPanel.classList.add('hidden');
        });

        window.addEventListener('resize', resizeCanvas);

        // Initial setup calls
        function initializeGameElements() {
            resizeCanvas(); // Set canvas size and calculate path/slots
            setupTowerSelectionPanel(); // Populate tower buttons
            showScreen('menuScreen'); // Start with the menu
            updateUI(); // Update initial UI values
        }

        initializeGameElements();
    </script>
</body>
</html>
