<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ay üssü kubbe savunması</title>
<style>
  html,body{margin:0;padding:0;overflow:hidden;background:#0b0f19;font-family:system-ui,sans-serif;}
  #sahne{position:relative;width:100vw;height:100vh;}
  canvas{display:block;width:100%;height:100%;touch-action:none;}
  .overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
           background:rgba(5,8,15,.82);z-index:20;}
  .overlay.gizli{display:none;pointer-events:none;}
  .panel{background:rgba(17,24,39,.95);border:1px solid rgba(255,255,255,.12);
         border-radius:16px;padding:28px 32px;max-width:520px;text-align:center;color:#e5e7eb;}
  .btn{background:#2563eb;color:#fff;border:none;border-radius:10px;padding:12px 26px;
       font-size:16px;font-weight:600;cursor:pointer;margin-top:14px;}
  .btn:hover{background:#1d4ed8;}
  .btn.ikincil{background:#374151;}
  #hud{position:absolute;top:0;left:0;right:0;z-index:10;display:flex;gap:14px;flex-wrap:wrap;
       padding:10px 14px;background:linear-gradient(180deg,rgba(5,8,15,.85),rgba(5,8,15,0));
       color:#e5e7eb;font-size:14px;font-weight:600;pointer-events:none;}
  #hud .kutu{background:rgba(17,24,39,.7);border:1px solid rgba(255,255,255,.1);
             border-radius:10px;padding:6px 12px;}
  #kulePanel{position:absolute;bottom:0;left:0;right:0;z-index:10;display:flex;gap:8px;
             justify-content:center;flex-wrap:wrap;padding:10px;
             background:linear-gradient(0deg,rgba(5,8,15,.9),rgba(5,8,15,0));}
  .kule-btn{background:rgba(17,24,39,.92);border:2px solid rgba(255,255,255,.15);color:#e5e7eb;
            border-radius:12px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;
            min-width:96px;}
  .kule-btn.secili{border-color:#38bdf8;box-shadow:0 0 0 2px rgba(56,189,248,.35);}
  .kule-btn:disabled{opacity:.45;cursor:not-allowed;}
  #uyari{position:absolute;top:44%;left:0;right:0;z-index:12;text-align:center;color:#fbbf24;
         font-size:26px;font-weight:800;text-shadow:0 2px 10px rgba(0,0,0,.8);
         opacity:0;transition:opacity .3s;pointer-events:none;}
  #uyari.gorunur{opacity:1;}
  #vinyet{position:absolute;inset:0;z-index:9;pointer-events:none;opacity:0;
          transition:opacity .4s;
          background:radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(220,38,38,.55) 100%);}
  .text-3xl{font-size:30px;} .text-2xl{font-size:24px;} .text-sm{font-size:13px;}
  .font-bold{font-weight:700;} .mb-3{margin-bottom:12px;} .mb-2{margin-bottom:8px;}
  .text-slate-300{color:#cbd5e1;} .text-slate-400{color:#94a3b8;}
</style>
</head>
<body>
<div id="sahne">
  <canvas id="oyunCanvas"></canvas>

  <div id="hud">
    <div class="kutu">Can: <span id="hudCan">20</span></div>
    <div class="kutu">Altın: <span id="hudAltin">0</span></div>
    <div class="kutu">Dalga: <span id="hudDalga">0</span>/<span id="hudToplamDalga">10</span></div>
    <div class="kutu">Skor: <span id="hudSkor">0</span></div>
    <div class="kutu" id="hudCombo" style="display:none">Combo x<span id="hudComboSayi">1</span></div>
  </div>

  <div id="uyari"></div>
  <div id="vinyet"></div>

  <div id="kulePanel"></div>

  <div id="menuOverlay" class="overlay">
    <div class="panel">
      <h1 id="menuBaslik" class="text-3xl font-bold mb-3">Ay üssü kubbe savunması</h1>
      <p id="menuAciklama" class="text-slate-300 mb-2"></p>
      <p class="text-slate-400 text-sm">Kule seçmek için alttaki panele, yerleştirmek için haritaya dokun.
         Kurulu kuleye dokunarak yükselt veya sat.</p>
      <button id="baslaBtn" class="btn">Oyunu Başlat</button>
    </div>
  </div>

  <div id="sonOverlay" class="overlay gizli">
    <div class="panel">
      <h2 id="sonBaslik" class="text-3xl font-bold mb-2">Oyun Bitti</h2>
      <p id="sonMetin" class="text-slate-300"></p>
      <button id="yenidenBtn" class="btn">Yeniden Başlat</button>
    </div>
  </div>

  <div id="kuleMenu" class="overlay gizli">
    <div class="panel">
      <h3 id="kmBaslik" class="text-2xl font-bold mb-2">Kule</h3>
      <p id="kmBilgi" class="text-slate-300 mb-2"></p>
      <button id="kmYukselt" class="btn">Yükselt</button>
      <button id="kmSat" class="btn ikincil">Sat</button>
      <button id="kmKapat" class="btn ikincil">Kapat</button>
    </div>
  </div>
</div>

<script>
/* ============================================================
   TEMA EKLENTİSİ (Gemini tarafından üretilir)
   ============================================================ */
const TEMA = {
  ad: "Ay Kubbesi Savunması",
  aciklama: "Ay yüzeyindeki yaşam kubbesini, düşmanca uzaylı sürülerinden koru! Mermiler düşük yerçekiminde kavisli ilerliyor.",
  palet: {
    arka1:"#0A0A1A",   // Uzayın derinliği (koyu mavi)
    arka2:"#1A1A3A",   // Uzayın hafif aydınlık kısmı (orta koyu mavi)
    yol:"#444455",     // Ay toprağı / yolu (gri ton)
    yolKenar:"#666677",// Yol kenarları (daha açık gri)
    dusman:"#FF6666",  // Kırmızımsı düşman (Ay Böceği)
    dusman2:"#66FF66", // Yeşilimsi düşman (Gölge Drone)
    kule:"#AAAAFF",    // Mavi lazer kule
    mermi:"#FFFF99",   // Parlak sarı mermi/enerji
    vurgu:"#FFD700"    // Altın sarısı (genel vurgu, gözler, ışıklar)
  },
  yol: [
    {x:0,y:400}, {x:200,y:400}, {x:350,y:250}, {x:500,y:250}, {x:650,y:450}, {x:800,y:450}, {x:950,y:300}, {x:1280,y:300}
  ],
  dusmanTipleri: [
    {ad:"Ay Böceği", can:60, hiz:62, altin:12, yaricap:14, renk:"#FF6666"}, // Kırmızımsı böcek
    {ad:"Gölge Drone", can:42, hiz:96, altin:14, yaricap:12, renk:"#66FF66"}, // Yeşilimsi drone
    {ad:"Kaya Titan", can:155, hiz:44, altin:23, yaricap:18, renk:"#8888AA"} // Gri kaya canavarı
  ],
  kuleTipleri: [
    {ad:"Lazer Kule", fiyat:50, menzil:150, hasar:18, atisHizi:1.2, mermiHizi:360, renk:"#AAAAFF"}, // Mavi lazer
    {ad:"Plazma Topu", fiyat:90, menzil:125, hasar:44, atisHizi:0.55, mermiHizi:270, renk:"#FFAA66", alan:48}, // Turuncu plazma, alan hasarı
    {ad:"Yerçekimi Yavaşlatıcı", fiyat:70, menzil:135, hasar:8, atisHizi:0.9, mermiHizi:330, renk:"#CC99FF", yavaslat:0.5} // Mor yavaşlatıcı
  ],
  arkaplanCiz: function(c, W, H, t){
    c.save();

    // Uzay ve ay ufku gradyanı (mevcut)
    var grad = c.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, this.palet.arka1);
    grad.addColorStop(0.5, this.palet.arka2);
    grad.addColorStop(1, "#282848"); // Biraz daha morumsu ufuk çizgisi
    c.fillStyle = grad;
    c.fillRect(0, 0, W, H);

    // Yeni katman: Uzak nebula/galaksi efekti
    let nebulaGrad = c.createRadialGradient(W * 0.2 + Math.sin(t*0.05)*100, H * 0.1 + Math.cos(t*0.07)*50, 50, W * 0.2 + Math.sin(t*0.05)*100, H * 0.1 + Math.cos(t*0.07)*50, 400);
    nebulaGrad.addColorStop(0, "rgba(100, 100, 200, " + (0.2 + 0.1*Math.sin(t*0.6)) + ")");
    nebulaGrad.addColorStop(0.5, "rgba(50, 50, 150, 0.1)");
    nebulaGrad.addColorStop(1, "rgba(0, 0, 0, 0)");
    c.fillStyle = nebulaGrad;
    c.fillRect(0, 0, W, H);

    nebulaGrad = c.createRadialGradient(W * 0.8 + Math.cos(t*0.06)*80, H * 0.3 + Math.sin(t*0.08)*40, 30, W * 0.8 + Math.cos(t*0.06)*80, H * 0.3 + Math.sin(t*0.08)*40, 300);
    nebulaGrad.addColorStop(0, "rgba(200, 100, 100, " + (0.15 + 0.08*Math.cos(t*0.7)) + ")");
    nebulaGrad.addColorStop(0.5, "rgba(150, 50, 50, 0.05)");
    nebulaGrad.addColorStop(1, "rgba(0, 0, 0, 0)");
    c.fillStyle = nebulaGrad;
    c.fillRect(0, 0, W, H);

    // Uzak yıldızlar (parlama animasyonu) (mevcut)
    c.fillStyle = "rgba(255, 255, 255, " + (0.5 + 0.2 * Math.sin(t * 1.5)) + ")";
    for(let i=0; i<100; i++) {
      c.fillRect(Math.random() * W, Math.random() * H, 1, 1);
    }
    // Daha büyük yıldızlar (mevcut)
    c.fillStyle = "rgba(255, 255, 200, " + (0.7 + 0.3 * Math.sin(t * 0.8 + Math.PI/2)) + ")";
    for(let i=0; i<20; i++) {
      c.beginPath();
      c.arc(Math.random() * W, Math.random() * H, 1.5, 0, Math.PI * 2);
      c.fill();
    }

    // Yeni katman: Ay yüzeyi silüeti (uzak, daha detaylı)
    c.fillStyle = "#2D2D40"; // Slightly darker than the current #33334A for more depth
    c.beginPath();
    c.moveTo(0, H * 0.65);
    c.bezierCurveTo(W*0.15, H*0.60, W*0.3, H*0.70, W*0.45, H*0.63 + Math.sin(t*0.3)*5);
    c.bezierCurveTo(W*0.6, H*0.58, W*0.8, H*0.67, W, H*0.62);
    c.lineTo(W, H);
    c.lineTo(0, H);
    c.closePath();
    c.fill();

    // Ay yüzeyi (yakın) (mevcut)
    // Use a gradient for more depth instead of solid color
    let groundGrad = c.createLinearGradient(0, H * 0.7, 0, H);
    groundGrad.addColorStop(0, "#444455");
    groundGrad.addColorStop(1, "#3A3A4A"); // Darker as it goes down
    c.fillStyle = groundGrad;
    c.beginPath();
    c.moveTo(0, H * 0.75);
    c.bezierCurveTo(W*0.25, H*0.7, W*0.5, H*0.8, W*0.75, H*0.72);
    c.bezierCurveTo(W*0.9, H*0.68, W, H*0.75);
    c.lineTo(W, H);
    c.lineTo(0, H);
    c.closePath();
    c.fill();

    // Ay Krateri desenleri (mevcut, geliştirelim)
    c.fillStyle = "rgba(0, 0, 0, 0.15)"; // Daha belirgin
    c.strokeStyle = "rgba(0, 0, 0, 0.25)"; // Daha belirgin
    c.lineWidth = 1;
    for(let i=0; i<20; i++){ // Daha fazla krater
      let cx = Math.random()*W;
      let cy = H*0.7 + Math.random()*H*0.3;
      let r = 15 + Math.random()*40;
      c.beginPath();
      c.arc(cx, cy, r, 0, Math.PI*2);
      c.fill();
      c.beginPath();
      c.arc(cx, cy, r * 0.8, 0, Math.PI*2); // İç kenar
      c.stroke();
    }

    // Yeni katman: Ay tozu/taş dokusu (yakın plan)
    c.fillStyle = "rgba(255, 255, 255, 0.05)"; // Açık renkli parçacıklar
    for(let i=0; i<50; i++){
      c.fillRect(Math.random() * W, H*0.8 + Math.random()*H*0.2, 1, 1);
    }
    c.fillStyle = "rgba(0, 0, 0, 0.08)"; // Koyu parçacıklar
    for(let i=0; i<50; i++){
      c.fillRect(Math.random() * W, H*0.8 + Math.random()*H*0.2, 1, 1);
    }

    // Ana yapı: Ay Kubbesi (mevcut, geliştirelim)
    const kubbeX = W - 100;
    const kubbeY = 300 + 100;

    // Dış ışık halkası
    c.shadowColor = this.palet.vurgu;
    c.shadowBlur = 30 + 15 * Math.sin(t * 1.5); // Daha belirgin animasyon
    c.globalAlpha = 0.8; // Daha opak ışık

    c.beginPath();
    c.arc(kubbeX, kubbeY, 100, Math.PI, 0);
    c.fillStyle = "rgba(180, 200, 255, 0.15)"; // Saydam dış katman, daha az opak
    c.fill();
    c.strokeStyle = "rgba(180, 200, 255, 0.3)"; // Daha az opak
    c.lineWidth = 5; // Daha kalın kontur
    c.stroke();

    c.globalAlpha = 1.0; // Reset global alpha

    // İç katman gradyanı
    let innerDomeGrad = c.createRadialGradient(kubbeX, kubbeY-40, 50, kubbeX, kubbeY, 90);
    innerDomeGrad.addColorStop(0, "rgba(120, 140, 200, 0.6)");
    innerDomeGrad.addColorStop(1, "rgba(80, 100, 160, 0.4)");
    c.fillStyle = innerDomeGrad;
    c.beginPath();
    c.arc(kubbeX, kubbeY, 90, Math.PI, 0);
    c.fill();
    c.strokeStyle = "rgba(100, 120, 180, 0.7)"; // Daha opak
    c.lineWidth = 4;
    c.stroke();

    // Kubbe pencereleri/ışıkları (mevcut, geliştirelim)
    c.shadowBlur = 0; // Shadow'u resetle
    c.fillStyle = this.palet.vurgu;
    c.shadowColor = this.palet.vurgu;
    c.shadowBlur = 10; // Pencerelerin kendi ışığı

    for (let i = 0; i < 6; i++) { // Daha fazla pencere
      let angle = Math.PI + (i * (Math.PI / 7)) + (Math.sin(t * 0.7 + i) * 0.05); // Hafif sallanma
      let r = 85; // Biraz daha dışa
      let winX = kubbeX + r * Math.cos(angle);
      let winY = kubbeY + r * Math.sin(angle) * 0.6; // Elips gibi
      c.beginPath();
      c.arc(winX, winY, 5 + 2 * Math.sin(t * 4 + i), 0, Math.PI * 2); // Parlama animasyonu
      c.fill();
    }

    // İç yapısal çizgiler
    c.shadowBlur = 0;
    c.strokeStyle = "rgba(180, 200, 255, 0.2)";
    c.lineWidth = 1;
    for(let i=1; i<4; i++){
      c.beginPath();
      c.arc(kubbeX, kubbeY, 95 - i*15, Math.PI, 0);
      c.stroke();
    }
    for(let i=0; i<6; i++){
      let angle = Math.PI + (i * (Math.PI / 5.5)); // Radyal çizgiler
      c.beginPath();
      c.moveTo(kubbeX + 90 * Math.cos(angle), kubbeY + 90 * Math.sin(angle) * 0.6);
      c.lineTo(kubbeX + 50 * Math.cos(angle), kubbeY + 50 * Math.sin(angle) * 0.6);
      c.stroke();
    }

    c.shadowBlur = 0; // Shadow'u resetle
    c.restore();
  },
  yolCiz: function(c, yol, t){
    c.save();

    // Yol kenarındaki gölgeler
    c.shadowColor = "rgba(0,0,0,0.5)";
    c.shadowBlur = 10;
    c.lineWidth = 18; // Gölge için biraz daha geniş
    c.strokeStyle = "rgba(0,0,0,0.2)";
    c.beginPath();
    c.moveTo(yol[0].x, yol[0].y);
    for(let i=1; i<yol.length; i++){
      c.lineTo(yol[i].x, yol[i].y);
    }
    c.stroke();
    c.shadowBlur = 0; // Shadow'u resetle

    // Yolun dış konturu
    c.strokeStyle = "#111122"; // Daha koyu bir kontur
    c.lineWidth = 14; // Daha ince kontur
    c.beginPath();
    c.moveTo(yol[0].x, yol[0].y);
    for(let i=1; i<yol.length; i++){
      c.lineTo(yol[i].x, yol[i].y);
    }
    c.stroke();

    // Yolun iç kısmı (Gradyan ile derinlik)
    c.lineWidth = 10;
    // Calculate min/max Y for the path to create a vertical gradient
    let minY = yol[0].y, maxY = yol[0].y;
    for(let i=1; i<yol.length; i++){
      if (yol[i].y < minY) minY = yol[i].y;
      if (yol[i].y > maxY) maxY = yol[i].y;
    }
    var pathGrad = c.createLinearGradient(0, minY - 20, 0, maxY + 20); // Extent slightly beyond path
    pathGrad.addColorStop(0, this.palet.yol); // Üst kısımlar
    pathGrad.addColorStop(0.5, "#3A3A4A"); // Orta kısımlar biraz daha koyu
    pathGrad.addColorStop(1, "#444455"); // Alt kısımlar tekrar açık
    c.strokeStyle = pathGrad;
    c.beginPath();
    c.moveTo(yol[0].x, yol[0].y);
    for(let i=1; i<yol.length; i++){
      c.lineTo(yol[i].x, yol[i].y);
    }
    c.stroke();

    // Yol kenar çizgisi (iç kontur) - parlayan enerji çizgileri
    c.strokeStyle = this.palet.yolKenar;
    c.lineWidth = 2; // Daha ince
    c.shadowColor = this.palet.yolKenar;
    c.shadowBlur = 10 + 5 * Math.sin(t * 3); // Parlama animasyonu
    c.beginPath();
    c.moveTo(yol[0].x, yol[0].y);
    for(let i=1; i<yol.length; i++){
      c.lineTo(yol[i].x, yol[i].y);
    }
    c.stroke();
    c.shadowBlur = 0; // Shadow'u resetle

    // Yol üzerine Ay dokusu (hafif kraterler, taşlar) (mevcut, geliştirelim)
    c.fillStyle = "rgba(0, 0, 0, 0.2)";
    c.strokeStyle = "rgba(255, 255, 255, 0.05)"; // Beyaz kenar
    c.lineWidth = 0.5;
    for(let i=0; i<yol.length-1; i++){
      let p1 = yol[i];
      let p2 = yol[i+1];
      let len = Math.sqrt(Math.pow(p2.x - p1.x, 2) + Math.pow(p2.y - p1.y, 2));
      let numCraters = Math.floor(len / 30); // Daha sık krater
      for(let j=0; j<numCraters; j++){
        let frac = j / numCraters;
        let cx = p1.x + (p2.x - p1.x) * frac + (Math.sin(t*2+j*5) * 5); // Add animation to crater position
        let cy = p1.y + (p2.y - p1.y) * frac + (Math.cos(t*2+j*5) * 5);
        let r = 4 + Math.random()*7; // Daha küçük ve varyasyonlu
        c.beginPath();
        c.arc(cx, cy, r, 0, Math.PI*2);
        c.fill();
        c.stroke();
      }
    }

    // Yol üzerinde kayan parlak noktalar (enerji akışı simülasyonu)
    c.fillStyle = this.palet.yolKenar;
    c.shadowColor = this.palet.yolKenar;
    c.shadowBlur = 5;

    let totalPathLen = 0;
    for(let i=0; i<yol.length-1; i++){
      let p1 = yol[i];
      let p2 = yol[i+1];
      totalPathLen += Math.sqrt(Math.pow(p2.x - p1.x, 2) + Math.pow(p2.y - p1.y, 2));
    }

    // Create multiple glowing points moving along the path
    const numGlowPoints = 3;
    const glowPointSpacing = totalPathLen / numGlowPoints;
    for(let g = 0; g < numGlowPoints; g++) {
      let animPos = (t * 50 + (g * glowPointSpacing)) % totalPathLen; // Offset each point

      let currentLen = 0;
      for(let i=0; i<yol.length-1; i++){
        let p1 = yol[i];
        let p2 = yol[i+1];
        let segmentLen = Math.sqrt(Math.pow(p2.x - p1.x, 2) + Math.pow(p2.y - p1.y, 2));

        if (animPos >= currentLen && animPos < currentLen + segmentLen) {
          let segmentFrac = (animPos - currentLen) / segmentLen;
          let px = p1.x + (p2.x - p1.x) * segmentFrac;
          let py = p1.y + (p2.y - p1.y) * segmentFrac;

          c.beginPath();
          c.arc(px, py, 3 + 1*Math.sin(t*10 + g), 0, Math.PI * 2); // Animate size
          c.fill();
          break;
        }
        currentLen += segmentLen;
      }
    }
    c.shadowBlur = 0; // Shadow'u resetle

    c.restore();
  },
  dusmanCiz: function(c, d, t){
    c.save();
    c.translate(d.x, d.y);

    const coreRadius = d.yaricap;
    const animPhase = (t * 4 + d.faz * Math.PI) % (Math.PI * 2);
    const animOffset = Math.sin(animPhase) * (coreRadius * 0.15); // Y ekseninde yukarı-aşağı salınım

    // Genel dış gölge
    c.shadowColor = "rgba(0,0,0,0.6)"; // Daha belirgin
    c.shadowBlur = d.bos ? 20 : 8; // Daha fazla bulanıklık
    c.shadowOffsetX = 4;
    c.shadowOffsetY = 4 + animOffset * 0.5; // Gölgenin de hafifçe hareket etmesi

    // Ana renk ve kontur için birincil çizim
    c.strokeStyle = "#000000";
    c.lineWidth = 2.5; // Daha kalın kontur
    c.lineJoin = "round";
    c.lineCap = "round";

    if (d.renk === this.palet.dusman) { // Ay Böceği (reddish)
      // Gövde (gradyan ile derinlik)
      let bodyGrad = c.createRadialGradient(0, animOffset, 0, 0, animOffset, coreRadius * 1.0);
      bodyGrad.addColorStop(0, d.renk);
      bodyGrad.addColorStop(0.8, "#AA3333"); // Daha koyu kırmızı
      bodyGrad.addColorStop(1, "#771111"); // En dış kenarlar daha da koyu
      c.fillStyle = bodyGrad;
      c.beginPath();
      c.ellipse(0, animOffset, coreRadius * 1.0, coreRadius * 0.8, 0, 0, Math.PI * 2);
      c.fill();
      c.stroke();

      // Kafa (gradyan ile derinlik)
      let headGrad = c.createRadialGradient(coreRadius * 0.6, animOffset - coreRadius * 0.3, 0, coreRadius * 0.6, animOffset - coreRadius * 0.3, coreRadius * 0.4);
      headGrad.addColorStop(0, d.renk);
      headGrad.addColorStop(1, "#AA3333");
      c.fillStyle = headGrad;
      c.beginPath();
      c.arc(coreRadius * 0.6, animOffset - coreRadius * 0.3, coreRadius * 0.4, 0, Math.PI * 2);
      c.fill();
      c.stroke();

      // Antenler (mevcut)
      c.strokeStyle = "#333333"; // Daha koyu antenler
      c.lineWidth = 2;
      c.beginPath();
      c.moveTo(coreRadius * 0.6, animOffset - coreRadius * 0.3);
      c.lineTo(coreRadius * 0.9, animOffset - coreRadius * 0.7 + animOffset * 0.5);
      c.moveTo(coreRadius * 0.6, animOffset - coreRadius * 0.3);
      c.lineTo(coreRadius * 0.3, animOffset - coreRadius * 0.8 + animOffset * 0.5);
      c.stroke();

      // Bacaklar (mevcut, geliştirelim)
      c.strokeStyle = "#333333"; // Bacaklar da koyu
      c.lineWidth = 2.5;
      for(let i=-1; i<=1; i++){
        let legOffset = i * (coreRadius * 0.4);
        let legAnim = Math.sin(t * 6 + d.faz * Math.PI + i * Math.PI/2) * 0.2;

        // Sol bacak
        c.beginPath();
        c.moveTo(-coreRadius * 0.7, animOffset + legOffset + coreRadius * 0.2);
        c.lineTo(-coreRadius * 1.0, animOffset + legOffset + coreRadius * 0.5 + legAnim * 20);
        c.lineTo(-coreRadius * 1.2, animOffset + legOffset + coreRadius * 0.4 + legAnim * 10);
        c.stroke();

        // Sağ bacak
        c.beginPath();
        c.moveTo(coreRadius * 0.7, animOffset + legOffset + coreRadius * 0.2);
        c.lineTo(coreRadius * 1.0, animOffset + legOffset + coreRadius * 0.5 - legAnim * 20);
        c.lineTo(coreRadius * 1.2, animOffset + legOffset + coreRadius * 0.4 - legAnim * 10);
        c.stroke();
      }

      // Gözler (glowing)
      c.shadowBlur = 0; // Kendi gölgesini kaldırmalıyız
      c.shadowColor = this.palet.vurgu;
      c.shadowBlur = 10 + 5 * Math.sin(t * 5); // Parlayan gözler
      c.fillStyle = this.palet.vurgu;
      c.beginPath();
      c.arc(coreRadius * 0.8, animOffset - coreRadius * 0.4, coreRadius * 0.1, 0, Math.PI * 2);
      c.fill();
      c.beginPath();
      c.arc(coreRadius * 0.5, animOffset - coreRadius * 0.4, coreRadius * 0.1, 0, Math.PI * 2);
      c.fill();

      // İç chitin desenleri (hafif gölge)
      c.shadowBlur = 0;
      c.strokeStyle = "rgba(0,0,0,0.2)";
      c.lineWidth = 1;
      c.beginPath();
      c.ellipse(0, animOffset, coreRadius * 0.8, coreRadius * 0.6, 0, 0, Math.PI * 2);
      c.stroke();
      c.beginPath();
      c.ellipse(0, animOffset, coreRadius * 0.6, coreRadius * 0.4, 0, 0, Math.PI * 2);
      c.stroke();


    } else if (d.renk === this.palet.dusman2) { // Gölge Drone (greenish)
      // Gövde (altıgen, gradyan ile derinlik)
      let bodyGrad = c.createRadialGradient(0, animOffset, 0, 0, animOffset, coreRadius * 1.0);
      bodyGrad.addColorStop(0, d.renk);
      bodyGrad.addColorStop(0.8, "#33AA33");
      bodyGrad.addColorStop(1, "#117711");
      c.fillStyle = bodyGrad;
      c.beginPath();
      for (let i = 0; i < 6; i++) {
          let angle = Math.PI / 3 * i + t * 0.5; // Dönen altıgen
          let x = coreRadius * 1.0 * Math.cos(angle);
          let y = coreRadius * 1.0 * Math.sin(angle) * 0.8 + animOffset;
          if (i === 0) c.moveTo(x, y); else c.lineTo(x, y);
      }
      c.closePath();
      c.fill();
      c.stroke();

      // Kanatlar/iticiler (glowing)
      c.shadowBlur = 0;
      c.shadowColor = this.palet.vurgu; // Iticilerin kendisi parlasın
      c.shadowBlur = 15 + 10 * Math.sin(t * 8); // Parlama animasyonu
      c.fillStyle = "rgba(100,255,100,0.7)"; // Daha opak
      c.beginPath();
      c.ellipse(-coreRadius * 0.8, animOffset, coreRadius * 0.5, coreRadius * 0.25, Math.PI / 4, 0, Math.PI * 2);
      c.fill();
      c.stroke();
      c.beginPath();
      c.ellipse(coreRadius * 0.8, animOffset, coreRadius * 0.5, coreRadius * 0.25, -Math.PI / 4, 0, Math.PI * 2);
      c.fill();
      c.stroke();

      // Merkez çekirdek (daha güçlü parlama)
      c.shadowBlur = 0; // Shadow'u resetle
      c.shadowColor = this.palet.vurgu;
      c.shadowBlur = 20 + 10 * Math.cos(t * 7); // Merkezi çekirdek daha çok parlasın
      c.fillStyle = this.palet.vurgu;
      c.beginPath();
      c.arc(0, animOffset, coreRadius * 0.3, 0, Math.PI * 2);
      c.fill();
      c.shadowBlur = 0; // Shadow'u resetle

      // Enerji çizgileri (iç desen)
      c.strokeStyle = "rgba(255,255,255,0.3)";
      c.lineWidth = 1;
      c.beginPath();
      c.arc(0, animOffset, coreRadius * 0.6, t * 0.5, t * 0.5 + Math.PI);
      c.stroke();
      c.beginPath();
      c.arc(0, animOffset, coreRadius * 0.6, t * 0.5 + Math.PI, t * 0.5 + Math.PI * 2);
      c.stroke();


    } else { // Kaya Titan (grayish)
      // Vücut (düzensiz şekil, gradyan ile derinlik)
      let bodyGrad = c.createRadialGradient(0, animOffset, 0, 0, animOffset, coreRadius * 1.2);
      bodyGrad.addColorStop(0, d.renk);
      bodyGrad.addColorStop(0.8, "#555566");
      bodyGrad.addColorStop(1, "#333344");
      c.fillStyle = bodyGrad;
      c.beginPath();
      c.moveTo(coreRadius * 0.8 * Math.cos(t * 0.2), coreRadius * 0.8 * Math.sin(t * 0.2) * 0.8 + animOffset);
      for(let i=1; i<8; i++){ // Daha fazla nokta için daha düzensiz
        let r = coreRadius * (0.9 + 0.3 * Math.sin(t*0.5 + i) + Math.random()*0.2); // Daha belirgin dış çıkıntılar
        let angle = (Math.PI * 2 / 8) * i;
        c.lineTo(r * Math.cos(angle), r * Math.sin(angle) * 0.8 + animOffset);
      }
      c.closePath();
      c.fill();
      c.stroke();

      // Kaya parçacıkları/desenleri (iç desen)
      c.fillStyle = "rgba(0,0,0,0.25)"; // Daha koyu
      for(let i=0; i<6; i++){ // Daha fazla parça
        c.beginPath();
        c.arc(Math.cos(t*0.7+i)*coreRadius*0.5, Math.sin(t*0.7+i)*coreRadius*0.4 + animOffset, coreRadius*0.2 + Math.sin(t*2+i)*0.05, 0, Math.PI * 2); // Hafif animasyon
        c.fill();
      }
      // Parlayan çatlaklar (seviye 2 detayı gibi)
      c.shadowBlur = 0;
      c.strokeStyle = "rgba(255, 255, 150, " + (0.3 + 0.2*Math.sin(t*4)) + ")";
      c.shadowColor = "rgba(255, 255, 150, 0.8)";
      c.shadowBlur = 5;
      c.lineWidth = 1;
      c.beginPath();
      c.moveTo(-coreRadius * 0.5, animOffset - coreRadius * 0.2);
      c.lineTo(0, animOffset - coreRadius * 0.1);
      c.lineTo(coreRadius * 0.4, animOffset - coreRadius * 0.3);
      c.stroke();
      c.beginPath();
      c.moveTo(coreRadius * 0.3, animOffset + coreRadius * 0.2);
      c.lineTo(-coreRadius * 0.1, animOffset + coreRadius * 0.3);
      c.stroke();
      c.shadowBlur = 0;

      // Gözler (tek, büyük, glowing)
      c.shadowBlur = 0; // Shadow'u resetle
      c.shadowColor = this.palet.vurgu;
      c.shadowBlur = 12 + 8 * Math.sin(t * 6); // Parlayan göz
      c.fillStyle = this.palet.vurgu;
      c.beginPath();
      c.ellipse(0, animOffset - coreRadius * 0.4, coreRadius * 0.25, coreRadius * 0.15, 0, 0, Math.PI * 2);
      c.fill();
      c.shadowBlur = 0; // Shadow'u resetle
    }
    c.shadowBlur = 0;
    c.restore();
  },
  kuleCiz: function(c, k, t){
    c.save();
    c.translate(k.x, k.y);

    const baseColor = k.tip.renk;
    const detailColor = this.palet.vurgu;
    const towerScale = 1 + k.seviye * 0.1;

    // Kule boyutlarını sınırlar içinde tutmak için ayarlamalar
    const effectiveBaseRadius = Math.min(20 * towerScale, 28); // Max taban yarıçapı 28 (eskisi 26)
    const barrelWidth = Math.min(8 * towerScale, 14); // Lazer namlu genişliği, max 14 (eskisi 12)
    const plasmaBarrelHeight = Math.min(16 * towerScale, 28); // Plazma için namlu yüksekliği, max 28 (eskisi 24)

    c.strokeStyle = "#000000";
    c.lineWidth = 2;
    c.lineJoin = "round";
    c.lineCap = "round";

    // Genel kule gölgesi
    c.shadowColor = "rgba(0,0,0,0.6)"; // Daha belirgin
    c.shadowBlur = 10;
    c.shadowOffsetX = 4;
    c.shadowOffsetY = 4;

    // Taban - Alttaki destek platformu
    let baseGrad = c.createRadialGradient(0, 0, 0, 0, 0, effectiveBaseRadius);
    baseGrad.addColorStop(0, "#8888AA");
    baseGrad.addColorStop(0.8, "#555577");
    baseGrad.addColorStop(1, "#333344"); // Koyu dış kenar
    c.fillStyle = baseGrad;
    c.beginPath();
    c.arc(0, 0, effectiveBaseRadius, 0, Math.PI * 2);
    c.fill();
    c.stroke();

    // Gövde (dönen kısım, rotasyondan önce çiziliyor ama dönme merkezi burası)
    let bodyGrad = c.createRadialGradient(0, 0, 0, 0, 0, effectiveBaseRadius * 0.7);
    bodyGrad.addColorStop(0, baseColor);
    bodyGrad.addColorStop(0.7, "#333333"); // Koyu iç kısım
    bodyGrad.addColorStop(1, baseColor); // Tekrar dışa doğru rengi

    c.fillStyle = bodyGrad;
    c.beginPath();
    c.arc(0, 0, effectiveBaseRadius * 0.7, 0, Math.PI * 2);
    c.fill();
    c.stroke();

    // Seviye detayları:
    c.shadowBlur = 0; // Detaylar için ayrı gölge
    c.shadowColor = detailColor;

    if (k.seviye >= 1) { // Lazer kulelerde basit bir ışık göstergesi
      c.fillStyle = detailColor;
      c.shadowBlur = 5 + 3 * Math.sin(t*5);
      c.beginPath();
      c.arc(effectiveBaseRadius * 0.4 * Math.cos(t*0.5), effectiveBaseRadius * 0.4 * Math.sin(t*0.5), 2, 0, Math.PI * 2);
      c.fill();
    }
    if (k.seviye >= 2) {
      c.fillStyle = detailColor;
      c.shadowBlur = 8 + 4 * Math.cos(t*4);
      c.beginPath();
      c.arc(effectiveBaseRadius * 0.5 * Math.cos(t*0.5 + Math.PI/2), effectiveBaseRadius * 0.5 * Math.sin(t*0.5 + Math.PI/2), 3, 0, Math.PI * 2);
      c.fill();
      c.beginPath();
      c.arc(effectiveBaseRadius * 0.5 * Math.cos(t*0.5 + Math.PI*1.5), effectiveBaseRadius * 0.5 * Math.sin(t*0.5 + Math.PI*1.5), 3, 0, Math.PI * 2);
      c.fill();
    }
    if (k.seviye === 3) { // Seviye 3 için daha gelişmiş desen
      c.shadowBlur = 10 + 5 * Math.sin(t*6);
      c.strokeStyle = detailColor;
      c.lineWidth = 1.5;
      c.beginPath();
      c.arc(0, 0, effectiveBaseRadius * 0.6, t * 1.5, t * 1.5 + Math.PI * 0.8);
      c.stroke();
      c.beginPath();
      c.arc(0, 0, effectiveBaseRadius * 0.6, t * 1.5 + Math.PI, t * 1.5 + Math.PI * 1.8);
      c.stroke();
    }
    c.shadowBlur = 0; // Shadow'u resetle

    // Namlu ve ateşleme animasyonu için dönüş
    c.rotate(k.aci);

    // Namlu (Dönen kısım) - +X yönünde çizilmeli
    c.shadowColor = "rgba(0,0,0,0.5)";
    c.shadowBlur = 8;
    c.shadowOffsetX = 3;
    c.shadowOffsetY = 3;

    let effectiveBarrelLength = 0;
    let effectiveTipRadius = 0;

    if (k.tip.ad === "Lazer Kule") {
      effectiveBarrelLength = Math.min(20 * towerScale, 26);
      effectiveTipRadius = Math.min(6 * towerScale, 4);

      let barrelGrad = c.createLinearGradient(0, -barrelWidth / 2, effectiveBarrelLength, barrelWidth / 2);
      barrelGrad.addColorStop(0, "#444444"); // Gövdeye yakın koyu
      barrelGrad.addColorStop(0.5, baseColor); // Orta kısım ana renk
      barrelGrad.addColorStop(1, "#666666"); // Uca yakın koyu
      c.fillStyle = barrelGrad;

      c.fillRect(0, -barrelWidth / 2, effectiveBarrelLength, barrelWidth);
      c.strokeRect(0, -barrelWidth / 2, effectiveBarrelLength, barrelWidth);

      // Namlu ucu detayı (glowing)
      c.shadowBlur = 0;
      c.shadowColor = detailColor;
      c.shadowBlur = 10 + 5 * Math.sin(t * 10); // Parlama animasyonu
      c.fillStyle = detailColor;
      c.beginPath();
      c.arc(effectiveBarrelLength, 0, effectiveTipRadius, 0, Math.PI * 2);
      c.fill();
      c.stroke();

      // Ateşleme flaşı (daha belirgin)
      if (k.flas > 0) {
        c.shadowBlur = 0; // Kendi flaşının shadow'u ayrı yönetilecek
        c.shadowColor = detailColor;
        c.shadowBlur = 30 * k.flas; // Daha güçlü flaş
        c.fillStyle = "rgba(255, 255, 150, " + k.flas + ")";
        c.beginPath();
        c.arc(effectiveBarrelLength + effectiveTipRadius + 5, 0, 10 * k.flas * towerScale * 0.7, 0, Math.PI * 2); // Daha büyük flaş
        c.fill();
        c.shadowBlur = 0;
      }
    } else if (k.tip.ad === "Plazma Topu") {
      effectiveBarrelLength = Math.min(14 * towerScale, 20);
      effectiveTipRadius = Math.min(10 * towerScale, 8);

      let barrelGrad = c.createLinearGradient(0, -plasmaBarrelHeight / 2, effectiveBarrelLength, plasmaBarrelHeight / 2);
      barrelGrad.addColorStop(0, "#664433");
      barrelGrad.addColorStop(0.5, baseColor);
      barrelGrad.addColorStop(1, "#885544");
      c.fillStyle = barrelGrad;

      c.fillRect(0, -plasmaBarrelHeight / 2, effectiveBarrelLength, plasmaBarrelHeight);
      c.strokeRect(0, -plasmaBarrelHeight / 2, effectiveBarrelLength, plasmaBarrelHeight);

      // Namlu ağzı (glowing)
      c.shadowBlur = 0;
      c.shadowColor = detailColor;
      c.shadowBlur = 15 + 8 * Math.sin(t * 8); // Parlama animasyonu
      c.fillStyle = detailColor;
      c.beginPath();
      c.arc(effectiveBarrelLength, 0, effectiveTipRadius, 0, Math.PI * 2);
      c.fill();
      c.stroke();

      // Ateşleme flaşı (daha belirgin)
      if (k.flas > 0) {
        c.shadowBlur = 0;
        c.shadowColor = detailColor;
        c.shadowBlur = 35 * k.flas; // Daha güçlü flaş
        c.fillStyle = "rgba(255, 180, 100, " + k.flas + ")";
        c.beginPath();
        c.arc(effectiveBarrelLength + effectiveTipRadius + 7, 0, 15 * k.flas * towerScale * 0.7, 0, Math.PI * 2); // Daha büyük flaş
        c.fill();
        c.shadowBlur = 0;
      }
    } else if (k.tip.ad === "Yerçekimi Yavaşlatıcı") {
      // Yavaşlatıcı: Merkezde dönen enerji alanı
      c.shadowBlur = 0;
      c.shadowColor = "rgba(0,0,0,0.5)"; // Kendi gölgesi
      c.shadowBlur = 8;
      c.shadowOffsetX = 3;
      c.shadowOffsetY = 3;

      let innerGrad = c.createRadialGradient(0, 0, 0, 0, 0, effectiveBaseRadius * 0.6);
      innerGrad.addColorStop(0, "#8855AA");
      innerGrad.addColorStop(0.7, baseColor);
      innerGrad.addColorStop(1, "#663388");
      c.fillStyle = innerGrad;
      c.beginPath();
      c.arc(0, 0, effectiveBaseRadius * 0.6, 0, Math.PI * 2);
      c.fill();
      c.stroke();

      // Dönen enerji jeneratörü (glowing)
      c.shadowBlur = 0;
      c.shadowColor = detailColor;
      c.shadowBlur = 20 + 15 * Math.sin(t * 5); // Daha güçlü parlama
      c.fillStyle = "rgba(200, 150, 255, " + (0.7 + 0.3 * Math.sin(t*5)) + ")";
      c.beginPath();
      c.arc(0, 0, effectiveBaseRadius * 0.4, 0, Math.PI * 2);
      c.fill();
      c.shadowBlur = 0;

      // Yavaşlatıcı alan animasyonu (görsel efekt)
      c.shadowColor = detailColor;
      c.shadowBlur = 10;
      c.strokeStyle = "rgba(200, 150, 255, " + (0.5 + 0.3 * Math.sin(t*2)) + ")";
      c.lineWidth = 4; // Daha belirgin dalga
      c.beginPath();
      c.arc(0, 0, effectiveBaseRadius * (0.8 + 0.1 * Math.sin(t*3)), 0, Math.PI * 2);
      c.stroke();

      c.strokeStyle = "rgba(200, 150, 255, " + (0.3 + 0.2 * Math.cos(t*2.5)) + ")";
      c.lineWidth = 2;
      c.beginPath();
      c.arc(0, 0, effectiveBaseRadius * (0.6 + 0.15 * Math.cos(t*3)), t*2, t*2 + Math.PI*1.5); // İkinci, dönen halka
      c.stroke();
    }
    c.shadowBlur = 0;
    c.restore();
  }
};

  const yolUzunluklari = [];

    const d = Math.hypot(yol[i+1].x-yol[i].x, yol[i+1].y-yol[i].y);

  }
  function yolNoktasi(mesafe){

    for (let i=0;i<yolUzunluklari.length;i++){
      if (kalan <= yolUzunluklari[i]){
        const o = kalan / (yolUzunluklari[i] || 1);
        return {x: yol[i].x + (yol[i+1].x-yol[i].x)*o,
                y: yol[i].y + (yol[i+1].y-yol[i].y)*o,
                aci: Math.atan2(yol[i+1].y-yol[i].y, yol[i+1].x-yol[i].x)};
      }

  const DUSMAN_TIPLERI = (T.dusmanTipleri && T.dusmanTipleri.length) ? T.dusmanTipleri : varsayilanDusmanlar;
  const KULE_TIPLERI  = (T.kuleTipleri && T.kuleTipleri.length)  ? T.kuleTipleri  : varsayilanKuleler;

  // ---------- Yardımcı ----------
  function rastgele(a,b){ return a + Math.random()*(b-a); }
  function mesafe(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }

  function boyutlandir(){
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.floor(window.innerWidth * dpr);
    canvas.height = Math.floor(window.innerHeight * dpr);
    const o = Math.min(canvas.width/REF_W, canvas.height/REF_H);
    olcek = o;
    kaydirX = (canvas.width - REF_W*o)/2;
    kaydirY = (canvas.height - REF_H*o)/2;
  }
  window.addEventListener("resize", boyutlandir);

  function olayNoktasi(e){
    const r = canvas.getBoundingClientRect();
    const kx = (e.touches && e.touches[0]) ? e.touches[0].clientX :
               (e.changedTouches && e.changedTouches[0]) ? e.changedTouches[0].clientX : e.clientX;
    const ky = (e.touches && e.touches[0]) ? e.touches[0].clientY :
               (e.changedTouches && e.changedTouches[0]) ? e.changedTouches[0].clientY : e.clientY;
    const px = (kx - r.left) * (canvas.width / r.width);
    const py = (ky - r.top) * (canvas.height / r.height);
    return {x: (px - kaydirX)/olcek, y: (py - kaydirY)/olcek};
  }

  function yolaYakinMi(p, esik){
    for (let i=0;i<yol.length-1;i++){
      const a=yol[i], b=yol[i+1];
      const dx=b.x-a.x, dy=b.y-a.y;
      const uzun = dx*dx+dy*dy || 1;
      let t = ((p.x-a.x)*dx + (p.y-a.y)*dy)/uzun;
      t = Math.max(0, Math.min(1, t));
      const px=a.x+dx*t, py=a.y+dy*t;
      if (Math.hypot(p.x-px, p.y-py) < esik) return true;
    }
    return false;
  }

  // ---------- Dalga üretimi ----------
  function dalgaOlustur(n){
    const bos = (n % 5 === 0);           // 5. ve 10. dalga boss
    const adet = bos ? 1 + Math.floor(n/3) : 5 + n*2;
    const gucCarpani = Math.pow(1.28, n-1);
    const liste = [];
    for (let i=0;i<adet;i++){
      const tip = DUSMAN_TIPLERI[Math.min(DUSMAN_TIPLERI.length-1,
                    Math.floor(Math.random()*Math.min(DUSMAN_TIPLERI.length, 1+Math.floor(n/3))))];
      liste.push({tip:tip, bos: bos && i===0, guc:gucCarpani});
    }
    return liste;
  }

  function dusmanEkle(kayit){
    const t = kayit.tip;
    const bosCarpan = kayit.bos ? 6 : 1;
    dusmanlar.push({
      tip:t, mesafe:-rastgele(0,40),
      maxCan: t.can*kayit.guc*bosCarpan, can: t.can*kayit.guc*bosCarpan,
      hiz: t.hiz*(kayit.bos?0.72:1), altin: Math.round(t.altin*(kayit.bos?8:1)),
      yaricap: (t.yaricap||14)*(kayit.bos?1.9:1), renk: t.renk||P.dusman,
      bos: !!kayit.bos, yavaslama:1, yavaslamaSayac:0, faz: Math.random()*6.28,
      vurulmaZaman:0, x:0, y:0, aci:0
    });
  }

  // ---------- Oyun kontrolü ----------
  function sifirla(){
    can=BASLANGIC_CAN; altin=BASLANGIC_ALTIN; dalga=0; skor=0; combo=1; comboZaman=0;
    dusmanlar=[]; kuleler=[]; mermiler=[]; parcaciklar=[]; yaziEfektleri=[];
    dalgaKuyrugu=[]; spawnKuyrugu=[]; dalgaAraSayac=3; dalgaAktif=false; spawnSayac=0;
    seciliKule=null; seciliKuleTipi=0; ekranSarsinti=0; donmaSuresi=0;
    kulePaneliCiz();
    hudGuncelle();
  }

  function basla(){
    sifirla();
    asama="oyunda";
    document.getElementById("menuOverlay").classList.add("gizli");
    document.getElementById("sonOverlay").classList.add("gizli");
    document.getElementById("kuleMenu").classList.add("gizli");
  }

  function bitir(kazandiMi){
    asama = kazandiMi ? "kazandi" : "kaybetti";
    document.getElementById("sonBaslik").textContent = kazandiMi ? "Kazandın!" : "Kaybettin";
    document.getElementById("sonMetin").textContent =
      (kazandiMi ? "Tüm dalgaları püskürttün. " : "Savunma çöktü. ") + "Skor: " + skor;
    document.getElementById("sonOverlay").classList.remove("gizli");
    document.getElementById("kuleMenu").classList.add("gizli");
  }

  function uyariGoster(metin){
    const u = document.getElementById("uyari");
    u.textContent = metin;
    u.classList.add("gorunur");
    setTimeout(()=>u.classList.remove("gorunur"), 1400);
  }

  // ---------- HUD ----------
  function hudGuncelle(){
    document.getElementById("hudCan").textContent = Math.max(0, can);
    document.getElementById("hudAltin").textContent = altin;
    document.getElementById("hudDalga").textContent = dalga;
    document.getElementById("hudToplamDalga").textContent = TOPLAM_DALGA;
    document.getElementById("hudSkor").textContent = skor;
    // JUICE: can azaldıkça kırmızı vinyet belirginleşir (renk dili / durum uyarısı)
    const oran = can / BASLANGIC_CAN;
    document.getElementById("vinyet").style.opacity =
      oran < 0.35 ? String((1 - oran/0.35) * 0.85) : "0";
    const c = document.getElementById("hudCombo");
    if (combo > 1){ c.style.display="block";
      document.getElementById("hudComboSayi").textContent = combo; }
    else c.style.display="none";
    Array.from(document.querySelectorAll(".kule-btn")).forEach((b,i)=>{
      b.disabled = altin < KULE_TIPLERI[i].fiyat;
      b.classList.toggle("secili", i===seciliKuleTipi);
    });
  }

  function kulePaneliCiz(){
    const panel = document.getElementById("kulePanel");
    panel.innerHTML = "";
    KULE_TIPLERI.forEach((k,i)=>{
      const b = document.createElement("button");
      b.className = "kule-btn" + (i===0 ? " secili" : "");
      b.innerHTML = k.ad + "<br><span style='opacity:.7'>" + k.fiyat + " altın</span>";
      b.addEventListener("click", (e)=>{ e.stopPropagation(); seciliKuleTipi=i; hudGuncelle(); });
      panel.appendChild(b);
    });
  }

  // ---------- Etkileşim ----------
  function haritayaDokun(e){
    if (asama !== "oyunda") return;
    e.preventDefault();
    const p = olayNoktasi(e);

    // Kurulu kuleye dokunulduysa menü aç
    for (const k of kuleler){
      if (mesafe(p,k) < 26){ seciliKule = k; kuleMenusuAc(); return; }
    }
    // Yeni kule kur
    const tip = KULE_TIPLERI[seciliKuleTipi];
    if (altin < tip.fiyat){ uyariGoster("Yetersiz altın!"); return; }
    if (yolaYakinMi(p, 34)){ uyariGoster("Yola kule kurulamaz!"); return; }
    for (const k of kuleler){ if (mesafe(p,k) < 40){ uyariGoster("Çok yakın!"); return; } }
    if (p.x<10||p.y<10||p.x>REF_W-10||p.y>REF_H-10) return;

    kuleler.push({x:p.x, y:p.y, tip:tip, seviye:1, sayac:0, aci:-Math.PI/2,
                  menzil:tip.menzil, hasar:tip.hasar, yatirim:tip.fiyat, flas:0});
    altin -= tip.fiyat;
    hudGuncelle();
  }
  canvas.addEventListener("click", haritayaDokun);
  canvas.addEventListener("touchstart", haritayaDokun, {passive:false});

  function kuleMenusuAc(){
    if (!seciliKule) return;
    const k = seciliKule;
    document.getElementById("kmBaslik").textContent = k.tip.ad + " (Sv." + k.seviye + ")";
    document.getElementById("kmBilgi").textContent =
      "Hasar: " + Math.round(k.hasar) + " | Menzil: " + Math.round(k.menzil) +
      " | Yükseltme: " + yukseltmeFiyati(k) + " altın | Satış: " + Math.floor(k.yatirim*0.6) + " altın";
    document.getElementById("kmYukselt").disabled = (k.seviye>=3 || altin<yukseltmeFiyati(k));
    document.getElementById("kuleMenu").classList.remove("gizli");
  }
  function yukseltmeFiyati(k){ return Math.round(k.tip.fiyat * 0.8 * k.seviye); }

  document.getElementById("kmYukselt").addEventListener("click", ()=>{
    const k = seciliKule; if (!k) return;
    const f = yukseltmeFiyati(k);
    if (k.seviye<3 && altin>=f){
      altin-=f; k.yatirim+=f; k.seviye++;
      k.hasar*=1.6; k.menzil*=1.15;
    }
    document.getElementById("kuleMenu").classList.add("gizli");
    seciliKule=null; hudGuncelle();
  });
  document.getElementById("kmSat").addEventListener("click", ()=>{
    if (seciliKule){
      altin += Math.floor(seciliKule.yatirim*0.6);
      kuleler = kuleler.filter(x=>x!==seciliKule);
    }
    document.getElementById("kuleMenu").classList.add("gizli");
    seciliKule=null; hudGuncelle();
  });
  document.getElementById("kmKapat").addEventListener("click", ()=>{
    document.getElementById("kuleMenu").classList.add("gizli"); seciliKule=null;
  });
  document.getElementById("baslaBtn").addEventListener("click", basla);
  document.getElementById("yenidenBtn").addEventListener("click", basla);

  // ---------- Efektler ----------
  function patlamaEkle(x,y,renk,adet){
    for (let i=0;i<(adet||10);i++){
      const a = Math.random()*Math.PI*2, h = rastgele(60,190);
      parcaciklar.push({x:x,y:y,vx:Math.cos(a)*h,vy:Math.sin(a)*h,
                        omur:rastgele(0.3,0.75), yas:0, renk:renk, boyut:rastgele(2,4.5)});
    }
  }
  function yaziEkle(x,y,metin,renk){
    yaziEfektleri.push({x:x,y:y,metin:metin,renk:renk||P.metin,omur:0.9,yas:0});
  }

  // ---------- Güncelleme ----------
  function guncelle(dt){
    zaman += dt;
    if (ekranSarsinti>0) ekranSarsinti = Math.max(0, ekranSarsinti - dt*2.2);  // JUICE: sönümlen
    if (asama !== "oyunda") return;

    // Combo zaman aşımı
    if (combo>1){ comboZaman-=dt; if (comboZaman<=0){ combo=1; hudGuncelle(); } }

    // Dalga yönetimi
    if (!dalgaAktif && spawnKuyrugu.length===0 && dusmanlar.length===0){
      dalgaAraSayac -= dt;
      if (dalgaAraSayac<=0){
        if (dalga >= TOPLAM_DALGA){ bitir(true); return; }
        dalga++;
        spawnKuyrugu = dalgaOlustur(dalga);
        dalgaAktif = true; spawnSayac = 0;
        uyariGoster("Dalga " + dalga + " geliyor!");
        hudGuncelle();
      }
    }
    if (dalgaAktif){
      spawnSayac -= dt;
      if (spawnSayac<=0 && spawnKuyrugu.length){
        dusmanEkle(spawnKuyrugu.shift());
        spawnSayac = 0.75;
      }
      if (spawnKuyrugu.length===0) dalgaAktif=false;
    }
    if (!dalgaAktif && spawnKuyrugu.length===0 && dusmanlar.length===0 && dalgaAraSayac<=0){
      dalgaAraSayac = DALGA_ARASI;
    }

    // Düşmanlar
    for (let i=dusmanlar.length-1;i>=0;i--){
      const d = dusmanlar[i];
      if (d.vurulmaZaman>0) d.vurulmaZaman = Math.max(0, d.vurulmaZaman - dt);
      if (d.yavaslamaSayac>0){ d.yavaslamaSayac-=dt; if (d.yavaslamaSayac<=0) d.yavaslama=1; }
      d.mesafe += d.hiz * d.yavaslama * dt;
      const n = yolNoktasi(d.mesafe);
      d.x=n.x; d.y=n.y; d.aci=n.aci;
      if (T.dusmanGuncelle) { try { T.dusmanGuncelle(d, dt, zaman); } catch(e){} }
      if (d.mesafe >= yolToplam){
        dusmanlar.splice(i,1);
        can -= d.bos ? 5 : 1;
        combo=1;
        ekranSarsinti = Math.min(1, ekranSarsinti + (d.bos ? 0.55 : 0.3));  // JUICE
        patlamaEkle(d.x,d.y,"#ef4444",8);
        hudGuncelle();
        if (can<=0){ can=0; hudGuncelle(); bitir(false); return; }
      }
    }

    // Kuleler
    for (const k of kuleler){
      k.sayac -= dt;
      if (k.flas>0) k.flas-=dt;
      let hedef=null, enYakin=1e9;
      for (const d of dusmanlar){
        const m = mesafe(k,d);
        if (m<=k.menzil && d.mesafe>enYakin*0-1 && m<enYakin){ enYakin=m; hedef=d; }
      }
      if (hedef){
        k.aci = Math.atan2(hedef.y-k.y, hedef.x-k.x);
        if (k.sayac<=0){
          k.sayac = 1/(k.tip.atisHizi||1);
          k.flas = 0.08;
          mermiler.push({x:k.x,y:k.y,hedef:hedef,hiz:k.tip.mermiHizi||320,
                         hasar:k.hasar, renk:k.tip.renk||P.mermi,
                         alan:k.tip.alan||0, yavaslat:k.tip.yavaslat||0, iz:[]});
        }
      }
    }

    // Mermiler
    for (let i=mermiler.length-1;i>=0;i--){
      const m = mermiler[i];
      if (!m.hedef || m.hedef.can<=0 || dusmanlar.indexOf(m.hedef)===-1){ mermiler.splice(i,1); continue; }
      const dx=m.hedef.x-m.x, dy=m.hedef.y-m.y, uz=Math.hypot(dx,dy)||1;
      m.iz.push({x:m.x,y:m.y}); if (m.iz.length>6) m.iz.shift();
      m.x += dx/uz*m.hiz*dt; m.y += dy/uz*m.hiz*dt;
      if (uz < 14){
        vurus(m, m.hedef);
        mermiler.splice(i,1);
      }
    }

    // Parçacıklar / yazılar
    for (let i=parcaciklar.length-1;i>=0;i--){
      const p=parcaciklar[i]; p.yas+=dt;
      if (p.yas>=p.omur){ parcaciklar.splice(i,1); continue; }
      p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=180*dt;
    }
    for (let i=yaziEfektleri.length-1;i>=0;i--){
      const y=yaziEfektleri[i]; y.yas+=dt; y.y-=26*dt;
      if (y.yas>=y.omur) yaziEfektleri.splice(i,1);
    }
    if (T.guncelle) { try { T.guncelle(dt, zaman, {dusmanlar,kuleler,dalga}); } catch(e){} }
  }

  function vurus(m, d){
    const hedefler = m.alan ? dusmanlar.filter(x=>mesafe(x,d)<=m.alan) : [d];
    for (const h of hedefler){
      h.can -= m.hasar;
      h.vurulmaZaman = 0.14;  // JUICE: sıkışma-esneme animasyonu tetiklenir
      if (m.yavaslat){ h.yavaslama=m.yavaslat; h.yavaslamaSayac=1.6; }
      if (h.can<=0){
        const idx = dusmanlar.indexOf(h);
        if (idx>-1){
          dusmanlar.splice(idx,1);
          const kazanc = Math.round(h.altin*combo);
          altin += kazanc; skor += Math.round(10*combo*(h.bos?5:1));
          combo = Math.min(5, combo+1); comboZaman = 3;
          patlamaEkle(h.x,h.y,h.renk, h.bos?22:11);
          yaziEkle(h.x,h.y,"+"+kazanc, "#fbbf24");
          if (h.bos){                          // JUICE: boss ölümünde ağırlık hissi
            donmaSuresi = Math.max(donmaSuresi, 0.09);
            ekranSarsinti = Math.min(1, ekranSarsinti + 0.7);
          }
          hudGuncelle();
        }
      } else {
        yaziEkle(h.x, h.y-10, "-"+Math.round(m.hasar), "#fca5a5");
      }
    }
    patlamaEkle(m.x,m.y,m.renk,4);
  }

  // ---------- Çizim ----------
  function varsayilanArkaplan(c,W,H,t){
    const g = c.createLinearGradient(0,0,0,H);
    g.addColorStop(0,P.arka1); g.addColorStop(1,P.arka2);
    c.fillStyle=g; c.fillRect(0,0,W,H);
  }
  function varsayilanYol(c){
    c.lineCap="round"; c.lineJoin="round";
    c.strokeStyle=P.yolKenar; c.lineWidth=46;
    c.beginPath(); c.moveTo(yol[0].x,yol[0].y);
    for (let i=1;i<yol.length;i++) c.lineTo(yol[i].x,yol[i].y);
    c.stroke();
    c.strokeStyle=P.yol; c.lineWidth=36; c.stroke();
  }
  function varsayilanDusman(c,d,t){
    c.save(); c.translate(d.x,d.y);
    const sal = Math.sin(t*6+d.faz)*0.12;
    c.rotate(sal);
    c.fillStyle="rgba(0,0,0,.28)";
    c.beginPath(); c.ellipse(0,d.yaricap*0.8,d.yaricap*0.9,d.yaricap*0.35,0,0,6.29); c.fill();
    c.fillStyle=d.renk;
    c.beginPath(); c.arc(0,0,d.yaricap,0,6.29); c.fill();
    c.fillStyle="rgba(255,255,255,.85)";
    c.beginPath(); c.arc(-d.yaricap*0.3,-d.yaricap*0.25,d.yaricap*0.18,0,6.29);
    c.arc(d.yaricap*0.3,-d.yaricap*0.25,d.yaricap*0.18,0,6.29); c.fill();
    c.restore();
  }
  function varsayilanKule(c,k,t){
    c.save(); c.translate(k.x,k.y);
    c.fillStyle="rgba(0,0,0,.3)";
    c.beginPath(); c.ellipse(0,14,20,7,0,0,6.29); c.fill();
    c.fillStyle="#1f2937";
    c.beginPath(); c.arc(0,0,19,0,6.29); c.fill();
    c.fillStyle=k.tip.renk||P.kule;
    c.beginPath(); c.arc(0,0,14,0,6.29); c.fill();
    c.rotate(k.aci);
    c.fillStyle="#111827"; c.fillRect(0,-4,26,8);
    if (k.flas>0){ c.fillStyle="#fff"; c.beginPath(); c.arc(28,0,7,0,6.29); c.fill(); }
    c.restore();
    for (let i=0;i<k.seviye-1;i++){
      c.fillStyle=P.vurgu;
      c.beginPath(); c.arc(k.x-6+i*6, k.y-24, 3, 0, 6.29); c.fill();
    }
  }

  function canBari(c,d){
    if (d.can>=d.maxCan) return;
    const g = d.bos?60:30, y=d.y-d.yaricap-10;
    c.fillStyle="rgba(0,0,0,.6)"; c.fillRect(d.x-g/2,y,g,d.bos?7:4);
    c.fillStyle= d.bos?"#f43f5e":"#22c55e";
    c.fillRect(d.x-g/2,y,g*Math.max(0,d.can/d.maxCan),d.bos?7:4);
  }

  function ambiyansCiz(c,t){
    c.save(); c.globalAlpha=.3; c.fillStyle = P.vurgu;
    for (const a of ambiyansParcaciklari){
      const y = ((a.y + t*a.hiz) % (REF_H+20)) - 10;
      const x = a.x + Math.sin(t*0.5+a.faz)*14;
      c.beginPath(); c.arc(x,y,a.boyut,0,6.29); c.fill();
    }
    c.restore();
  }

  function ciz(){
    ctx.setTransform(1,0,0,1,0,0);
    ctx.fillStyle="#05080f"; ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.setTransform(olcek,0,0,olcek,kaydirX,kaydirY);

    // JUICE: ekran sarsıntısı (sadece dünyayı etkiler, HUD ayrı DOM katmanında olduğu için sarsılmaz)
    if (ekranSarsinti>0.01){
      const guc = ekranSarsinti*ekranSarsinti;
      ctx.translate((Math.random()*2-1)*10*guc, (Math.random()*2-1)*10*guc);
    }

    try { (T.arkaplanCiz || varsayilanArkaplan)(ctx, REF_W, REF_H, zaman); }
    catch(e){ varsayilanArkaplan(ctx, REF_W, REF_H, zaman); }
    ambiyansCiz(ctx, zaman);  // JUICE: her temada otomatik yüzen parıltı zerreleri
    try { (T.yolCiz || varsayilanYol)(ctx, yol, zaman); }
    catch(e){ varsayilanYol(ctx); }

    // Seçili kule tipinin menzil önizlemesi yok; kurulu kulelerin menzili seçiliyken
    if (seciliKule){
      ctx.strokeStyle="rgba(56,189,248,.55)"; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(seciliKule.x,seciliKule.y,seciliKule.menzil,0,6.29); ctx.stroke();
    }

    for (const k of kuleler){
      // JUICE: kule altında yumuşak ışık halesi (her tema için otomatik, Gemini'ye bağlı değil)
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      const renk = (k.tip.renk || P.kule);
      const glowR = 30 + Math.sin(zaman*2 + k.x*0.01)*3 + (k.flas>0 ? 16 : 0);
      try {
        const g = ctx.createRadialGradient(k.x,k.y,0,k.x,k.y,glowR);
        g.addColorStop(0, renk+"33"); g.addColorStop(1, renk+"00");
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(k.x,k.y,glowR,0,6.29); ctx.fill();
      } catch(e){}
      ctx.restore();

      ctx.save();
      ctx.beginPath(); ctx.rect(k.x-46, k.y-46, 92, 92); ctx.clip();  // taşan çizimi kırp
      try { (T.kuleCiz || varsayilanKule)(ctx,k,zaman); }
      catch(e){ varsayilanKule(ctx,k,zaman); }
      ctx.restore();
    }
    for (const d of dusmanlar){
      // Kontrast halkası: eklenti düşmanı zeminle aynı renk yapsa bile ayrışsın
      ctx.save();
      ctx.strokeStyle="rgba(0,0,0,.55)"; ctx.lineWidth=3;
      ctx.beginPath(); ctx.arc(d.x,d.y,d.yaricap*1.05,0,6.29); ctx.stroke();
      ctx.strokeStyle="rgba(255,255,255,.35)"; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.arc(d.x,d.y,d.yaricap*1.05,0,6.29); ctx.stroke();
      ctx.restore();

      // JUICE: vurulunca sıkışma-esneme (squash & stretch)
      let sx=1, sy=1;
      if (d.vurulmaZaman>0){
        const o = d.vurulmaZaman/0.14;
        sx = 1 + 0.22*o; sy = 1 - 0.22*o;
      }
      ctx.save();
      ctx.translate(d.x,d.y); ctx.scale(sx,sy); ctx.translate(-d.x,-d.y);
      ctx.beginPath(); ctx.rect(d.x-d.yaricap*2, d.y-d.yaricap*2.4,
                                d.yaricap*4, d.yaricap*4.4); ctx.clip();
      try { (T.dusmanCiz || varsayilanDusman)(ctx,d,zaman); }
      catch(e){ varsayilanDusman(ctx,d,zaman); }
      ctx.restore();
      canBari(ctx,d);
    }
    for (const m of mermiler){
      ctx.strokeStyle=m.renk; ctx.lineWidth=2; ctx.globalAlpha=.5;
      ctx.beginPath();
      m.iz.forEach((p,i)=> i? ctx.lineTo(p.x,p.y) : ctx.moveTo(p.x,p.y));
      ctx.stroke(); ctx.globalAlpha=1;
      ctx.fillStyle=m.renk; ctx.beginPath(); ctx.arc(m.x,m.y,4,0,6.29); ctx.fill();
    }
    for (const p of parcaciklar){
      ctx.globalAlpha = Math.max(0, 1-p.yas/p.omur);
      ctx.fillStyle=p.renk;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.boyut,0,6.29); ctx.fill();
    }
    ctx.globalAlpha=1;
    ctx.textAlign="center"; ctx.font="bold 15px system-ui";
    for (const y of yaziEfektleri){
      ctx.globalAlpha = Math.max(0, 1-y.yas/y.omur);
      ctx.fillStyle=y.renk; ctx.fillText(y.metin,y.x,y.y);
    }
    ctx.globalAlpha=1;

    if (T.ustCiz){ try { T.ustCiz(ctx, REF_W, REF_H, zaman, {dalga,can,altin}); } catch(e){} }
  }

  // ---------- Döngü ----------
  let sonZaman = performance.now();
  function dongu(su){
    let dt = (su - sonZaman)/1000;
    sonZaman = su;
    if (dt > 0.05) dt = 0.05;     // sekme arka plandayken sıçrama olmasın
    if (donmaSuresi > 0){ donmaSuresi -= dt; dt = 0; }  // JUICE: boss ölümünde kısa "vuruş anı" donması
    guncelle(dt);
    ciz();
    window.OYUN_DURUMU = {asama:asama, dalga:dalga||0, can:can||0, skor:skor||0, altin:altin||0};
    requestAnimationFrame(dongu);
  }

  // ---------- Başlat ----------
  boyutlandir();
  sifirla();
  asama="menu";
  if (T.ad) { document.getElementById("menuBaslik").textContent = T.ad;
              document.title = T.ad; }
  if (T.aciklama) document.getElementById("menuAciklama").textContent = T.aciklama;
  window.OYUN_DURUMU = {asama:"menu", dalga:0, can:BASLANGIC_CAN, skor:0, altin:BASLANGIC_ALTIN};
  requestAnimationFrame(dongu);
})();
</script>
