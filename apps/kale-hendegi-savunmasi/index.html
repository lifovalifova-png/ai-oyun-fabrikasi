  document.getElementById("devamBtn").addEventListener("click", devamEt);
  document.getElementById("sonDevamBtn").addEventListener("click", devamEt);
  // ---------- Efektler ----------
  function patlamaEkle(x,y,renk,adet){
    for (let i=0;i<(adet||10);i++){
      const a = Math.random()*Math.PI*2, h = rastgele(60,190);
      parcaciklar.push({x:x,y:y,vx:Math.cos(a)*h,vy:Math.sin(a)*h,
                        omur:rastgele(0.3,0.75), yas:0, renk:renk, boyut:rastgele(2,4.5)});
    }
  }
  function yaziEkle(x,y,metin,renk){
    yaziEfektleri.push({x:x,y:y,metin:metin,renk:renk||P.metin,omur:0.9,yas:0});
  }

  // ---------- Güncelleme (v2: sabit adımla çağrılır, dt = 1/60 sn) ----------
  function guncelle(dt){
    zaman += dt;
    if (ekranSarsinti>0) ekranSarsinti = Math.max(0, ekranSarsinti - dt*2.2);  // JUICE: sönümlen
    efektleriGuncelle(dt);
    if (asama !== "oyunda") return;

    // v2: harita geçişi perdesi (1.5 sn); ortasında harita değişir, sonunda ara başlar
    if (gecis){
      gecis.t += dt;
      if (!gecis.uygulandi && gecis.t >= D.haritaGecisSure/2){
        haritaDegistir(gecis.hedef); gecis.uygulandi = true; kayitYaz();
      }
      if (gecis.t >= D.haritaGecisSure){ gecis = null; araBaslat(D.dalgaArasi); }
      cagirDugmesiGuncelle();
      return;
    }

    // Combo zaman aşımı
    if (combo>1){ comboZaman-=dt; if (comboZaman<=0){ combo=1; hudGuncelle(); } }

    // v2: dalga arası — sayaç biterse sonraki dalga
    if (araAktif){
      araKalan -= dt;
      if (araKalan <= 0) sonrakiDalga();
    }
    cagirDugmesiGuncelle();

    if (dalgaAktif){
      spawnSayac -= dt;
      if (spawnSayac<=0 && spawnKuyrugu.length){
        dusmanEkle(spawnKuyrugu.shift());
        spawnSayac = spawnAralik;
      }
      if (spawnKuyrugu.length===0) dalgaAktif=false;
    }
    // v2 (§4.1.1): dalga bitişi yalnız bir kez algılanır
    if (dalga > 0 && !araVerildi && !araAktif && !dalgaAktif &&
        spawnKuyrugu.length===0 && dusmanlar.length===0){
      dalgaBitti();
      if (asama !== "oyunda") return;
    }

    if (bossBant){ bossBant.t += dt; if (bossBant.t > 1.8) bossBant = null; }
    if (MK && MK.adim) mk("adim", dt, O);
    // Düşmanlar
    for (let i=dusmanlar.length-1;i>=0;i--){
      const d = dusmanlar[i];
      if (d.vurulmaZaman>0) d.vurulmaZaman = Math.max(0, d.vurulmaZaman - dt);
      if (d.yavaslamaSayac>0){ d.yavaslamaSayac-=dt; if (d.yavaslamaSayac<=0) d.yavaslama=1; }
      // v3: mekanik — çarpanlar her adım sıfırlanır, kanca yeniden ayarlar
      if (MK){
        d.hizCarpani = 1; d.hedeflenebilir = true; d.hasarAlma = 1;
        const onceBoyut = d.boyut, onceMax = d.maxCan;
        mk("dusmanGuncelle", d, dt, O);
        d.hizCarpani = sinir(d.hizCarpani, 0, 3, 1);
        d.hasarAlma = sinir(d.hasarAlma, 0, 4, 1);
        d.boyut = sinir(d.boyut, 0.4, 2.5, 1);
        d.maxCan = sinir(d.maxCan, 1, d.dogusCan * 4, d.dogusCan);
        d.can = sinir(d.can, -1e9, d.maxCan, d.maxCan);
        d.kaleHasari = Math.round(sinir(d.kaleHasari, 0, 5, 1));
        const e = mkDurum.etki;
        if (d.hizCarpani !== 1) e.hiz++;
        if (d.hedeflenebilir === false) e.gorunmez++;
        if (d.hasarAlma !== 1) e.hasarAlma++;
        if (d.boyut !== onceBoyut) e.boyut++;
        if (d.maxCan !== onceMax) e.canDegisti++;
        if (d.can <= 0){ dusmanOldur(d, null); continue; }   // kanca öldürdüyse ödül verilir
      }
      d.mesafe += d.hiz * d.yavaslama * (MK ? d.hizCarpani : 1) * dt;
      const r = harita().rotalar[d.rota] || anaRota();
      const n = rotaNoktasi(r, d.mesafe);
      d.x=n.x; d.y=n.y; d.aci=n.aci;
      if (T.dusmanGuncelle) { try { T.dusmanGuncelle(d, dt, zaman); } catch(e){} }
      if (d.mesafe >= r.toplam){
        dusmanlar.splice(i,1);
        sizinti[d.rota] = (sizinti[d.rota] || 0) + 1;
        if (MK){ mk("dusmanKacti", d, O); mkDurum.etki.kacti++; }
        if (!sinirsizCanTest) can -= (d.kaleHasari != null) ? d.kaleHasari : (d.bos ? D.boss.kaleHasar : 1);
        combo=1;
        ekranSarsinti = Math.min(1, ekranSarsinti + (d.bos ? 0.55 : 0.3));  // JUICE
        patlamaEkle(d.x,d.y,"#ef4444",8);
        hudGuncelle();
        if (can<=0){ can=0; hudGuncelle(); bitir(false); return; }
      }
    }

    // Kuleler
    for (const k of kuleler){
      k.sayac -= dt;
      if (k.flas>0) k.flas-=dt;
      // v3: mekanik — kule çarpanları
      if (MK){
        k.hasarCarpani = 1; k.atisCarpani = 1; k.menzilCarpani = 1; k.aktif = true;
        mk("kuleGuncelle", k, dt, O);
        k.hasarCarpani = sinir(k.hasarCarpani, 0, 4, 1);
        k.atisCarpani = sinir(k.atisCarpani, 0, 4, 1);
        k.menzilCarpani = sinir(k.menzilCarpani, 0.3, 2.5, 1);
        if (k.hasarCarpani !== 1 || k.atisCarpani !== 1 || k.menzilCarpani !== 1 || k.aktif === false)
          mkDurum.etki.kule++;
        if (k.aktif === false || k.atisCarpani <= 0) continue;
      }
      if (k.tip.destek) continue;                          // v3: destek kulesi ateş etmez
      const menzil = k.menzil * (MK ? k.menzilCarpani : 1);
      let hedef=null, enYakin=1e9;
      for (const d of dusmanlar){
        if (d.hedeflenebilir === false) continue;         // v3: sis / yeraltı / karanlık
        const m = mesafe(k,d);
        // v2 (§4.1.2): v1'deki `d.mesafe>enYakin*0-1` her zaman `d.mesafe>-1` demekti;
        // niyeti açık yazıldı: yola henüz girmemiş (doğma ofsetindeki) düşman hedeflenmez.
        if (m<=menzil && d.mesafe >= 0 && m<enYakin){ enYakin=m; hedef=d; }
      }
      if (hedef){
        k.aci = Math.atan2(hedef.y-k.y, hedef.x-k.x);
        if (k.sayac<=0){
          k.sayac = 1/((k.tip.atisHizi||1) * (MK ? k.atisCarpani : 1));
          k.flas = 0.08;
          if (MK && MK.kuleAtti){ mk("kuleAtti", k, hedef, O); mkDurum.etki.atis++; }
          mermiler.push({x:k.x,y:k.y,px:k.x,py:k.y,hedef:hedef,hiz:k.tip.mermiHizi||320,
                         hasar:k.hasar * (MK ? k.hasarCarpani : 1), renk:k.tip.renk||P.mermi, kaynak:k,
                         alan:k.tip.alan||0, yavaslat:k.tip.yavaslat||0, iz:[]});
        }
      }
    }

    // Mermiler
    for (let i=mermiler.length-1;i>=0;i--){
      const m = mermiler[i];
      if (!m.hedef || m.hedef.can<=0 || dusmanlar.indexOf(m.hedef)===-1){ mermiler.splice(i,1); continue; }
      const dx=m.hedef.x-m.x, dy=m.hedef.y-m.y, uz=Math.hypot(dx,dy)||1;
      m.iz.push({x:m.x,y:m.y}); if (m.iz.length>6) m.iz.shift();
      m.x += dx/uz*m.hiz*dt; m.y += dy/uz*m.hiz*dt;
      if (uz < 14){
        vurus(m, m.hedef);
        mermiler.splice(i,1);
      }
    }

    modulleriGuncelle(dt);   // MEKANİK MODÜLLERİ: toplanabilir / kahraman / yetenek
    if (T.guncelle) { try { T.guncelle(dt, zaman, {dusmanlar,kuleler,dalga}); } catch(e){} }
  }

  // Parçacık ve yazılar oyun bitince de sönsün diye aşama kontrolünden önce güncellenir
  function efektleriGuncelle(dt){
    for (let i=parcaciklar.length-1;i>=0;i--){
      const p=parcaciklar[i]; p.yas+=dt;
      if (p.yas>=p.omur){ parcaciklar.splice(i,1); continue; }
      p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=180*dt;
    }
    for (let i=yaziEfektleri.length-1;i>=0;i--){
      const y=yaziEfektleri[i]; y.yas+=dt; y.y-=26*dt;
      if (y.yas>=y.omur) yaziEfektleri.splice(i,1);
    }
    for (const k of kuleler){                               // v3: kurulum pop + yükseltme halkası
      if (k.dogus < 1) k.dogus += dt;
      if (k.parlama > 0) k.parlama = Math.max(0, k.parlama - dt);
    }
  }

  function vurus(m, d){
    const hedefler = m.alan ? dusmanlar.filter(x=>mesafe(x,d)<=m.alan) : [d];
    for (const h of hedefler){
      // v2: zırh (§4.3/§4.6) hasarı yüzde olarak azaltır; v1 tiplerinde zırh yok → 0
      let uygulanan = m.hasar * (1 - (h.zirh || 0)) * (MK ? (h.hasarAlma || 1) : 1);
      if (MK && MK.hasar && m.kaynak){                       // v3: hasar matrisi, element, kritik…
        const r = mk("hasar", m.kaynak, h, uygulanan, O);
        if (typeof r === "number" && r === r){
          const yeni = Math.max(0, Math.min(uygulanan * 5, r));
          if (yeni !== uygulanan) mkDurum.etki.hasar++;
          uygulanan = yeni;
        }
      }
      if (m.kaynak){ const gercek = Math.min(uygulanan, Math.max(0, h.can));
        m.kaynak.bolumHasar += gercek; m.kaynak.toplamHasar += gercek; }
      h.can -= uygulanan;
      h.vurulmaZaman = 0.14;  // JUICE: sıkışma-esneme animasyonu tetiklenir
      if (m.yavaslat){ h.yavaslama=m.yavaslat; h.yavaslamaSayac=1.6; }
      if (h.can<=0){
        dusmanOldur(h, m.kaynak);
      } else {
        yaziEkle(h.x, h.y-10, "-"+Math.round(uygulanan), "#fca5a5");
      }
    }
    patlamaEkle(m.x,m.y,m.renk,4);
  }

  // v3: ölüm tek yerde (mermi, alan hasarı ya da mekanik kancası öldürebilir)
  function dusmanOldur(h, kaynak){
    const idx = dusmanlar.indexOf(h);
    if (idx < 0) return;
    dusmanlar.splice(idx,1);
    const kazanc = Math.round(h.altin * (D.comboAltin ? combo : 1));
    altin += kazanc; skor += Math.round(10*combo*(h.bos?5:1));
    combo = Math.min(D.comboMax, combo+1); comboZaman = D.comboSure;
    patlamaEkle(h.x,h.y,h.renk, h.bos?22:11);
    yaziEkle(h.x,h.y,"+"+kazanc, "#fbbf24");
    if (h.bos){                          // JUICE: boss ölümünde ağırlık hissi
      donmaSuresi = Math.max(donmaSuresi, 0.09);
      ekranSarsinti = Math.min(1, ekranSarsinti + 0.7);
    }
    mk("dusmanOldu", h, O, kaynak);
    hudGuncelle();
  }

  // ---------- Çizim ----------
  function varsayilanArkaplan(c,W,H,t){
    const g = c.createLinearGradient(0,0,0,H);
    g.addColorStop(0,P.arka1); g.addColorStop(1,P.arka2);
    c.fillStyle=g; c.fillRect(0,0,W,H);
  }
  function varsayilanYol(c, yol){
    c.lineCap="round"; c.lineJoin="round";
    c.strokeStyle=P.yolKenar; c.lineWidth=46;
    c.beginPath(); c.moveTo(yol[0].x,yol[0].y);
    for (let i=1;i<yol.length;i++) c.lineTo(yol[i].x,yol[i].y);
    c.stroke();
    c.strokeStyle=P.yol; c.lineWidth=36; c.stroke();
  }
  function varsayilanDusman(c,d,t){
    c.save(); c.translate(d.x,d.y);
    const sal = Math.sin(t*6+d.faz)*0.12;
    c.rotate(sal);
    c.fillStyle="rgba(0,0,0,.28)";
    c.beginPath(); c.ellipse(0,d.yaricap*0.8,d.yaricap*0.9,d.yaricap*0.35,0,0,6.29); c.fill();
    c.fillStyle=d.renk;
    c.beginPath(); c.arc(0,0,d.yaricap,0,6.29); c.fill();
    c.fillStyle="rgba(255,255,255,.85)";
    c.beginPath(); c.arc(-d.yaricap*0.3,-d.yaricap*0.25,d.yaricap*0.18,0,6.29);
    c.arc(d.yaricap*0.3,-d.yaricap*0.25,d.yaricap*0.18,0,6.29); c.fill();
    c.restore();
  }
  function varsayilanKule(c,k,t){
    c.save(); c.translate(k.x,k.y);
    c.fillStyle="rgba(0,0,0,.3)";
    c.beginPath(); c.ellipse(0,14,20,7,0,0,6.29); c.fill();
    c.fillStyle="#1f2937";
    c.beginPath(); c.arc(0,0,19,0,6.29); c.fill();
    c.fillStyle=k.tip.renk||P.kule;
    c.beginPath(); c.arc(0,0,14,0,6.29); c.fill();
    c.rotate(k.aci);
    c.fillStyle="#111827"; c.fillRect(0,-4,26,8);
    if (k.flas>0){ c.fillStyle="#fff"; c.beginPath(); c.arc(28,0,7,0,6.29); c.fill(); }
    c.restore();
    for (let i=0;i<k.seviye-1;i++){
      c.fillStyle=P.vurgu;
      c.beginPath(); c.arc(k.x-6+i*6, k.y-24, 3, 0, 6.29); c.fill();
    }
  }

  function canBari(c,d){
    if (d.can>=d.maxCan) return;
    const g = d.bos?60:30, y=d.y-d.yaricap*(d.boyut||1)-10;
    c.fillStyle="rgba(0,0,0,.6)"; c.fillRect(d.x-g/2,y,g,d.bos?7:4);
    c.fillStyle= d.bos?"#f43f5e":"#22c55e";
    c.fillRect(d.x-g/2,y,g*Math.max(0,d.can/d.maxCan),d.bos?7:4);
  }

  // ---------- PERFORMANS: Kule sprite önbelleği ----------
  // Her kule tipi+seviye+açı kombinasyonu bir kez offscreen canvas'a çizilir,
  // sonrasında sadece drawImage ile kopyalanır (gradient/shadow/path maliyeti
  // her karede değil, sadece ilk seferde ödenir). Ateş flaşı önbelleğe alınmaz
  // (üstteki ışık halesi zaten k.flas ile canlı pulslanıyor), böylece flaş
  // efekti kaybolmaz.
  const kuleSpriteOnbellek = new Map();
  const ACI_ADIM = 32;  // 11.25°'lik dilimler; gözle fark edilmeyecek kadar ince

  function kuleSpriteAl(k){
    const tipIdx = KULE_TIPLERI.indexOf(k.tip);
    const adim = (Math.PI*2)/ACI_ADIM;
    const aciQ = ((Math.round(k.aci/adim) % ACI_ADIM) + ACI_ADIM) % ACI_ADIM;
    const anahtar = tipIdx + "_" + k.seviye + "_" + aciQ;
    let s = kuleSpriteOnbellek.get(anahtar);
    if (s) return s;

    const boyut = 96;
    const off = document.createElement("canvas");
    off.width = boyut; off.height = boyut;
    const octx = off.getContext("2d");
    octx.translate(boyut/2, boyut/2);
    octx.save();
    octx.beginPath(); octx.rect(-46,-46,92,92); octx.clip();
    const sahteK = Object.assign({}, k, {x:0, y:0, aci: aciQ*adim, flas:0,
                                         ad: k.tip.ad, tipIndeks: tipIdx});
    // v1.2: çizimi görünmeyen kule tipi varsayılan çizimle gösterilir
    const kc = (T.kuleCiz && gorunurlukAl().kule[tipIdx] !== "gorunmez") ? T.kuleCiz : varsayilanKule;
    try { kc(octx, sahteK, 0); }
    catch(e){ octx.restore(); octx.save(); varsayilanKule(octx, sahteK, 0); }
    octx.restore();

    s = {canvas: off, boyut: boyut};
    kuleSpriteOnbellek.set(anahtar, s);
    return s;
  }

  function ambiyansCiz(c,t){
    c.save(); c.globalAlpha=.3; c.fillStyle = P.vurgu;
    for (const a of ambiyansParcaciklari){
      const y = ((a.y + t*a.hiz) % (REF_H+20)) - 10;
      const x = a.x + Math.sin(t*0.5+a.faz)*14;
      c.beginPath(); c.arc(x,y,a.boyut,0,6.29); c.fill();
    }
    c.restore();
  }

  /* v2 PERFORMANS: statik zemin önbelleği.
     `this` düzeltmesinden sonra eklentilerin gerçek (çok katmanlı, gölgeli) arka planları
     çizilmeye başladı; her karede yeniden çizmek bazı eklentilerde kare hızını 5–20 kat
     düşürüyordu. Arka plan t=0 anındaki haliyle bir kez çizilir. Bedeli: eklentinin arka
     plandaki ve yoldaki kendi animasyonu durur (motorun ambiyans zerreleri canlı kalır). */
  let zeminKatmani = null, zeminAnahtar = "";
  function zeminKatmaniAl(){
    const s = Math.max(0.5, Math.min(2.5, olcek));
    const anahtar = s.toFixed(3) + "_" + haritaNo;
    if (zeminKatmani && zeminAnahtar === anahtar) return zeminKatmani;
    const cv = document.createElement("canvas");
    cv.width = Math.ceil(REF_W*s); cv.height = Math.ceil(REF_H*s);
    const c = cv.getContext("2d");
    c.scale(s, s);
    c.save();
    try { (harita().zeminCiz || T.arkaplanCiz || varsayilanArkaplan)(c, REF_W, REF_H, 0, haritaBilgisi()); }
    catch(e){ c.restore(); c.save(); varsayilanArkaplan(c, REF_W, REF_H, 0); }
    c.restore();
    // JUICE: evrensel atmosfer katmanı (üstten yumuşak ışık + kenarlarda vinyet) — v1 ile aynı
    try {
      c.save();
      const isik = c.createLinearGradient(0,0,0,REF_H);
      isik.addColorStop(0, "rgba(255,255,255,.10)");
      isik.addColorStop(0.4, "rgba(255,255,255,0)");
      c.fillStyle = isik; c.fillRect(0,0,REF_W,REF_H);
      c.globalCompositeOperation = "multiply";
      const vin = c.createRadialGradient(REF_W/2,REF_H/2,REF_H*0.35, REF_W/2,REF_H/2,REF_H*0.85);
      vin.addColorStop(0, "rgba(255,255,255,1)");
      vin.addColorStop(1, "rgba(140,140,150,1)");
      c.fillStyle = vin; c.fillRect(0,0,REF_W,REF_H);
      c.restore();
    } catch(e){}
    // Yollar da statik katmana (haritanın tüm rotaları)
    for (const r of harita().rotalar){
      c.save();
      try { (T.yolCiz || varsayilanYol)(c, r.n, 0, haritaBilgisi()); }
      catch(e){ c.restore(); c.save(); varsayilanYol(c, r.n); }
      c.restore();
    }
    // v3: harita başına tonlama (2. harita akşam, 3. harita gece)
    const ton = D.tonlama[haritaNo];
    if (ton){
      c.save(); c.globalAlpha = ton.guc; c.fillStyle = ton.renk; c.fillRect(0,0,REF_W,REF_H); c.restore();
    }
    zeminKatmani = cv; zeminAnahtar = anahtar;
    return cv;
  }

  /* v1.2 GÖRÜNÜRLÜK GÜVENCESİ
     Eklentinin her düşman ve kule tipini oyun başlamadan ekran dışında bir kez çizip ölçer.
     Neden: 54 eklentinin 23'ünde düşmanlar görünmüyordu (eklenti `d.ad`'a göre dallanıyordu,
     motor bu alanı vermiyordu → hiçbir dal çizmiyordu). Alan eklendi; bu ölçüm, eklentinin
     başka bir hatasıyla düşmanın yine görünmez olmasını da engeller.
       görünmez: opak piksel < gövde alanının %15'i → varsayılan çizim
       soluk:    gövde merkezindeki çizili piksellerin ortalama opaklığı < %67 → altına opak gövde
     Sonuç window.MOTOR_GORUNURLUK'ta; fabrika kalite testi bunu okur. */
  let gorunurluk = null;
  function gorunurlukAl(){
    if (gorunurluk) return gorunurluk;
    gorunurluk = {dusman: [], kule: []};
    // Isınma: bazı eklentiler arka plan/yol çiziminde kendi önbelleklerini (yıldız, taş listesi
    // gibi) kurar ve düşman/kule çizimi bunlara dayanır. Oyundaki sırayı taklit et.
    try {
      const ic = document.createElement("canvas"); ic.width = 64; ic.height = 36;
      const ix = ic.getContext("2d"); ix.scale(0.05, 0.05);
      ix.save(); try { (harita().zeminCiz || T.arkaplanCiz || varsayilanArkaplan)(ix, REF_W, REF_H, 0, haritaBilgisi()); } catch(e){} ix.restore();
      ix.save(); try { (T.yolCiz || varsayilanYol)(ix, anaRota().n, 0, haritaBilgisi()); } catch(e){} ix.restore();
    } catch(e){}
    const rapor = {dusman: [], kule: []};
    const B = 160;
    let c = null, sonHata = null;
    function olc(ciz, r){
      // Her ölçüm yeni tuvalde: hata veren bir çizim save/clip yığınını kirletse bile
      // sonraki ölçümü etkilemez
      const cv = document.createElement("canvas"); cv.width = cv.height = B;
      c = cv.getContext("2d", {willReadFrequently: true});
      c.save();
      if (r){ c.beginPath(); c.rect(B/2-r*2, B/2-r*2.4, r*4, r*4.4); c.clip(); }  // motorun kırpması
      let hata = null; try { ciz(); } catch(e){ hata = String(e).slice(0, 90); }
      c.setTransform(1,0,0,1,0,0);
      const v = c.getImageData(0,0,B,B).data; let opak = 0, ic = 0, icN = 0;
      const R = (r || 20) * 0.7;
      for (let y=0;y<B;y++) for (let x=0;x<B;x++){
        const a = v[(y*B+x)*4+3]; if (a >= 160) opak++;
        if (a > 8 && (x-B/2)*(x-B/2) + (y-B/2)*(y-B/2) <= R*R){ ic += a; icN++; }
      }
      sonHata = hata;
      return {opak, ic: icN ? ic/icN : 0, hata};
    }
    DUSMAN_TIPLERI.forEach((t, i) => {
      let durum = "tamam"; sonHata = null;
      if (T.dusmanCiz){
        const r = t.yaricap || 14;
        const d = {x:B/2, y:B/2, aci:0, mesafe:40, yaricap:r, renk:t.renk||P.dusman, bos:false, faz:1.3,
                   tip:t, ad:t.ad, tipIndeks:i, can:(t.can||60)*0.7, maxCan:t.can||60, hiz:t.hiz||60,
                   yavaslama:1, yavaslamaSayac:0, vurulmaZaman:0};
        const o = olc(() => T.dusmanCiz(c, d, 1.2), r);
        if (o.hata || o.opak < Math.PI*r*r*0.15) durum = "gorunmez";
        else if (o.ic < 170) durum = "soluk";
      }
      gorunurluk.dusman[i] = durum; rapor.dusman.push({ad: t.ad, durum, hata: sonHata});
    });
    KULE_TIPLERI.forEach((t, i) => {
      let durum = "tamam"; sonHata = null;
      if (T.kuleCiz){
        const k = {x:0, y:0, aci:-Math.PI/2, tip:t, ad:t.ad, tipIndeks:i, seviye:1, flas:0,
                   menzil:t.menzil, hasar:t.hasar};
        const o = olc(() => { c.translate(B/2, B/2); T.kuleCiz(c, k, 0); }, 0);
        if (o.hata || o.opak < 120) durum = "gorunmez";
      }
      gorunurluk.kule[i] = durum; rapor.kule.push({ad: t.ad, durum, hata: sonHata});
    });
    window.MOTOR_GORUNURLUK = rapor;
    return gorunurluk;
  }

  function ciz(alfa){
    ctx.setTransform(1,0,0,1,0,0);
    ctx.fillStyle="#05080f"; ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.setTransform(olcek,0,0,olcek,kaydirX,kaydirY);

    // JUICE: ekran sarsıntısı (sadece dünyayı etkiler, HUD ayrı DOM katmanında olduğu için sarsılmaz)
    if (ekranSarsinti>0.01){
      const guc = ekranSarsinti*ekranSarsinti;
      ctx.translate((Math.random()*2-1)*10*guc, (Math.random()*2-1)*10*guc);
    }

    // v2: statik zemin önbelleği — eklentinin arka planı, atmosfer ve yol bir kez
    // ekran dışı tuvale çizilir, her karede yalnız kopyalanır (bkz. zeminKatmaniAl)
    ctx.drawImage(zeminKatmaniAl(), 0, 0, REF_W, REF_H);

    // v3: döngü fazı tonlaması (ör. gece, kış)
    if (DONGU){
      const f = DONGU.fazlar[fazNo];
      if (f.renk && f.karartma > 0){
        ctx.save(); ctx.globalAlpha = f.karartma; ctx.fillStyle = f.renk;
        ctx.fillRect(0,0,REF_W,REF_H); ctx.restore();
      }
    }
    ambiyansCiz(ctx, zaman);  // JUICE: her temada otomatik yüzen parıltı zerreleri
    // v2: yol statik zemin katmanında (zeminKatmaniAl)

    // Seçili kule tipinin menzil önizlemesi yok; kurulu kulelerin menzili seçiliyken
    if (seciliKule){
      ctx.strokeStyle="rgba(56,189,248,.55)"; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(seciliKule.x,seciliKule.y,seciliKule.menzil,0,6.29); ctx.stroke();
    }

    for (const k of kuleler){
      // JUICE: kule altında yumuşak ışık halesi (her tema için otomatik, Gemini'ye bağlı değil)
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      const renk = (k.tip.renk || P.kule);
      const glowR = 30 + Math.sin(zaman*2 + k.x*0.01)*3 + (k.flas>0 ? 16 : 0);
      const hale = paritiSprite(renk);          // v2 (§4.1.3): hazır sprite
      if (hale) ctx.drawImage(hale, k.x-glowR, k.y-glowR, glowR*2, glowR*2);
      ctx.restore();

      // PERFORMANS: canlı çizim yerine önbellekten kopyala (bkz. kuleSpriteAl)
      const sprite = kuleSpriteAl(k);
      if (k.dogus < 0.35){                                  // v3: kurulum "pop" (0 → 1.15 → 1)
        const u = k.dogus / 0.35, sc = u < 0.7 ? (u/0.7)*1.15 : 1.15 - 0.15*((u-0.7)/0.3);
        ctx.save(); ctx.translate(k.x, k.y); ctx.scale(sc, sc);
        ctx.drawImage(sprite.canvas, -sprite.boyut/2, -sprite.boyut/2); ctx.restore();
      } else ctx.drawImage(sprite.canvas, k.x - sprite.boyut/2, k.y - sprite.boyut/2);
      if (k.parlama > 0){                                    // v3: yükseltme halkası
        const u = 1 - k.parlama/0.6;
        ctx.save(); ctx.globalAlpha = k.parlama/0.6; ctx.strokeStyle = "#fde68a"; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(k.x, k.y, 18 + u*46, 0, 6.29); ctx.stroke(); ctx.restore();
      }
      if (MK && k.aktif === false && !k.tip.destek){         // v3: devre dışı kule işareti
        ctx.save(); ctx.globalAlpha = 0.55; ctx.fillStyle = "#0b0f19";
        ctx.beginPath(); ctx.arc(k.x, k.y, 22, 0, 6.29); ctx.fill(); ctx.restore();
      }
    }
    for (const d of dusmanlar){
      // v2: enterpolasyon — çizim süresince konum iki simülasyon adımı arasına taşınır
      const simX = d.x, simY = d.y;
      if (d.px !== undefined){ d.x = d.px + (simX-d.px)*alfa; d.y = d.py + (simY-d.py)*alfa; }
      // Kontrast halkası: eklenti düşmanı zeminle aynı renk yapsa bile ayrışsın
      ctx.save();
      ctx.strokeStyle="rgba(0,0,0,.55)"; ctx.lineWidth=3;
      ctx.beginPath(); ctx.arc(d.x,d.y,d.yaricap*1.05,0,6.29); ctx.stroke();
      ctx.strokeStyle="rgba(255,255,255,.35)"; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.arc(d.x,d.y,d.yaricap*1.05,0,6.29); ctx.stroke();
      ctx.restore();

      // JUICE: vurulunca sıkışma-esneme (squash & stretch)
      let sx=1, sy=1;
      if (d.vurulmaZaman>0){
        const o = d.vurulmaZaman/0.14;
        sx = 1 + 0.22*o; sy = 1 - 0.22*o;
      }
      const bo = d.boyut || 1;                                // v3: mekanik boyut (ör. büyüyen düşman)
      ctx.save();
      // v3: hedeflenemeyen düşman (sis, yeraltı) yarı saydam gösterilir: oyuncu orada olduğunu görür
      if (MK && d.hedeflenebilir === false) ctx.globalAlpha = 0.35;
      ctx.translate(d.x,d.y); ctx.scale(sx*bo,sy*bo); ctx.translate(-d.x,-d.y);
      ctx.beginPath(); ctx.rect(d.x-d.yaricap*2, d.y-d.yaricap*2.4,
                                d.yaricap*4, d.yaricap*4.4); ctx.clip();
      // v1.2 GÖRÜNÜRLÜK GÜVENCESİ: görünmeyen tip → varsayılan çizim; gövdesi saydam tip →
      // altına kendi renginde opak gövde
      const gd = gorunurlukAl().dusman[d.tipIndeks];
      if (gd === "soluk"){
        ctx.fillStyle = d.renk;
        ctx.beginPath(); ctx.arc(d.x, d.y, d.yaricap*0.8, 0, 6.29); ctx.fill();
      }
      const dc = (T.dusmanCiz && gd !== "gorunmez") ? T.dusmanCiz : varsayilanDusman;
      try { dc(ctx,d,zaman); }
      catch(e){ ctx.restore(); ctx.save(); varsayilanDusman(ctx,d,zaman); }
      ctx.restore();
      canBari(ctx,d);
      d.x = simX; d.y = simY;
    }
    modulleriCiz(ctx, zaman);   // MEKANİK MODÜLLERİ: toplanabilirler + kahraman
    if (MK && MK.ciz){                                       // v3: mekaniğin dünya katmanı (sis, ışık…)
      ctx.save(); mk("ciz", ctx, O, zaman); ctx.restore(); mkDurum.etki.ciz++;
    }
    for (const m of mermiler){
      ctx.strokeStyle=m.renk; ctx.lineWidth=2; ctx.globalAlpha=.5;
      ctx.beginPath();
      m.iz.forEach((p,i)=> i? ctx.lineTo(p.x,p.y) : ctx.moveTo(p.x,p.y));
      ctx.stroke(); ctx.globalAlpha=1;
      const mx = m.px + (m.x-m.px)*alfa, my = m.py + (m.y-m.py)*alfa;
      ctx.fillStyle=m.renk; ctx.beginPath(); ctx.arc(mx,my,4,0,6.29); ctx.fill();
    }
    for (const p of parcaciklar){
      ctx.globalAlpha = Math.max(0, 1-p.yas/p.omur);
      ctx.fillStyle=p.renk;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.boyut,0,6.29); ctx.fill();
    }
    ctx.globalAlpha=1;
    ctx.textAlign="center"; ctx.font="bold 15px system-ui";
    for (const y of yaziEfektleri){
      ctx.globalAlpha = Math.max(0, 1-y.yas/y.omur);
      ctx.fillStyle=y.renk; ctx.fillText(y.metin,y.x,y.y);
    }
    ctx.globalAlpha=1;

    if (T.ustCiz){ try { T.ustCiz(ctx, REF_W, REF_H, zaman, {dalga,can,altin}); } catch(e){} }
    bossBandiCiz(ctx);
    gecisPerdesiCiz(ctx);
  }
  // v2 (§4.1.3): kule halesi her karede createRadialGradient yerine renk başına bir kez
  // çizilen sprite'tan ölçeklenerek kopyalanır. Görünüm v1 ile aynı (merkez %20 → kenar %0).
  const PARILTI_R = 64;
  const paritiOnbellek = new Map();
  function paritiSprite(renk){
    if (paritiOnbellek.has(renk)) return paritiOnbellek.get(renk);
    let s = null;
    try {
      const cv = document.createElement("canvas");
      cv.width = cv.height = PARILTI_R*2;
      const c = cv.getContext("2d");
      const g = c.createRadialGradient(PARILTI_R,PARILTI_R,0,PARILTI_R,PARILTI_R,PARILTI_R);
      g.addColorStop(0, renk+"33"); g.addColorStop(1, renk+"00");   // v1 ile aynı renk kuralı
      c.fillStyle = g; c.fillRect(0,0,cv.width,cv.height);
      s = cv;
    } catch(e){ s = null; }                  // geçersiz renk: v1 de haleyi atlıyordu
    paritiOnbellek.set(renk, s);
    return s;
  }

  // v3: boss giriş bandı (1.8 sn; dokunmayı engellemez)
  function bossBandiCiz(c){
    if (!bossBant) return;
    const t = bossBant.t, a = t < 0.25 ? t/0.25 : (t > 1.4 ? Math.max(0, (1.8-t)/0.4) : 1);
    c.save();
    c.globalAlpha = 0.28*a; c.fillStyle = "#000"; c.fillRect(0,0,REF_W,REF_H);
    c.globalAlpha = 0.9*a; c.fillStyle = "#1a0606"; c.fillRect(0, REF_H*0.38, REF_W, 74);
    c.fillStyle = "#ef4444"; c.fillRect(0, REF_H*0.38, REF_W, 3); c.fillRect(0, REF_H*0.38+71, REF_W, 3);
    c.globalAlpha = a; c.textAlign = "center"; c.fillStyle = "#fecaca";
    c.font = "800 15px system-ui,sans-serif"; c.fillText("BOSS", REF_W/2, REF_H*0.38 + 24);
    c.fillStyle = "#fff"; c.font = "800 30px system-ui,sans-serif";
    c.fillText(bossBant.ad, REF_W/2 + (1-a)*40, REF_H*0.38 + 58);
    c.restore();
  }

  // v2: harita geçiş perdesi (kararma → harita adı → açılma), dokunmayı engellemez
  function gecisPerdesiCiz(c){
    if (!gecis) return;
    const yari = D.haritaGecisSure/2;
    const o = gecis.t < yari ? gecis.t/yari : Math.max(0, 1 - (gecis.t-yari)/yari);
    c.save();
    c.globalAlpha = Math.min(1, o*1.05);
    c.fillStyle = "#05080f"; c.fillRect(0,0,REF_W,REF_H);
    const hedef = HARITALAR[gecis.hedef];
    c.textAlign = "center"; c.fillStyle = "#e5e7eb";
    c.font = "800 38px system-ui,sans-serif";
    c.fillText(hedef.ad, REF_W/2, REF_H/2 - 6);
    c.font = "600 17px system-ui,sans-serif"; c.fillStyle = "#94a3b8";
    c.fillText((gecis.hedef+1) + ". harita · Bölüm " + (gecis.hedef*D.bolumPerHarita+1) +
               " · Can +" + D.haritaGecisCan, REF_W/2, REF_H/2 + 26);
    c.restore();
  }

  /* ---------- v2: Döngü — sabit zaman adımı + enterpolasyon (§4.4) ----------
     v1: değişken dt (≤50 ms) → kare hızına göre farklı sonuç, denge botu tekrarlanamaz.
     v2: simülasyon hep 1/60 sn adımlarla ilerler; çizim iki adım arasını enterpole eder. */
  const ADIM = 1/60, MAKS_ADIM = 8;
  let birikim = 0, sonZaman = null;
  function oncekiKaydet(){
    for (const d of dusmanlar){ d.px = d.x; d.py = d.y; }
    for (const m of mermiler){ m.px = m.x; m.py = m.y; }
  }
  function dongu(su){
    if (sonZaman === null) sonZaman = su;
    let dt = (su - sonZaman)/1000;
    sonZaman = su;
    if (!(dt > 0)) dt = 0;
    if (dt > 0.25) dt = 0.25;      // sekme arka plandan dönünce sıçrama olmasın
    birikim += dt * hizCarpani;
    let adim = 0;
    while (birikim >= ADIM && adim < MAKS_ADIM){
      oncekiKaydet();
      if (donmaSuresi > 0){ donmaSuresi -= ADIM; guncelle(0); }  // JUICE: vuruş anı donması
      else guncelle(ADIM);
      birikim -= ADIM; adim++;
    }
    if (adim >= MAKS_ADIM) birikim = 0;   // yavaş cihazda birikim sarmalı olmasın
    ciz(Math.min(1, birikim / ADIM));
    window.OYUN_DURUMU = {asama:asama, dalga:dalga||0, can:can||0, skor:skor||0, altin:altin||0,
                          bolum: Math.max(1, Math.ceil((dalga||0)/D.dalgaPerBolum)),
                          harita: haritaNo+1, toplamDalga: TOPLAM_DALGA, zorluk: zorluk,
                          mekanik: mkDurum.ad, faz: DONGU ? DONGU.fazlar[fazNo].ad : null};
    window.MOTOR_MEKANIK = mkDurum;
    requestAnimationFrame(dongu);
  }

  /* ---------- v2: Test kancaları (Playwright / denge botu) ----------
     Oyuncuya görünmez; yalnız otomatik testler kullanır. */
  window.MOTOR_TEST = {
    dalgaPlani(g){
      const p = dalgaPlani(g);
      return {g: p.g, sablon: p.sablon, butce: Math.round(p.butce*100)/100, ritim: p.ritim,
              harita: p.harita+1, bolum: p.bolum, aralik: p.aralik,
              birimler: p.birimler.map(b => b.tip + (b.bos?"B":"") + ":" + b.rota + ":" +
                                      Math.round((+DUSMAN_TIPLERI[b.tip].can||60)*b.guc*(b.bos?D.boss.can:1)))};
    },
    tehdit: (i, bos) => tipTehdit(i, !!bos),
    durum: () => ({dalga, bolum: Math.max(1, Math.ceil(dalga/D.dalgaPerBolum)), harita: haritaNo+1,
                   araAktif, araKalan: Math.round(araKalan*1000)/1000, gecis: !!gecis,
                   dusman: dusmanlar.length, kule: kuleler.length, altin, can, tohum, zorluk,
                   zaman: Math.round(zaman*1000)/1000, hiz: hizCarpani}),
    sizinti: () => sizinti.slice(),
    olaylar: () => olaylar.slice(),
    spawnKaydi: () => spawnKaydi.slice(),
    haritalar: () => HARITALAR.map(h => ({ad: h.ad, rota: h.rotalar.length, imza: h.imza.length})),
    kayit: () => kayitOku(),
    kayitSil: () => kayitSil(),
    // Ücretsiz kurulum/yükseltme (test amaçlı; kurulum kuralları aynen uygulanır)
    // ucretli=false: ücretsiz (akış testi); ucretli=true: altın düşer (bot)
    kuleKur(x, y, tipIdx, ucretli){
      const tip = KULE_TIPLERI[tipIdx|0]; if (!tip) return false;
      const p = {x, y};
      if (x<10||y<10||x>REF_W-10||y>REF_H-10 || yolaYakinMi(p, 34)) return false;
      for (const k of kuleler) if (mesafe(p,k) < 40) return false;
      if (ucretli){ if (altin < tip.fiyat) return false; altin -= tip.fiyat; }
      const yk = kuleOlustur(x, y, tip); kuleler.push(yk); mk("kuleKuruldu", yk, O);
      hudGuncelle(); return true;
    },
    yukseltHepsi(ucretli){
      let n = 0;
      for (const k of kuleler){
        if (k.seviye >= D.maxSeviye) continue;
        if (ucretli){ const f = yukseltmeFiyati(k); if (altin < f) continue; altin -= f; k.yatirim += f; }
        kuleSeviyeArtir(k); n++;
      }
      hudGuncelle(); return n;
    },
    canAyarla(n){ can = n; hudGuncelle(); },
    sinirsizCan(a){ sinirsizCanTest = !!a; },
    hiz(n){ hizCarpani = Math.max(1, Math.min(8, n|0)); },
    dalgayiCagir: () => dalgayiCagir(),
    mekanik: () => JSON.parse(JSON.stringify(mkDurum)),
    haritaKatsayisi: (h) => { kapsamaOnbellek.length = 0; return haritaKatsayisi(h|0); },
    kuleVerimi: () => { verimOnbellek = null; return kuleVerimi(); },
    // v3: SİMÜLASYON — çizim yapmadan oyunu ilerletir (denge botu ve kalite kapısı için)
    ilerlet(sn){
      const n = Math.round(sn / ADIM);
      for (let i = 0; i < n && asama === "oyunda"; i++) guncelle(ADIM);
      return asama;
    },
    // v3: DENGE BOTU — açgözlü ama makul oyuncu: her karar anında altınla alınabilecek en
    // verimli işi yapar (yeni kule: yol kapsaması × DPS / fiyat; yükseltme: Δ DPS × kapsama / fiyat).
    // Kapsama = kulenin menzilindeki yol örnek noktası sayısı. Tohumla birlikte tekrarlanabilir.
    botKos(ayar){
      ayar = ayar || {};
      const maxDalga = ayar.maxDalga || TOPLAM_DALGA, karar = ayar.karar || 0.5;
      const sinirSn = ayar.maxSaniye || 6000;
      let bh = -1, noktalar = [], ornek = [];
      const kapsama = (x, y, r) => { let n = 0; for (const p of ornek) if ((p.x-x)*(p.x-x)+(p.y-y)*(p.y-y) <= r*r) n++; return n; };
      const dps = (t, sev) => (+t.hasar||10) * Math.pow(D.yukseltmeHasar, sev-1) * (+t.atisHizi||1)
                               * (t.alan ? 1.8 : 1) * (t.yavaslat ? 1.25 : 1);
      function hazirla(){
        bh = haritaNo; ornek = []; noktalar = [];
        for (const r of harita().rotalar) for (let m = 0; m <= r.toplam; m += 12){
          const p = rotaNoktasi(r, m); if (p.x >= 0 && p.x <= REF_W && p.y >= 0 && p.y <= REF_H) ornek.push(p);
        }
        for (let y = 70; y <= 640; y += 34) for (let x = 30; x <= 1250; x += 34){
          if (!yolaYakinMi({x, y}, 36)) noktalar.push({x, y});
        }
      }
      const kayip = [];
      let canOnce = can, sonDalga = dalga, t = 0;
      while (asama === "oyunda" && dalga <= maxDalga && t < sinirSn){
        if (bh !== haritaNo && !gecis) hazirla();
        for (let islem = 0; islem < 6 && !gecis; islem++){
          let en = null, enDeger = 0;
          if (kuleler.length >= 2){
            const eksik = KULE_TIPLERI.findIndex((tp, ti) => altin >= tp.fiyat && !kuleler.some(k => k.tipIndeks === ti));
            if (eksik >= 0){
              const tip = KULE_TIPLERI[eksik]; let eniyi = null, enK = -1;
              for (const p of noktalar){
                let bos = true, yakin = 0;
                for (const k of kuleler){ const q = (k.x-p.x)*(k.x-p.x)+(k.y-p.y)*(k.y-p.y);
                  if (q < 1600){ bos = false; break; } if (q < 130*130) yakin++; }
                if (!bos) continue;
                const deger = tip.destek ? yakin : kapsama(p.x, p.y, +tip.menzil || 130);
                if (deger > enK){ enK = deger; eniyi = p; }
              }
              if (eniyi){ altin -= tip.fiyat; const yk = kuleOlustur(eniyi.x, eniyi.y, tip);
                kuleler.push(yk); mk("kuleKuruldu", yk, O); continue; }
            }
          }
          for (let ti = 0; ti < KULE_TIPLERI.length; ti++){
            const tip = KULE_TIPLERI[ti]; if (altin < tip.fiyat) continue;
            let eniyi = null, enK = 0;
            for (const p of noktalar){
              let bos = true; for (const k of kuleler) if ((k.x-p.x)*(k.x-p.x)+(k.y-p.y)*(k.y-p.y) < 1600){ bos = false; break; }
              if (!bos) continue;
              const kp = kapsama(p.x, p.y, +tip.menzil || 130); if (kp > enK){ enK = kp; eniyi = p; }
            }
            if (!eniyi) continue;
            const v = enK * dps(tip, 1) / tip.fiyat;
            if (v > enDeger){ enDeger = v; en = {tur: "kur", ti, p: eniyi}; }
          }
          for (const k of kuleler){
            if (k.seviye >= D.maxSeviye) continue;
            const f = yukseltmeFiyati(k); if (altin < f) continue;
            const v = kapsama(k.x, k.y, k.menzil * D.yukseltmeMenzil) * (dps(k.tip, k.seviye+1) - dps(k.tip, k.seviye)) / f;
            if (v > enDeger){ enDeger = v; en = {tur: "yukselt", k, f}; }
          }
          if (!en) break;
          if (en.tur === "kur"){ const tip = KULE_TIPLERI[en.ti]; altin -= tip.fiyat;
            const yk = kuleOlustur(en.p.x, en.p.y, tip); kuleler.push(yk); mk("kuleKuruldu", yk, O); }
          else { altin -= en.f; en.k.yatirim += en.f; kuleSeviyeArtir(en.k); }
        }
        for (let i = 0, n = Math.round(karar/ADIM); i < n && asama === "oyunda"; i++) guncelle(ADIM);
        t += karar;
        if (dalga !== sonDalga){ kayip.push(Math.max(0, canOnce - can)); canOnce = can; sonDalga = dalga; }
      }
      kayip.push(Math.max(0, canOnce - can));
      const tipSay = KULE_TIPLERI.map((tp, ti) => kuleler.filter(k => k.tipIndeks === ti).length);
      return {asama, dalga, can, kule: kuleler.length, tipSay, altin, skor, sure: Math.round(t), kayip,
              mekanik: JSON.parse(JSON.stringify(mkDurum.etki)), mkHata: JSON.parse(JSON.stringify(mkDurum.hata))};
    },
    DENGE: D
  };

  // ---------- Başlat ----------
  boyutlandir();
  sifirla();
  asama="menu";
  if (T.ad) { document.getElementById("menuBaslik").textContent = T.ad;
              document.title = T.ad; }
  if (T.aciklama) document.getElementById("menuAciklama").textContent = T.aciklama;
  if (MK && mkDurum.aciklama){
    const n = document.getElementById("menuNasil");
    n.textContent = "Nasıl oynanır: " + mkDurum.aciklama; n.style.display = "block";
  }
  window.MOTOR_MEKANIK = mkDurum;
  gorunurlukAl();   // v1.2: ölçüm başta yapılır; kalite testi window.MOTOR_GORUNURLUK'u okur
  zorlukDugmeleriniGuncelle();
  devamButonlariniGuncelle();
  window.OYUN_DURUMU = {asama:"menu", dalga:0, can:BASLANGIC_CAN, skor:0, altin:D.baslangicAltin,
                        bolum:1, harita:1, toplamDalga:TOPLAM_DALGA, zorluk:zorluk,
                        mekanik: mkDurum.ad, faz: DONGU ? DONGU.fazlar[0].ad : null};
  requestAnimationFrame(dongu);
})();
</script>
