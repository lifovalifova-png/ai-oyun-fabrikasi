<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kale hendeği savunması</title>
<style>
  html,body{margin:0;padding:0;overflow:hidden;background:#0b0f19;font-family:system-ui,sans-serif;}
  #sahne{position:relative;width:100vw;height:100vh;}
  canvas{display:block;width:100%;height:100%;touch-action:none;}
  .overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
           background:rgba(5,8,15,.82);z-index:20;}
  .overlay.gizli{display:none;pointer-events:none;}
  .panel{background:rgba(17,24,39,.95);border:1px solid rgba(255,255,255,.12);
         border-radius:16px;padding:28px 32px;max-width:520px;text-align:center;color:#e5e7eb;}
  .btn{background:#2563eb;color:#fff;border:none;border-radius:10px;padding:12px 26px;
       font-size:16px;font-weight:600;cursor:pointer;margin-top:14px;}
  .btn:hover{background:#1d4ed8;}
  .btn.ikincil{background:#374151;}
  #hud{position:absolute;top:0;left:0;right:0;z-index:10;display:flex;gap:14px;flex-wrap:wrap;
       padding:10px 14px;background:linear-gradient(180deg,rgba(5,8,15,.85),rgba(5,8,15,0));
       color:#e5e7eb;font-size:14px;font-weight:600;pointer-events:none;}
  #hud .kutu{background:rgba(17,24,39,.7);border:1px solid rgba(255,255,255,.1);
             border-radius:10px;padding:6px 12px;}
  #kulePanel{position:absolute;bottom:0;left:0;right:0;z-index:10;display:flex;gap:8px;
             justify-content:center;flex-wrap:wrap;padding:10px;
             background:linear-gradient(0deg,rgba(5,8,15,.9),rgba(5,8,15,0));}
  .kule-btn{background:rgba(17,24,39,.92);border:2px solid rgba(255,255,255,.15);color:#e5e7eb;
            border-radius:12px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;
            min-width:96px;}
  .kule-btn.secili{border-color:#38bdf8;box-shadow:0 0 0 2px rgba(56,189,248,.35);}
  .kule-btn:disabled{opacity:.45;cursor:not-allowed;}
  #uyari{position:absolute;top:44%;left:0;right:0;z-index:12;text-align:center;color:#fbbf24;
         font-size:26px;font-weight:800;text-shadow:0 2px 10px rgba(0,0,0,.8);
         opacity:0;transition:opacity .3s;pointer-events:none;}
  #uyari.gorunur{opacity:1;}
  #vinyet{position:absolute;inset:0;z-index:9;pointer-events:none;opacity:0;
          transition:opacity .4s;
          background:radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(220,38,38,.55) 100%);}
  #yetenekBtn{position:absolute;right:14px;bottom:86px;z-index:11;display:none;
              background:rgba(17,24,39,.92);border:2px solid rgba(255,255,255,.2);
              color:#e5e7eb;border-radius:12px;padding:10px 16px;font-size:14px;
              font-weight:700;cursor:pointer;min-width:130px;}
  #yetenekBtn:disabled{opacity:.45;cursor:not-allowed;}
  #yetenekBtn.hedefleme{border-color:#fbbf24;box-shadow:0 0 0 3px rgba(251,191,36,.35);}
  /* v2: bölüm/harita arayüzü */
  #hizBtn{position:absolute;top:10px;right:14px;z-index:11;background:rgba(17,24,39,.85);
          border:2px solid rgba(255,255,255,.18);color:#e5e7eb;border-radius:10px;
          min-width:48px;min-height:40px;font-size:15px;font-weight:800;cursor:pointer;}
  #hizBtn.aktif{border-color:#fbbf24;color:#fbbf24;}
  #dalgaCagirBtn{position:absolute;left:14px;bottom:86px;z-index:11;display:none;
                 background:rgba(17,24,39,.92);border:2px solid #fbbf24;color:#fde68a;
                 border-radius:12px;padding:10px 16px;min-height:44px;font-size:14px;
                 font-weight:700;cursor:pointer;}
  #bolumKart{position:absolute;top:58px;left:50%;transform:translateX(-50%);z-index:12;
             pointer-events:none;opacity:0;transition:opacity .35s;text-align:center;
             background:rgba(17,24,39,.94);border:1px solid rgba(251,191,36,.45);
             border-radius:14px;padding:10px 22px;color:#e5e7eb;min-width:220px;}
  #bolumKart.gorunur{opacity:1;}
  #bolumKart .kbaslik{font-weight:800;font-size:16px;}
  #bolumKart .kyildiz{color:#fbbf24;font-size:26px;letter-spacing:4px;line-height:1.2;}
  #bolumKart .kmetin{font-size:13px;color:#cbd5e1;}
  #zorlukSecim{display:flex;gap:8px;justify-content:center;margin-top:12px;}
  #zorlukSecim button{background:#1f2937;color:#cbd5e1;border:2px solid rgba(255,255,255,.14);
                      border-radius:10px;padding:8px 14px;min-height:40px;font-weight:700;cursor:pointer;}
  #zorlukSecim button.secili{border-color:#38bdf8;color:#fff;}
  /* v3: mekanik rozeti, boss bandı, dar ekran kule paneli */
  #hudMekanik{border-color:rgba(251,191,36,.55)!important;color:#fde68a;}
  #menuNasil{background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.35);border-radius:10px;
             padding:8px 12px;color:#fde68a;font-size:14px;line-height:1.45;margin:6px 0 10px;}
  @media (max-width:520px){
    #kulePanel{gap:5px;padding:8px 6px;flex-wrap:nowrap;}
    .kule-btn{min-width:0;flex:1 1 0;padding:6px 4px;font-size:11px;}
    #hud{gap:6px;font-size:12px;padding:8px;} #hud .kutu{padding:4px 8px;}
  }
  .text-3xl{font-size:30px;} .text-2xl{font-size:24px;} .text-sm{font-size:13px;}
  .font-bold{font-weight:700;} .mb-3{margin-bottom:12px;} .mb-2{margin-bottom:8px;}
  .text-slate-300{color:#cbd5e1;} .text-slate-400{color:#94a3b8;}
</style>
</head>
<body>
<div id="sahne">
  <canvas id="oyunCanvas"></canvas>

  <div id="hud">
    <div class="kutu">Can: <span id="hudCan">20</span></div>
    <div class="kutu">Altın: <span id="hudAltin">0</span></div>
    <div class="kutu">Dalga: <span id="hudDalga">0</span>/<span id="hudToplamDalga">36</span></div>
    <div class="kutu">Bölüm: <span id="hudBolum">1</span>/<span id="hudToplamBolum">9</span></div>
    <div class="kutu" id="hudHarita"></div>
    <div class="kutu">Skor: <span id="hudSkor">0</span></div>
    <div class="kutu" id="hudCombo" style="display:none">Seri ×<span id="hudComboSayi">1</span></div>
    <div class="kutu" id="hudMekanik" style="display:none"></div>
  </div>

  <div id="uyari"></div>
  <div id="vinyet"></div>
  <button id="yetenekBtn"></button>
  <button id="hizBtn" title="Oyun hızı">1×</button>
  <button id="dalgaCagirBtn"></button>
  <div id="bolumKart"></div>

  <div id="kulePanel"></div>

  <div id="menuOverlay" class="overlay">
    <div class="panel">
      <h1 id="menuBaslik" class="text-3xl font-bold mb-3">Kale hendeği savunması</h1>
      <p id="menuAciklama" class="text-slate-300 mb-2"></p>
      <p id="menuNasil" style="display:none"></p>
      <p class="text-slate-400 text-sm">Kule seçmek için alttaki panele, yerleştirmek için haritaya dokun.
         Kurulu kuleye dokunarak yükselt veya sat. 3 harita, 9 bölüm, 36 dalga;
         her bölüm sonunda ilerlemen kaydedilir.</p>
      <div id="zorlukSecim"><button data-z="kolay">Kolay</button><button data-z="normal">Normal</button><button data-z="zor">Zor</button></div>
      <button id="baslaBtn" class="btn">Oyunu Başlat</button>
      <button id="devamBtn" class="btn ikincil" style="display:none"></button>
    </div>
  </div>

  <div id="sonOverlay" class="overlay gizli">
    <div class="panel">
      <h2 id="sonBaslik" class="text-3xl font-bold mb-2">Oyun Bitti</h2>
      <p id="sonMetin" class="text-slate-300"></p>
      <button id="yenidenBtn" class="btn">Yeniden Başlat</button>
      <button id="sonDevamBtn" class="btn ikincil" style="display:none"></button>
    </div>
  </div>

  <div id="kuleMenu" class="overlay gizli">
    <div class="panel">
      <h3 id="kmBaslik" class="text-2xl font-bold mb-2">Kule</h3>
      <p id="kmBilgi" class="text-slate-300 mb-2"></p>
      <button id="kmYukselt" class="btn">Yükselt</button>
      <button id="kmSat" class="btn ikincil">Sat</button>
      <button id="kmKapat" class="btn ikincil">Kapat</button>
    </div>
  </div>
</div>

<script>
/* v2: eklentilerin sık kullandığı çizim alanı boyutları (bkz. motor_v2 sapma listesi) */
window.W = 1280; window.H = 720;
</script>
<script>
/* ============================================================
   TEMA EKLENTİSİ (Gemini tarafından üretilir)
   ============================================================ */
const TEMA = {
  ad: "Hendeğin Savunucuları",
  aciklama: "Kaleni yaklaşan düşman ordularına karşı su dolu hendeklerle ve güçlü kulelerle savun.",
  palet: {
    arka1: "#1A2F3D", // Koyu gökyüzü / derin su
    arka2: "#4C6C7E", // Açık gökyüzü / sis
    yol: "#3E4D4A", // Hendeğin içindeki kirli su
    yolKenar: "#6F594D", // Hendek kenarı toprağı
    dusman: "#C93D3D", // Kırmızımsı düşman
    dusman2: "#7A2A2A", // Daha koyu/zırhlı düşman
    kule: "#9E8B7A", // Kumtaşı kule rengi
    mermi: "#F5E68C", // Altın rengi mermi
    vurgu: "#7AC943" // Yeşilimsi vurgu (su büyüsü, yavaşlatma)
  },
  yol: [
    {x:0, y:150},
    {x:200, y:150},
    {x:400, y:300},
    {x:600, y:300},
    {x:800, y:500},
    {x:1000, y:500},
    {x:1280, y:600}
  ],
  dusmanTipleri: [
    {ad:"Hafif Piyade", can:60, hiz:62, altin:12, yaricap:14, renk:"#C93D3D"},
    {ad:"Süratli Akıncı", can:42, hiz:96, altin:14, yaricap:12, renk:"#E87A38"},
    {ad:"Zırhlı Şövalye", can:155, hiz:44, altin:23, yaricap:18, renk:"#7A2A2A"}
  ],
  kuleTipleri: [
    {ad:"Okçu Kulesi", fiyat:50, menzil:150, hasar:18, atisHizi:1.2, mermiHizi:360, renk:"#9E8B7A"},
    {ad:"Mancınık", fiyat:90, menzil:125, hasar:44, atisHizi:0.55, mermiHizi:270, renk:"#B5A08C", alan:48},
    {ad:"Su Büyücüsü", fiyat:70, menzil:135, hasar:8, atisHizi:0.9, mermiHizi:330, renk:"#8CAAB5", yavaslat:0.5}
  ],
  arkaplanCiz(c, W, H, t){
    c.save();

    // Katman 1: Gökyüzü / Ufuk Gradient
    let skyGrad = c.createLinearGradient(0, 0, 0, H * 0.7);
    skyGrad.addColorStop(0, this.palet.arka1);
    skyGrad.addColorStop(1, this.palet.arka2);
    c.fillStyle = skyGrad;
    c.fillRect(0, 0, W, H);

    // Katman 2: En uzak silüet - Dağlar/tepeler (soluk)
    c.fillStyle = "rgba(40, 50, 60, 0.3)";
    c.beginPath();
    c.moveTo(0, H * 0.7);
    c.lineTo(W * 0.2, H * 0.55);
    c.lineTo(W * 0.4, H * 0.65);
    c.lineTo(W * 0.6, H * 0.5);
    c.lineTo(W * 0.8, H * 0.6);
    c.lineTo(W, H * 0.5);
    c.lineTo(W, H * 0.7);
    c.closePath();
    c.fill();

    // Katman 3: Orta mesafe dekoru - Kale (ana yapı) ve birkaç ağaç
    // Kale ana yapısı (yolun sonuna yakın)
    c.fillStyle = "rgba(90, 80, 70, 0.6)"; // Taş rengi
    c.shadowColor = "rgba(0,0,0,0.5)";
    c.shadowBlur = 8;
    
    // Ana kule/kale duvarı
    c.fillRect(W - 350, H - 300, 200, 200);
    c.fillRect(W - 370, H - 320, 50, 20); // Sol üst kule
    c.fillRect(W - 270, H - 320, 50, 20); // Orta üst kule
    c.fillRect(W - 170, H - 320, 50, 20); // Sağ üst kule

    // Giriş kapısı
    c.fillStyle = "rgba(70, 60, 50, 0.7)";
    c.fillRect(W - 290, H - 180, 80, 100); // Kapı altı
    c.fillRect(W - 300, H - 210, 100, 40); // Kapı üstü

    // Ağaçlar
    c.fillStyle = "rgba(50, 70, 40, 0.5)"; // Koyu yeşil
    c.shadowBlur = 0; // Ağaçlarda gölge olmasın
    c.beginPath(); c.arc(100, H - 150, 40, 0, Math.PI * 2); c.fill(); // Ağaç 1
    c.beginPath(); c.arc(300, H - 100, 50, 0, Math.PI * 2); c.fill(); // Ağaç 2
    c.beginPath(); c.arc(500, H - 180, 35, 0, Math.PI * 2); c.fill(); // Ağaç 3
    c.beginPath(); c.arc(700, H - 120, 60, 0, Math.PI * 2); c.fill(); // Ağaç 4

    // Katman 4: Yakın zemin dokusu (toprak/çim)
    c.fillStyle = "rgba(80, 70, 60, 0.4)"; // Toprak rengi
    for (let i = 0; i < 50; i++) {
      c.beginPath();
      c.arc(Math.random() * W, H * 0.6 + Math.random() * H * 0.4, 2 + Math.random() * 5, 0, Math.PI * 2);
      c.fill();
    }
    
    // Katman 5: Hareketli/animasyonlu öğe (hendek suyu buharı/sis)
    c.fillStyle = `rgba(180, 200, 210, ${0.1 + Math.sin(t * 0.5) * 0.05})`; // Açık mavi sis, hafif animasyonlu opaklık
    c.beginPath();
    c.moveTo(0, H);
    for (let i = 0; i <= W; i += 20) {
      c.lineTo(i, H - 50 + Math.sin((i + t * 50) / 100) * 15 + Math.cos((i + t * 30) / 50) * 10);
    }
    c.lineTo(W, H);
    c.closePath();
    c.fill();

    c.restore();
  },
  yolCiz(c, yol, t){
    c.save();
    c.lineCap = "round";
    c.lineJoin = "round";
    c.shadowColor = "rgba(0,0,0,0.5)";
    c.shadowBlur = 6;

    // Hendek kenarı (toprak)
    c.strokeStyle = this.palet.yolKenar;
    c.lineWidth = 20;
    c.beginPath();
    c.moveTo(yol[0].x, yol[0].y);
    for (let i = 1; i < yol.length; i++) {
      c.lineTo(yol[i].x, yol[i].y);
    }
    c.stroke();

    // Hendek içindeki su (daha koyu)
    c.strokeStyle = this.palet.yol;
    c.lineWidth = 12;
    c.beginPath();
    c.moveTo(yol[0].x, yol[0].y);
    for (let i = 1; i < yol.length; i++) {
      c.lineTo(yol[i].x, yol[i].y);
    }
    c.stroke();

    // Su dalgaları (animasyonlu)
    c.strokeStyle = this.palet.vurgu; // Su büyüsü rengi
    c.lineWidth = 2;
    c.globalAlpha = 0.5 + Math.sin(t * 1.5) * 0.1; // Hafif opaklık dalgalanması
    c.setLineDash([8, 12]);
    c.lineDashOffset = -t * 30; // Hızla hareket eden dalgalar
    c.beginPath();
    c.moveTo(yol[0].x, yol[0].y);
    for (let i = 1; i < yol.length; i++) {
      c.lineTo(yol[i].x, yol[i].y);
    }
    c.stroke();

    c.setLineDash([]); // Çizgi desenini sıfırla
    c.globalAlpha = 1; // Opaklığı sıfırla
    c.shadowBlur = 0;
    c.restore();
  },
  dusmanCiz(c, d, t){
    c.save();
    c.translate(d.x, d.y);

    let bodyScale = 1 + Math.sin(d.faz * Math.PI * 2 + t * 0.5) * 0.08; // Yürüme animasyonu için bobbing
    let armPhase = Math.sin(d.faz * Math.PI * 2 + t);
    let legPhase = Math.sin(d.faz * Math.PI * 4 + t * 1.5);

    c.strokeStyle = "#000";
    c.lineWidth = 2;
    c.lineJoin = "round";
    c.shadowColor = "rgba(0,0,0,0.5)";
    c.shadowBlur = 4;

    // Bacaklar
    c.fillStyle = d.renk;
    c.beginPath();
    c.ellipse(-d.yaricap * 0.3 * bodyScale, d.yaricap * 0.5 * bodyScale + legPhase * d.yaricap * 0.1, d.yaricap * 0.25 * bodyScale, d.yaricap * 0.4 * bodyScale, 0, 0, Math.PI * 2); c.fill(); c.stroke();
    c.ellipse(d.yaricap * 0.3 * bodyScale, d.yaricap * 0.5 * bodyScale - legPhase * d.yaricap * 0.1, d.yaricap * 0.25 * bodyScale, d.yaricap * 0.4 * bodyScale, 0, 0, Math.PI * 2); c.fill(); c.stroke();

    // Gövde
    c.fillStyle = d.renk;
    c.beginPath();
    c.ellipse(0, -d.yaricap * 0.1 * bodyScale, d.yaricap * 0.7 * bodyScale, d.yaricap * 0.8 * bodyScale, 0, 0, Math.PI * 2); c.fill(); c.stroke();

    // Kafa
    c.fillStyle = "#FAD7A0"; // Ten rengi
    c.beginPath();
    c.arc(0, -d.yaricap * 0.8 * bodyScale, d.yaricap * 0.4 * bodyScale, 0, Math.PI * 2); c.fill(); c.stroke();
    c.fillStyle = this.palet.dusman2; // Kask rengi
    c.beginPath();
    c.arc(0, -d.yaricap * 0.8 * bodyScale, d.yaricap * 0.4 * bodyScale, Math.PI, Math.PI * 2); c.fill(); c.stroke();

    // Kollar
    c.fillStyle = d.renk;
    c.beginPath();
    c.ellipse(-d.yaricap * 0.6 * bodyScale, d.yaricap * 0.1 * bodyScale - armPhase * d.yaricap * 0.1, d.yaricap * 0.2 * bodyScale, d.yaricap * 0.5 * bodyScale, -Math.PI / 4, 0, Math.PI * 2); c.fill(); c.stroke();
    c.ellipse(d.yaricap * 0.6 * bodyScale, d.yaricap * 0.1 * bodyScale + armPhase * d.yaricap * 0.1, d.yaricap * 0.2 * bodyScale, d.yaricap * 0.5 * bodyScale, Math.PI / 4, 0, Math.PI * 2); c.fill(); c.stroke();

    // Silah (mızrak)
    c.strokeStyle = "#403020";
    c.lineWidth = 3;
    c.beginPath();
    c.moveTo(d.yaricap * 0.5 * bodyScale, -d.yaricap * 0.4 * bodyScale);
    c.lineTo(d.yaricap * 1 * bodyScale, -d.yaricap * 1 * bodyScale);
    c.stroke();
    c.fillStyle = "#A0A0A0"; // Mızrak ucu
    c.beginPath();
    c.moveTo(d.yaricap * 1 * bodyScale, -d.yaricap * 1 * bodyScale);
    c.lineTo(d.yaricap * 1.15 * bodyScale, -d.yaricap * 1.05 * bodyScale);
    c.lineTo(d.yaricap * 0.95 * bodyScale, -d.yaricap * 1.2 * bodyScale);
    c.closePath();
    c.fill();
    c.stroke();

    // Boss ise taç ekle
    if (d.bos) {
      c.fillStyle = "#FFD700"; // Altın rengi
      c.beginPath();
      c.moveTo(-d.yaricap * 0.3 * bodyScale, -d.yaricap * 1.2 * bodyScale);
      c.lineTo(0, -d.yaricap * 1.4 * bodyScale);
      c.lineTo(d.yaricap * 0.3 * bodyScale, -d.yaricap * 1.2 * bodyScale);
      c.lineTo(d.yaricap * 0.2 * bodyScale, -d.yaricap * 1.0 * bodyScale);
      c.lineTo(-d.yaricap * 0.2 * bodyScale, -d.yaricap * 1.0 * bodyScale);
      c.closePath();
      c.fill();
      c.stroke();
    }

    c.shadowBlur = 0;
    c.restore();
  },
  kuleCiz(c, k, t){
    c.save();
    c.translate(k.x, k.y);

    c.strokeStyle = "#000";
    c.lineWidth = 2;
    c.lineJoin = "round";
    c.shadowColor = "rgba(0,0,0,0.5)";
    c.shadowBlur = 5;

    // Her kule tipi için farklı çizim
    if (k.tip.ad === "Okçu Kulesi") {
      // Taban
      c.fillStyle = k.tip.renk;
      c.beginPath();
      c.arc(0, 0, 20, 0, Math.PI * 2); c.fill(); c.stroke();

      // Gövde (Uzun, ince)
      c.fillRect(-12, -28, 24, 32); c.strokeRect(-12, -28, 24, 32);

      // Detaylar (Sivri çitler/dikenler)
      c.fillStyle = k.tip.renk;
      c.fillRect(-15, -30, 8, 4); c.fillRect(-2, -30, 4, 4); c.fillRect(7, -30, 8, 4);
      c.strokeRect(-15, -30, 8, 4); c.strokeRect(-2, -30, 4, 4); c.strokeRect(7, -30, 8, 4);
      
      // Seviye detayları
      if (k.seviye > 1) {
        c.strokeStyle = "#403020"; c.lineWidth = 1;
        c.beginPath(); c.moveTo(-10, -10); c.lineTo(10, -10); c.stroke();
      }
      if (k.seviye > 2) {
        c.beginPath(); c.moveTo(-10, -20); c.lineTo(10, -20); c.stroke();
      }

      // Namlu (Hedef yönüne döner)
      c.rotate(k.aci);
      c.fillStyle = "#403020";
      c.fillRect(0, -4, 26, 8); c.strokeRect(0, -4, 26, 8);

      // Ateş anı parlaması
      if (k.flas > 0) {
        c.fillStyle = this.palet.mermi;
        c.beginPath();
        c.arc(26, 0, 8 * k.flas, 0, Math.PI * 2); c.fill();
      }

    } else if (k.tip.ad === "Mancınık") {
      // Taban (Geniş, alçak)

        c.arc(24, 0, 10 * k.flas, 0, Math.PI * 2); c.fill();

    c.shadowBlur = 0;
    c.restore();
  }

  function fazHesapla(g){ return DONGU ? Math.floor(Math.max(0, g-1) / DONGU.her) % DONGU.fazlar.length : 0; }
  function sinir(v, a, b, varsayilan){ v = +v; return (v === v) ? Math.max(a, Math.min(b, v)) : varsayilan; }
  // Kancaların gördüğü oyun API'si (tek nesne; değerler canlı okunur)
  const O = {
    get dalga(){ return dalga; }, get faz(){ return fazNo; },
    get fazAd(){ return DONGU ? DONGU.fazlar[fazNo].ad : ""; },
    get zaman(){ return zaman; }, get harita(){ return haritaNo; }, get zorluk(){ return zorluk; },
    get altin(){ return altin; }, get can(){ return can; },
    get dusmanlar(){ return dusmanlar; }, get kuleler(){ return kuleler; },
    bellek: mkBellek, W: REF_W, H: REF_H,
    altinEkle(n){
      n = Math.round(sinir(n, -1000, 200, 0)); if (!n) return 0;
      if (n > 0){
        const tavan = Math.max(40, butce(Math.max(1, dalga)) * D.odulKatsayi * D.mekanikAltinOran);
        n = Math.min(n, Math.max(0, Math.floor(tavan - mkEkAltin))); mkEkAltin += n;
      }
      altin = Math.max(0, altin + n); mkDurum.etki.altin += n; if (n) hudGuncelle(); return n;
    },
    canEkle(n){
      n = Math.round(sinir(n, -5, 3, 0)); if (!n) return 0;
      if (n > 0){ n = Math.min(n, D.mekanikCanArtiMax - mkCanArti); if (n <= 0) return 0; mkCanArti += n; }
      if (sinirsizCanTest && n < 0) return 0;
      can = Math.min(BASLANGIC_CAN, can + n); mkDurum.etki.can += n; hudGuncelle();
      if (can <= 0 && asama === "oyunda"){ can = 0; bitir(false); }
      return n;
    },
    dusmanEkle(tipIndeks, ayar){
      ayar = ayar || {};
      if (mkEkDusman >= D.ekDusmanMax || dusmanlar.length >= D.canliDusmanMax) return null;
      const ti = Math.max(0, Math.min(DUSMAN_TIPLERI.length-1, tipIndeks|0));
      const yakin = ayar.yakin && dusmanlar.indexOf(ayar.yakin) >= 0 ? ayar.yakin : null;
      const rota = yakin ? yakin.rota : Math.max(0, Math.min(harita().rotalar.length-1, ayar.rota|0));
      dusmanEkle({tip: ti, bos: false, guc: sonGuc * sinir(ayar.canOrani, 0.1, 2, 0.5), rota, ofset: 0}, true);
      const yeni = dusmanlar[dusmanlar.length-1];
      yeni.mesafe = yakin ? Math.max(0, yakin.mesafe - 6) : Math.max(0, +ayar.mesafe || 0);
      const n = rotaNoktasi(harita().rotalar[yeni.rota] || anaRota(), yeni.mesafe);
      yeni.x = yeni.px = n.x; yeni.y = yeni.py = n.y;
      yeni.altin = Math.max(1, Math.round(yeni.altin * 0.5));   // ek düşmandan yarım ödül (çiftlik olmasın)
      mkEkDusman++; mkDurum.etki.ekDusman++;
      return yeni;
    },
    yakinKuleler(x, y, r){ const l = []; for (const k of kuleler) if (Math.hypot(k.x-x, k.y-y) <= r) l.push(k); return l; },
    yakinDusmanlar(x, y, r){ const l = []; for (const q of dusmanlar) if (q.mesafe >= 0 && Math.hypot(q.x-x, q.y-y) <= r) l.push(q); return l; },
    parcacik(x, y, renk, adet){ patlamaEkle(+x||0, +y||0, renk || "#ffffff", Math.max(1, Math.min(30, adet|0 || 8))); },
    yazi(x, y, metin, renk){ yaziEkle(+x||0, +y||0, String(metin).slice(0, 24), renk); },
    uyari(metin){ uyariGoster(String(metin).slice(0, 60)); },
    rastgele(){ return mkRng(); },
    // Düşmanı yolda geri iter (en çok 80 px; aynı düşman 1.5 sn'de bir)
    geriIt(q, px){
      if (!q || dusmanlar.indexOf(q) < 0) return false;
      q.ozel = q.ozel || {};
      if (zaman - (q.ozel._itme || -9) < 1.5) return false;
      q.mesafe = Math.max(0, q.mesafe - sinir(px, 0, 80, 40)); q.ozel._itme = zaman;
      mkDurum.etki.itme++; return true;
    },
    yolUzunlugu(rotaNo){ const r = harita().rotalar[rotaNo|0] || anaRota(); return r.toplam; },
    yolNoktasi(oran, rotaNo){
      const r = harita().rotalar[rotaNo|0] || anaRota();
      return rotaNoktasi(r, r.toplam * sinir(oran, 0, 1, 0));
    }
  };
  function haritaBilgisi(){ return {no: haritaNo, ad: HARITALAR[haritaNo].ad, toplam: D.haritaSayisi}; }

  // ---------- Yardımcı ----------
  function rastgele(a,b){ return a + Math.random()*(b-a); }
  function mesafe(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }

  function boyutlandir(){
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.floor(window.innerWidth * dpr);
    canvas.height = Math.floor(window.innerHeight * dpr);
    const o = Math.min(canvas.width/REF_W, canvas.height/REF_H);
    olcek = o;
    kaydirX = (canvas.width - REF_W*o)/2;
    kaydirY = (canvas.height - REF_H*o)/2;
  }
  window.addEventListener("resize", boyutlandir);

  function olayNoktasi(e){
    const r = canvas.getBoundingClientRect();
    const kx = (e.touches && e.touches[0]) ? e.touches[0].clientX :
               (e.changedTouches && e.changedTouches[0]) ? e.changedTouches[0].clientX : e.clientX;
    const ky = (e.touches && e.touches[0]) ? e.touches[0].clientY :
               (e.changedTouches && e.changedTouches[0]) ? e.changedTouches[0].clientY : e.clientY;
    const px = (kx - r.left) * (canvas.width / r.width);
    const py = (ky - r.top) * (canvas.height / r.height);
    return {x: (px - kaydirX)/olcek, y: (py - kaydirY)/olcek};
  }

  // v2: kurulum yasağı haritanın TÜM rotalarına uygulanır
  function yolaYakinMi(p, esik){
    const rotalar = harita().rotalar;
    for (let r=0;r<rotalar.length;r++){
      const yol = rotalar[r].n;
      for (let i=0;i<yol.length-1;i++){
        const a=yol[i], b=yol[i+1];
        const dx=b.x-a.x, dy=b.y-a.y;
        const uzun = dx*dx+dy*dy || 1;
        let t = ((p.x-a.x)*dx + (p.y-a.y)*dy)/uzun;
        t = Math.max(0, Math.min(1, t));
        const px=a.x+dx*t, py=a.y+dy*t;
        if (Math.hypot(p.x-px, p.y-py) < esik) return true;
      }
    }
    return false;
  }

  /* ---------- v2: Bütçe tabanlı dalga üretici (§4.3) ----------
     v1: sabit adet + 1.28^n güç + rastgele tip → her dalga aynı his, zorluk ya düz ya uçuk.
     v2: her dalganın bir tehdit bütçesi var; şablon adedi ve tipleri seçer, birim gücü
     bütçeyi doldurur. Tehdit puanını motor hesaplar (eklentinin sayısal hatası dengeyi
     bozamaz). Plan saf fonksiyondur: (tohum, dalga no, zorluk) → aynı içerik. */
  function tehditHesapla(canD, hiz, zirh){
    return canD * Math.pow(Math.max(1, hiz)/60, D.tehditHizUs) * (1 + (zirh||0)) / D.tehditBolen;
  }
  function tipZirh(t){ return Math.max(0, Math.min(D.zirhTavan, +t.zirh || 0)); }
  function tipTehdit(i, bos){
    const t = DUSMAN_TIPLERI[i];
    const c = (+t.can || 60) * (bos ? D.boss.can : 1);
    const h = (+t.hiz || 60) * (bos ? D.boss.hiz : 1);
    return tehditHesapla(c, h, tipZirh(t));
  }
  function dalgaBilgisi(g){
    const bolumIci = ((g-1) % D.dalgaPerBolum) + 1;
    const h = Math.min(D.haritaSayisi-1, Math.floor((g-1) / DALGA_PER_HARITA));
    const haritaIlk = ((g-1) % DALGA_PER_HARITA) === 0;
    const boss = bolumIci === D.dalgaPerBolum;
    return {bolumIci, harita:h, haritaIlk, boss,
            bolum: Math.floor((g-1) / D.dalgaPerBolum) + 1,
            ritim: boss ? (h === 0 ? D.ritimBossIlk : D.ritimBoss) : (haritaIlk ? D.ritimHaritaBasi : D.ritimNormal)};
  }
  // v3: zorluk çarpanı tek yerde; ödül bu çarpandan BAĞIMSIZ hesaplanır (aksi halde kolay modda
  // düşman zayıflarken altın da azalıyor, zorluklar birbirine benziyordu)
  function zorlukK(g){
    let K = D.zorluk[zorluk] || 1;
    if (K > 1 && D.zorlukRampa > 0) K = 1 + (K - 1) * Math.min(1, g / D.zorlukRampa);
    return K;
  }
  function butce(g){
    const K = zorlukK(g);
    return K * (D.butceTaban + D.butceDogrusal*g) * Math.pow(D.butceUstel, g) * dalgaBilgisi(g).ritim;
  }
  function acikTipler(h){
    const n = Math.min(DUSMAN_TIPLERI.length, D.tipAcilim[h] || DUSMAN_TIPLERI.length);
    const l = []; for (let i=0;i<Math.max(1,n);i++) l.push(i);
    return l;
  }
  // Şablon zinciri: art arda aynı şablon gelmez. Seçim yalnız tohuma ve dalga no'ya bağlı.
  const sablonOnbellek = new Map();
  function sablonAl(g){
    if (g < 1) return null;
    if (sablonOnbellek.has(g)) return sablonOnbellek.get(g);
    const bilgi = dalgaBilgisi(g);
    let s;
    if (bilgi.boss) s = "boss";
    else {
      const onceki = sablonAl(g-1);
      const aday = ["suru", "tank", "akin", "karisik"];
      if (HARITALAR[bilgi.harita].rotalar.length >= 2) aday.push("ciftKol");
      const uygun = aday.filter(a => a !== onceki);
      const r = rngOlustur(tohumKaristir(tohum, 1000 + g));
      s = uygun[Math.floor(r() * uygun.length)];
    }
    sablonOnbellek.set(g, s);
    return s;
  }
  function adetHesapla(anahtar, g){
    const a = D.sablonAdet[anahtar];
    return Math.max(1, Math.min(a[2], Math.floor(a[0] + a[1]*g)));
  }
  const kapsamaOnbellek = [];
  function haritaKatsayisi(h){
    if (kapsamaOnbellek[h] !== undefined) return kapsamaOnbellek[h];
    const ornek = [];
    for (const r of HARITALAR[h].rotalar) for (let m = 0; m <= r.toplam; m += 12){
      const p = rotaNoktasi(r, m); if (p.x >= 0 && p.x <= REF_W && p.y >= 0 && p.y <= REF_H) ornek.push(p);
    }
    const yakin = (p, esik) => { for (const r of HARITALAR[h].rotalar){ const yl = r.n;
      for (let i=0;i<yl.length-1;i++){ const a=yl[i], b=yl[i+1], dx=b.x-a.x, dy=b.y-a.y, u=dx*dx+dy*dy||1;
        let t=((p.x-a.x)*dx+(p.y-a.y)*dy)/u; t=Math.max(0,Math.min(1,t));
        if (Math.hypot(p.x-a.x-dx*t, p.y-a.y-dy*t) < esik) return true; } } return false; };
    const kap = [];
    for (let y = 70; y <= 640; y += 34) for (let x = 30; x <= 1250; x += 34){
      if (yakin({x, y}, 36)) continue;
      let n = 0; for (const p of ornek) if ((p.x-x)*(p.x-x)+(p.y-y)*(p.y-y) <= 140*140) n++;
      kap.push(n);
    }
    kap.sort((a, b) => b - a);
    const ust = kap.slice(0, 10); const ort = ust.length ? ust.reduce((a, b) => a + b, 0) / ust.length : D.kapsamaRef;
    const k = Math.max(D.kapsamaAlt, Math.min(D.kapsamaUst, Math.pow(ort / D.kapsamaRef, D.kapsamaUs)));
    kapsamaOnbellek[h] = k;
    return k;
  }
  let verimOnbellek = null;
  function kuleVerimi(){
    if (verimOnbellek !== null) return verimOnbellek;
    let top = 0, n = 0;
    for (const t of KULE_TIPLERI){
      const f = Math.max(1, +t.fiyat || 60);
      top += (+t.hasar || 10) * (+t.atisHizi || 1) * (t.alan ? 1.8 : 1) * (t.yavaslat ? 1.25 : 1) / f; n++;
    }
    const ham = n ? top / n : D.verimRef;
    verimOnbellek = Math.max(D.verimAlt, Math.min(D.verimUst, Math.pow(ham / D.verimRef, D.verimUs)));
    return verimOnbellek;
  }
  function odulAzalma(g){
    const b1 = (D.butceTaban + D.butceDogrusal) * D.butceUstel;
    const bg = (D.butceTaban + D.butceDogrusal * g) * Math.pow(D.butceUstel, g);
    return Math.pow(b1 / bg, D.odulAzalmaUs);
  }
  function dalgaPlani(g){
    const bilgi = dalgaBilgisi(g);
    const r = rngOlustur(tohumKaristir(tohum, g));
    const acik = acikTipler(bilgi.harita);
    const sablon = sablonAl(g);
    const B = butce(g);
    const rotaSay = HARITALAR[bilgi.harita].rotalar.length;
    const hepsi = acik.slice();
    const canaGore = hepsi.slice().sort((a,b)=> (+DUSMAN_TIPLERI[a].can||0) - (+DUSMAN_TIPLERI[b].can||0));
    const hizaGore = hepsi.slice().sort((a,b)=> (+DUSMAN_TIPLERI[b].hiz||0) - (+DUSMAN_TIPLERI[a].hiz||0));
    const ilkYari = l => l.slice(0, Math.max(1, Math.ceil(l.length/2)));
    let havuz, anahtar = sablon;
    if (sablon === "suru") havuz = ilkYari(canaGore);
    else if (sablon === "tank") havuz = ilkYari(canaGore.slice().reverse());
    else if (sablon === "akin") havuz = ilkYari(hizaGore);
    else { havuz = hepsi; if (sablon === "boss") anahtar = "bossEskort"; }

    let adet = adetHesapla(anahtar, g);
    const tipler = [];
    for (let i=0;i<adet;i++) tipler.push(havuz[Math.floor(r() * havuz.length)]);

    let bossTip = null, bossGuc = 0, eskortButce = B;
    if (sablon === "boss"){
      bossTip = canaGore[canaGore.length-1];            // açık tiplerin en dayanıklısı
      const pay = D.boss.butcePayi[bilgi.harita] || 0.4;
      bossGuc = (B * pay) / tipTehdit(bossTip, true);
      eskortButce = B * (1 - pay);
    }
    // Birim gücü bütçeyi doldurur; çok düşerse adet azaltılır (anlamsız zayıf kalabalık olmasın)
    let taban = 0; for (const t of tipler) taban += tipTehdit(t, false);
    let guc = eskortButce / (taban || 1);
    while (guc < D.minGuc && tipler.length > 3){
      taban -= tipTehdit(tipler.pop(), false);
      guc = eskortButce / (taban || 1);
    }
    const birimler = [];
    const kk = haritaKatsayisi(bilgi.harita) * kuleVerimi();   // v3: harita kapsaması × kule verimi
    guc *= kk; bossGuc *= kk;
    for (let i=0;i<tipler.length;i++){
      const rota = (sablon === "ciftKol" && rotaSay >= 2) ? (i % 2) : 0;
      birimler.push({tip: tipler[i], bos: false, guc, rota, ofset: r()*40});
    }
    if (bossTip !== null){
      // Boss eskortun ortasında gelir
      birimler.splice(Math.floor(birimler.length/2), 0,
        {tip: bossTip, bos: true, guc: bossGuc, rota: 0, ofset: r()*40});
    }
    return {g, sablon, butce: B, ritim: bilgi.ritim, bolum: bilgi.bolum,
            harita: bilgi.harita, aralik: D.spawnAralik[sablon] || 0.75, birimler};
  }

  function dusmanEkle(b, mekanikten){
    const t = DUSMAN_TIPLERI[b.tip];
    const maxCan = (+t.can || 60) * b.guc * (b.bos ? D.boss.can : 1);
    const hiz = (+t.hiz || 60) * (b.bos ? D.boss.hiz : 1);
    const zirh = tipZirh(t);
    const r = harita().rotalar[Math.min(b.rota, harita().rotalar.length-1)];
    const n = rotaNoktasi(r, 0);
    dusmanlar.push({
      tip:t, ad:t.ad, tipIndeks:b.tip,          // v1.2: eklenti tipe göre dallanabilsin
      rota: Math.min(b.rota, harita().rotalar.length-1), mesafe:-b.ofset,
      maxCan, can: maxCan, hiz, zirh,
      // v2: ödül birimin gerçek tehdidiyle orantılı (§4.3); v1'deki tip.altin kullanılmaz
      // v3: ödül haritanın kapsama katsayısından bağımsız (kolay haritada fazla altın olmasın)
      // ve geç dalgalarda yavaşça azalır (bkz. odulAzalma)
      altin: Math.max(1, Math.round(tehditHesapla(maxCan / (haritaKatsayisi(haritaNo) * kuleVerimi()) / zorlukK(Math.max(1, dalga)), hiz, zirh)
                                    * D.odulKatsayi * odulAzalma(Math.max(1, dalga)))),
      yaricap: (t.yaricap||14)*(b.bos?D.boss.yaricap:1), renk: t.renk||P.dusman,
      bos: !!b.bos, yavaslama:1, yavaslamaSayac:0, faz: Math.random()*6.28,
      vurulmaZaman:0, x:n.x, y:n.y, px:n.x, py:n.y, aci:n.aci,
      // v3: mekanik alanları (motor her adımda çarpanları sıfırlar, kanca ayarlar)
      hizCarpani:1, hedeflenebilir:true, hasarAlma:1, boyut:1, kaleHasari: b.bos ? D.boss.kaleHasar : 1,
      dogusCan: maxCan, ozel:{}
    });
    const yeniD = dusmanlar[dusmanlar.length-1];
    if (b.bos && !mekanikten) bossBant = {t: 0, ad: t.ad || "Boss"};
    if (!mekanikten && !b.bos) sonGuc = b.guc;
    mk("dusmanDogdu", yeniD, O);
    spawnKaydi.push(dalga + ":" + b.tip + (b.bos ? "B" : "") + ":" + b.rota + ":" + Math.round(maxCan));
    if (spawnKaydi.length > 4000) spawnKaydi.shift();
  }

  // ---------- Oyun kontrolü ----------
  function modulleriKur(){
    toplanabilirler = []; toplanabilirSayac = 6;
    yetenek = null; kahraman = null;
    const yb = document.getElementById("yetenekBtn");
    yb.style.display = "none"; yb.classList.remove("hedefleme");

    if (MOD.yetenek && MOD.yetenek.tip){
      yetenek = {kalan: 8, tip: MOD.yetenek.tip, hedefleme: false};
      yb.style.display = "block";
      if (MOD.yetenek.renk) yb.style.borderColor = MOD.yetenek.renk;
    }
    if (MOD.kahraman){
      const n = rotaNoktasi(anaRota(), anaRota().toplam * 0.7);
      kahraman = {x: n.x, y: n.y - 50, hedefX: n.x, hedefY: n.y - 50,
                  can: MOD.kahraman.canDeger || 120, maxCan: MOD.kahraman.canDeger || 120,
                  sayac: 0, secili: false, oluSayac: 0};
    }
  }

  function yetenekMetniGuncelle(){
    if (!yetenek) return;
    const yb = document.getElementById("yetenekBtn");
    const ad = (MOD.yetenek && MOD.yetenek.ad) || "Yetenek";
    if (yetenek.hedefleme){ yb.textContent = ad + " — hedef seç!"; yb.disabled = false; }
    else if (yetenek.kalan <= 0){ yb.textContent = "⚡ " + ad; yb.disabled = false; }
    else { yb.textContent = ad + " (" + Math.ceil(yetenek.kalan) + "s)"; yb.disabled = true; }
  }

  function yetenekUygula(p){
    // p: yildirim için hedef nokta, diğerleri için null
    const tip = yetenek.tip;
    if (tip === "yildirim"){
      let hedef = null, enYakin = 95;
      for (const d of dusmanlar){ const m = Math.hypot(d.x-p.x, d.y-p.y);
        if (m < enYakin){ enYakin = m; hedef = d; } }
      patlamaEkle(p.x, p.y, (MOD.yetenek.renk || "#fbbf24"), 26);
      ekranSarsinti = Math.min(1, ekranSarsinti + 0.5);
      if (hedef) vurus({alan: 95, hasar: 130, yavaslat: 0,
                        renk: (MOD.yetenek.renk || "#fbbf24"), x: p.x, y: p.y}, hedef);
    } else if (tip === "dondur"){
      for (const d of dusmanlar){ d.yavaslama = 0.15; d.yavaslamaSayac = 3; }
      uyariGoster((MOD.yetenek.ad || "Dondurma") + "!");
    } else if (tip === "altin"){
      altin += 80; yaziEkle(REF_W/2, REF_H/2, "+80", "#fbbf24");
    } else if (tip === "onarim"){
      can = Math.min(BASLANGIC_CAN, can + 4);
      uyariGoster("+4 Can!");
    }
    yetenek.kalan = YETENEK_SURE; yetenek.hedefleme = false;
    document.getElementById("yetenekBtn").classList.remove("hedefleme");
    hudGuncelle();
  }

  document.getElementById("yetenekBtn").addEventListener("click", (e)=>{
    e.stopPropagation();
    if (!yetenek || asama !== "oyunda" || yetenek.kalan > 0) return;
    if (yetenek.tip === "yildirim"){
      yetenek.hedefleme = !yetenek.hedefleme;
      document.getElementById("yetenekBtn").classList.toggle("hedefleme", yetenek.hedefleme);
      if (yetenek.hedefleme) uyariGoster("Haritada hedef seç!");
      yetenekMetniGuncelle();
    } else {
      yetenekUygula(null);
    }
  });

  function modulleriGuncelle(dt){
    // Toplanabilir: belirli aralıklarla haritada bonus nesne belirir
    if (MOD.toplanabilir){
      toplanabilirSayac -= dt;
      if (toplanabilirSayac <= 0 && toplanabilirler.length < 2){
        toplanabilirler.push({x: rastgele(100, REF_W-100), y: rastgele(120, REF_H-120),
                              omur: 6, yas: 0});
        toplanabilirSayac = rastgele(8, 14);
      }
      for (let i = toplanabilirler.length-1; i >= 0; i--){
        toplanabilirler[i].yas += dt;
        if (toplanabilirler[i].yas >= toplanabilirler[i].omur) toplanabilirler.splice(i, 1);
      }
    }
    // Yetenek: bekleme süresi
    if (yetenek && yetenek.kalan > 0){ yetenek.kalan -= dt; yetenekMetniGuncelle(); }
    // Kahraman: hareket + yakın dövüş + hasar alma + yeniden doğma
    if (kahraman){
      const kh = kahraman;
      if (kh.oluSayac > 0){
        kh.oluSayac -= dt;
        if (kh.oluSayac <= 0){ kh.can = kh.maxCan;
          const n = rotaNoktasi(anaRota(), anaRota().toplam * 0.7); kh.x = kh.hedefX = n.x; kh.y = kh.hedefY = n.y - 50; }
      } else {
        const dx = kh.hedefX - kh.x, dy = kh.hedefY - kh.y, uz = Math.hypot(dx, dy);
        if (uz > 4){ kh.x += dx/uz * 120 * dt; kh.y += dy/uz * 120 * dt; }
        kh.sayac -= dt;
        let hedef = null, enY = 60;
        for (const d of dusmanlar){ const m = mesafe(kh, d); if (m < enY){ enY = m; hedef = d; } }
        if (hedef && kh.sayac <= 0){
          kh.sayac = 0.8;
          vurus({alan: 0, hasar: (MOD.kahraman.hasar || 22), yavaslat: 0,
                 renk: (MOD.kahraman.renk || "#e5e7eb"), x: kh.x, y: kh.y}, hedef);
        }
        let tehdit = 0;
        for (const d of dusmanlar){ if (mesafe(kh, d) < 45) tehdit++; }
        if (tehdit > 0){
          kh.can -= tehdit * 8 * dt;
          if (kh.can <= 0){ kh.can = 0; kh.oluSayac = 8; kh.secili = false;
            patlamaEkle(kh.x, kh.y, "#e5e7eb", 14);
            uyariGoster(((MOD.kahraman.ad) || "Kahraman") + " düştü! (8s)"); }
        }
      }
    }
  }

  function varsayilanToplanabilirCiz(c, n, t){
    const nabiz = 1 + Math.sin(t*5 + n.x)*0.15;
    const solma = n.yas > n.omur-1.2 ? Math.max(0, (n.omur-n.yas)/1.2) : 1;
    c.save(); c.globalAlpha = solma; c.translate(n.x, n.y); c.scale(nabiz, nabiz);
    const renk = (MOD.toplanabilir && MOD.toplanabilir.renk) || "#fbbf24";
    c.shadowColor = renk; c.shadowBlur = 14;
    c.fillStyle = renk;
    c.beginPath();
    for (let i = 0; i < 5; i++){
      const a1 = -Math.PI/2 + i*1.2566, a2 = a1 + 0.6283;
      c.lineTo(Math.cos(a1)*12, Math.sin(a1)*12);
      c.lineTo(Math.cos(a2)*5.5, Math.sin(a2)*5.5);
    }
    c.closePath(); c.fill();
    c.shadowBlur = 0; c.strokeStyle = "rgba(0,0,0,.5)"; c.lineWidth = 1.5; c.stroke();
    c.restore();
  }

  function varsayilanKahramanCiz(c, kh, t){
    c.save(); c.translate(kh.x, kh.y);
    const renk = (MOD.kahraman && MOD.kahraman.renk) || "#e5e7eb";
    c.fillStyle = "rgba(0,0,0,.3)";
    c.beginPath(); c.ellipse(0, 16, 13, 5, 0, 0, 6.29); c.fill();
    const adim = Math.sin(t*8)*2;
    c.strokeStyle = "rgba(0,0,0,.6)"; c.lineWidth = 1.5;
    c.fillStyle = renk;
    c.fillRect(-6, -8 + adim*0.3, 12, 18); c.strokeRect(-6, -8 + adim*0.3, 12, 18);
    c.beginPath(); c.arc(0, -14 + adim*0.3, 7, 0, 6.29); c.fill(); c.stroke();
    const savur = kh.sayac > 0.55 ? -0.9 : 0.35;   // saldırı animasyonu
    c.save(); c.rotate(savur);
    c.fillStyle = "#94a3b8"; c.fillRect(8, -16, 4, 20); c.strokeRect(8, -16, 4, 20);
    c.restore();
    c.restore();
  }

  function modulleriCiz(c, t){
    for (const n of toplanabilirler){
      try { (T.toplanabilirCiz || varsayilanToplanabilirCiz)(c, n, t); }
      catch(e){ varsayilanToplanabilirCiz(c, n, t); }
    }
    if (kahraman && kahraman.oluSayac <= 0){
      const kh = kahraman;
      if (kh.secili){
        c.strokeStyle = "rgba(251,191,36,.8)"; c.lineWidth = 2;
        c.beginPath(); c.arc(kh.x, kh.y, 24, 0, 6.29); c.stroke();
      }
      try { (T.kahramanCiz || varsayilanKahramanCiz)(c, kh, t); }
      catch(e){ varsayilanKahramanCiz(c, kh, t); }
      if (kh.can < kh.maxCan){
        c.fillStyle = "rgba(0,0,0,.6)"; c.fillRect(kh.x-16, kh.y-30, 32, 4);
        c.fillStyle = "#22c55e";
        c.fillRect(kh.x-16, kh.y-30, 32*Math.max(0, kh.can/kh.maxCan), 4);
      }
    }
  }

  function sifirla(){
    can=BASLANGIC_CAN; altin=D.baslangicAltin; dalga=0; skor=0; combo=1; comboZaman=0;
    dusmanlar=[]; kuleler=[]; mermiler=[]; parcaciklar=[]; yaziEfektleri=[];
    spawnKuyrugu=[]; dalgaAktif=false; spawnSayac=0; spawnAralik=0.75;
    seciliKule=null; seciliKuleTipi=0; ekranSarsinti=0; donmaSuresi=0;
    araVerildi=false; araAktif=false; araKalan=0; gecis=null; bolumCanBasi=BASLANGIC_CAN;
    bossBant=null; fazNo=0; mkEkAltin=0; mkEkDusman=0; mkCanArti=0; sonGuc=1;
    for (const k of Object.keys(mkBellek)) delete mkBellek[k];
    sizinti.length = 0; olaylar.length = 0; spawnKaydi.length = 0;
    haritaKur(0);
    modulleriKur();          // MEKANİK MODÜLLERİ: kahraman/yetenek/toplanabilir kurulumu
    kulePaneliCiz();
    hudGuncelle();
  }

  // v2: harita paletini uygular, rota başına sızıntı sayacını hazırlar
  function haritaKur(i){
    haritaNo = i;
    Object.assign(P, HARITALAR[i].palet);
    // v3: eklenti çizimde `this.palet` kullanıyor; haritanın paleti eklentiye de yansısın
    if (T.palet && typeof T.palet === "object") T.palet = Object.assign({}, HARITALAR[i].palet);
    for (let r=0;r<HARITALAR[i].rotalar.length;r++) sizinti[r] = sizinti[r] || 0;
    kuleSpriteOnbellek.clear();
  }

  function yeniTohum(){
    if (URL_TOHUM !== null) return URL_TOHUM;
    return (Math.floor(Math.random()*4294967295) ^ (Date.now() & 0xffffffff)) >>> 0;
  }

  function oyunaGir(){
    asama="oyunda";
    document.getElementById("menuOverlay").classList.add("gizli");
    document.getElementById("sonOverlay").classList.add("gizli");
    document.getElementById("kuleMenu").classList.add("gizli");
  }

  function basla(){
    tohum = yeniTohum();
    sablonOnbellek.clear();
    sifirla();
    oyunaGir();
    araBaslat(D.ilkBekleme);
    olayEkle("baslat");
    mkRng = rngOlustur(tohumKaristir(tohum, 4999));
    mk("basla", O);
  }

  function bitir(kazandiMi){
    asama = kazandiMi ? "kazandi" : "kaybetti";
    araAktif = false;
    document.getElementById("sonBaslik").textContent = kazandiMi ? "Kazandın!" : "Kaybettin";
    document.getElementById("sonMetin").textContent =
      (kazandiMi ? "Üç haritayı da savundun. " : "Savunma çöktü. ") + "Skor: " + skor;
    if (kazandiMi) kayitSil();
    devamButonlariniGuncelle();
    document.getElementById("sonOverlay").classList.remove("gizli");
    document.getElementById("kuleMenu").classList.add("gizli");

  function uyariGoster(metin){
    const u = document.getElementById("uyari");
    u.textContent = metin;
    u.classList.add("gorunur");
    setTimeout(()=>u.classList.remove("gorunur"), 1400);
  }

  function olayEkle(tur, ek){
    olaylar.push(Object.assign({tur, dalga, zaman: Math.round(zaman*1000)/1000}, ek || {}));
    if (olaylar.length > 600) olaylar.shift();
  }

  /* ---------- v2: Dalga akışı (§4.1.1 düzeltmesi + §4.2 bölüm/harita) ----------
     v1 hatası: son düşman ölünce `dalgaAraSayac` zaten ≤0 olduğundan sonraki dalga aynı
     karede başlıyordu; DALGA_ARASI hiç uygulanmıyordu. v2'de dalga bitişi bir kez
     algılanır (araVerildi), ara açıkça kurulur ve yalnız sayaç bitince/çağırınca biter. */
  function araBaslat(sn){
    araAktif = true; araKalan = sn;
    olayEkle("araBasladi", {sure: sn});
  }

  function sonrakiDalga(){
    if (dalga >= TOPLAM_DALGA) return;
    araAktif = false; araVerildi = false;
    dalga++;
    const plan = dalgaPlani(dalga);
    if (((dalga-1) % D.dalgaPerBolum) === 0){           // bölüm başı
      bolumCanBasi = can;
      for (const k of kuleler) k.bolumHasar = 0;
    }
    // v3: mekanik sayaçları dalga başına; döngü fazı dalga başında değişir
    mkEkAltin = 0; mkEkDusman = 0; mkCanArti = 0;
    mkRng = rngOlustur(tohumKaristir(tohum, 5000 + dalga));
    const yeniFaz = fazHesapla(dalga);
    if (DONGU && yeniFaz !== fazNo){
      fazNo = yeniFaz; mkDurum.etki.faz++;
      setTimeout(()=>uyariGoster(DONGU.fazlar[fazNo].ad + "!"), 900);
      mk("fazDegisti", O);
    }
    spawnKuyrugu = plan.birimler.slice();
    spawnAralik = plan.aralik;
    dalgaAktif = true; spawnSayac = 0;
    uyariGoster((plan.sablon === "boss" ? "Boss dalgası " : "Dalga ") + dalga + " geliyor!");
    olayEkle("dalgaBasladi", {sablon: plan.sablon, faz: fazNo});
    mk("dalgaBasladi", O);
    hudGuncelle();
  }

  function dalgaBitti(){
    araVerildi = true;
    olayEkle("dalgaBitti");
    if (dalga >= TOPLAM_DALGA){ bitir(true); return; }
    if (dalga % D.dalgaPerBolum === 0){
      bolumSonu();
      if (dalga % DALGA_PER_HARITA === 0){             // harita sonu → geçiş
        gecis = {t: 0, hedef: Math.min(D.haritaSayisi-1, haritaNo+1), uygulandi: false};
        olayEkle("gecisBasladi", {hedef: gecis.hedef});
        return;                                         // ara, geçiş bitince kurulur
      }
      kayitYaz();
    }
    araBaslat(D.dalgaArasi);
  }

  // Bölüm sonu kartı: yıldız, kalan can, en iyi kule (kısa, dokunmayı engellemez)
  function bolumSonu(){
    const kayip = Math.max(0, bolumCanBasi - can) / BASLANGIC_CAN;
    const yildiz = kayip <= D.yildizEsik[0] ? 3 : (kayip <= D.yildizEsik[1] ? 2 : 1);
    let enIyi = null;
    for (const k of kuleler) if (!enIyi || k.bolumHasar > enIyi.bolumHasar) enIyi = k;
    const bolumNo = dalga / D.dalgaPerBolum;
    const kart = document.getElementById("bolumKart");
    kart.innerHTML = "";
    const b = document.createElement("div"); b.className = "kbaslik";
    b.textContent = "Bölüm " + bolumNo + " tamam";
    const y = document.createElement("div"); y.className = "kyildiz";
    y.textContent = "★".repeat(yildiz) + "☆".repeat(3 - yildiz);
    const m = document.createElement("div"); m.className = "kmetin";
    m.textContent = "Can " + Math.max(0,can) + "/" + BASLANGIC_CAN +
      (enIyi && enIyi.bolumHasar > 0 ? " · En iyi kule: " + enIyi.tip.ad + " (Sv." + enIyi.seviye + ")" : "");
    kart.appendChild(b); kart.appendChild(y); kart.appendChild(m);
    kart.classList.add("gorunur");
    clearTimeout(bolumSonu._z);
    bolumSonu._z = setTimeout(()=>kart.classList.remove("gorunur"), 3200);
    olayEkle("bolumSonu", {bolum: bolumNo, yildiz, enIyi: enIyi ? enIyi.tip.ad : null});
  }

  // Harita geçişi: perdenin ortasında uygulanır (§4.2)
  function haritaDegistir(hedef){
    const eski = HARITALAR[haritaNo], yeni = HARITALAR[hedef];
    const once = {kuleOnce: kuleler.length, canOnce: can, altinOnce: altin};
    let iade = 0;
    if (eski.imza !== yeni.imza){
      // Rota değişti: kuleler yatırımın %100'üyle iade edilip kaldırılır
      for (const k of kuleler) iade += Math.floor(k.yatirim * D.haritaGecisIade);
      kuleler = []; seciliKule = null;
      document.getElementById("kuleMenu").classList.add("gizli");
    }
    // Rota aynıysa (v1 eklentisi) kuleler yerinde kalır: kaldırmanın gerekçesi yok
    altin += iade;
    can = Math.min(BASLANGIC_CAN, can + D.haritaGecisCan);
    mermiler = [];
    haritaKur(hedef);
    if (kahraman){ const n = rotaNoktasi(anaRota(), anaRota().toplam*0.7);
      kahraman.x = kahraman.hedefX = n.x; kahraman.y = kahraman.hedefY = n.y - 50; }
    uyariGoster(yeni.ad + (iade ? " · Kuleler iade edildi: +" + iade + " altın" : ""));
    olayEkle("haritaDegisti", Object.assign({harita: hedef + 1, iade,
             kuleSonra: kuleler.length, canSonra: can, altinSonra: altin}, once));
    hudGuncelle();
  }

  /* ---------- v2: Kayıt noktası (§4.2) ----------
     Her bölüm sonunda localStorage'a yazılır. Belgedeki alanlara (bölüm, altın, can, skor,
     tohum) kuleler de eklendi: aynı harita içinde devam ederken kuleler olmadan kayıt
     anlamsız kalıyordu. Depolama kapalıysa (gizli sekme, iframe kısıtı) sessizce atlanır. */
  const KAYIT_ANAHTARI = "savunma_v3:" + String(T.ad || document.title || "oyun")
    .toLowerCase().replace(/[^a-z0-9ğüşıöç]+/g, "-").slice(0, 60);
  function kayitYaz(){
    const veri = {v:2, tohum, zorluk, dalga, altin, can, skor, harita: haritaNo,
      kuleler: kuleler.map(k => ({t: KULE_TIPLERI.indexOf(k.tip), x: Math.round(k.x),
                                  y: Math.round(k.y), s: k.seviye, yt: k.yatirim}))};
    try { localStorage.setItem(KAYIT_ANAHTARI, JSON.stringify(veri)); olayEkle("kayit"); }
    catch(e){ olayEkle("kayitYok"); }
    devamButonlariniGuncelle();
  }
  function kayitOku(){
    try {
      const v = JSON.parse(localStorage.getItem(KAYIT_ANAHTARI) || "null");
      return (v && v.v === 2 && v.dalga > 0 && v.dalga < TOPLAM_DALGA) ? v : null;
    } catch(e){ return null; }
  }
  function kayitSil(){ try { localStorage.removeItem(KAYIT_ANAHTARI); } catch(e){} }
  function devamButonlariniGuncelle(){
    const k = kayitOku();
    const metin = k ? "Devam et · Bölüm " + (k.dalga / D.dalgaPerBolum + 1) : "";
    for (const id of ["devamBtn", "sonDevamBtn"]){
      const b = document.getElementById(id);
      b.style.display = k ? "inline-block" : "none";
      b.textContent = metin;
    }
  }
  function devamEt(){
    const k = kayitOku();
    if (!k) { basla(); return; }
    tohum = k.tohum >>> 0; zorluk = D.zorluk[k.zorluk] ? k.zorluk : "normal";
    zorlukDugmeleriniGuncelle();
    sablonOnbellek.clear();
    sifirla();
    haritaKur(Math.max(0, Math.min(D.haritaSayisi-1, k.harita|0)));
    dalga = k.dalga; altin = k.altin; can = k.can; skor = k.skor; bolumCanBasi = can;
    for (const s of (k.kuleler || [])){
      const tip = KULE_TIPLERI[s.t]; if (!tip) continue;
      const kule = kuleOlustur(s.x, s.y, tip);
      for (let i=1;i<s.s && i<D.maxSeviye;i++) kuleSeviyeArtir(kule);
      kule.yatirim = s.yt || kule.yatirim;
      kuleler.push(kule);
    }
    araVerildi = true;
    fazNo = fazHesapla(dalga);
    oyunaGir();
    araBaslat(D.dalgaArasi);
    olayEkle("devam", {kayitDalga: k.dalga});
    mkRng = rngOlustur(tohumKaristir(tohum, 4999));
    mk("basla", O);
    uyariGoster("Bölüm " + (k.dalga / D.dalgaPerBolum + 1) + " · Kayıttan devam");
    hudGuncelle();
  }

  // ---------- HUD ----------
  function hudGuncelle(){
    document.getElementById("hudCan").textContent = Math.max(0, can);
    document.getElementById("hudAltin").textContent = altin;
    document.getElementById("hudDalga").textContent = dalga;
    document.getElementById("hudToplamDalga").textContent = TOPLAM_DALGA;
    document.getElementById("hudSkor").textContent = skor;
    document.getElementById("hudBolum").textContent = Math.max(1, Math.ceil(dalga / D.dalgaPerBolum));
    document.getElementById("hudToplamBolum").textContent = TOPLAM_BOLUM;
    document.getElementById("hudHarita").textContent = harita().ad;
    if (MK){
      const r = document.getElementById("hudMekanik");
      let metin = mkDurum.ad || "Mekanik";
      if (DONGU){
        const kalan = DONGU.her - ((Math.max(1, dalga) - 1) % DONGU.her);
        metin = DONGU.fazlar[fazNo].ad + (DONGU.fazlar.length > 1 ?
          " · " + kalan + " dalga sonra " + DONGU.fazlar[(fazNo+1) % DONGU.fazlar.length].ad : "");
      }
      if (r.textContent !== metin) r.textContent = metin;
      if (r.style.display !== "block") r.style.display = "block";
    }
    // JUICE: can azaldıkça kırmızı vinyet belirginleşir (renk dili / durum uyarısı)
    const oran = can / BASLANGIC_CAN;
    document.getElementById("vinyet").style.opacity =
      oran < 0.35 ? String((1 - oran/0.35) * 0.85) : "0";
    const c = document.getElementById("hudCombo");
    if (combo > 1){ c.style.display="block";
      document.getElementById("hudComboSayi").textContent = combo; }
    else c.style.display="none";
    Array.from(document.querySelectorAll(".kule-btn")).forEach((b,i)=>{
      b.disabled = altin < KULE_TIPLERI[i].fiyat;
      b.classList.toggle("secili", i===seciliKuleTipi);
    });
  }

  // v2: "Dalgayı çağır" düğmesi — yalnız değer değişince DOM'a yazılır
  let cagirSonMetin = "";
  function cagirDugmesiGuncelle(){
    const b = document.getElementById("dalgaCagirBtn");
    const gorunur = asama === "oyunda" && araAktif && !gecis && dalga < TOPLAM_DALGA;
    const stil = gorunur ? "block" : "none";
    if (b.style.display !== stil) b.style.display = stil;
    if (!gorunur) return;
    const bonus = Math.floor(araKalan) * D.erkenCagirmaAltin;
    const metin = "Dalgayı çağır" + (bonus > 0 ? " (+" + bonus + " altın)" : "");
    if (metin !== cagirSonMetin){ cagirSonMetin = metin; b.textContent = metin; }
  }
  function dalgayiCagir(){
    if (asama !== "oyunda" || !araAktif || gecis) return false;
    const bonus = Math.floor(araKalan) * D.erkenCagirmaAltin;
    if (bonus > 0){ altin += bonus; yaziEkle(REF_W/2, 120, "+" + bonus + " altın", "#fbbf24"); }
    olayEkle("erkenCagri", {bonus});
    sonrakiDalga();
    cagirDugmesiGuncelle();
    return true;
  }
  document.getElementById("dalgaCagirBtn").addEventListener("click", (e)=>{
    e.stopPropagation(); dalgayiCagir();
  });
  document.getElementById("hizBtn").addEventListener("click", (e)=>{
    e.stopPropagation();
    hizCarpani = hizCarpani === 1 ? 2 : 1;
    e.currentTarget.textContent = hizCarpani + "×";
    e.currentTarget.classList.toggle("aktif", hizCarpani > 1);
  });
  function zorlukDugmeleriniGuncelle(){
    document.querySelectorAll("#zorlukSecim button").forEach(b =>
      b.classList.toggle("secili", b.dataset.z === zorluk));
  }
  document.querySelectorAll("#zorlukSecim button").forEach(b => b.addEventListener("click", (e)=>{
    e.stopPropagation(); zorluk = b.dataset.z; zorlukDugmeleriniGuncelle();
  }));

  function kulePaneliCiz(){
    const panel = document.getElementById("kulePanel");
    panel.innerHTML = "";
    KULE_TIPLERI.forEach((k,i)=>{
      const b = document.createElement("button");
      b.className = "kule-btn" + (i===0 ? " secili" : "");
      b.innerHTML = k.ad + "<br><span style='opacity:.7'>" + k.fiyat + " altın</span>";
      b.addEventListener("click", (e)=>{ e.stopPropagation(); seciliKuleTipi=i; hudGuncelle(); });
      panel.appendChild(b);
    });
  }

  // ---------- Etkileşim ----------
  function haritayaDokun(e){
    if (asama !== "oyunda") return;
    e.preventDefault();
    const p = olayNoktasi(e);

    // MODÜL 1: Yetenek hedefleme aktifse tıklanan noktaya yeteneği kullan
    if (yetenek && yetenek.hedefleme && yetenek.kalan <= 0){
      yetenekUygula(p);
      return;
    }
    // MODÜL 2: Yerde duran toplanabilir varsa önce onu topla
    for (let i = toplanabilirler.length-1; i >= 0; i--){
      const n = toplanabilirler[i];
      if (mesafe(p, n) < 26){
        toplanabilirler.splice(i, 1);
        const kazanc = n.deger || 25;
        altin += kazanc;
        yaziEkle(n.x, n.y, "+" + kazanc, (MOD.toplanabilir && MOD.toplanabilir.renk) || "#fbbf24");
        patlamaEkle(n.x, n.y, (MOD.toplanabilir && MOD.toplanabilir.renk) || "#fbbf24", 10);
        hudGuncelle();
        return;
      }
    }
    // MODÜL 3: Kahraman seçili ise tıklanan yere gönder; kahramana tıklamak seçer
    if (kahraman && kahraman.oluSayac <= 0){
      if (mesafe(p, kahraman) < 26){
        kahraman.secili = !kahraman.secili;
        uyariGoster(kahraman.secili ? "Hedef nokta seç!" : "Kahraman serbest");
        return;
      }
      if (kahraman.secili){
        kahraman.hedefX = p.x; kahraman.hedefY = p.y;
        kahraman.secili = false;
        return;
      }
    }

    // Kurulu kuleye dokunulduysa menü aç
    for (const k of kuleler){
      if (mesafe(p,k) < 26){ seciliKule = k; kuleMenusuAc(); return; }
    }
    // Yeni kule kur
    const tip = KULE_TIPLERI[seciliKuleTipi];
    if (altin < tip.fiyat){ uyariGoster("Yetersiz altın!"); return; }
    if (yolaYakinMi(p, 34)){ uyariGoster("Yola kule kurulamaz!"); return; }
    for (const k of kuleler){ if (mesafe(p,k) < 40){ uyariGoster("Çok yakın!"); return; } }
    if (p.x<10||p.y<10||p.x>REF_W-10||p.y>REF_H-10) return;

    const yeniK = kuleOlustur(p.x, p.y, tip);
    kuleler.push(yeniK);
    altin -= tip.fiyat;
    mk("kuleKuruldu", yeniK, O);
    hudGuncelle();
  }
  canvas.addEventListener("click", haritayaDokun);
  canvas.addEventListener("touchstart", haritayaDokun, {passive:false});

  // v2: kule oluşturma/yükseltme tek yerde (kayıttan yükleme ve test aynı kodu kullanır)
  function kuleOlustur(x, y, tip){
    return {x, y, tip, ad: tip.ad, tipIndeks: KULE_TIPLERI.indexOf(tip), seviye:1, sayac:0,
            aci:-Math.PI/2, menzil:tip.menzil, hasar:tip.hasar,
            yatirim:tip.fiyat, flas:0, bolumHasar:0, toplamHasar:0,
            dogus:0, parlama:0,                                   // v3: kurulum pop / yükseltme halkası
            hasarCarpani:1, atisCarpani:1, menzilCarpani:1, aktif:true, ozel:{}};
  }
  function kuleSeviyeArtir(k){
    k.seviye++; k.hasar *= D.yukseltmeHasar; k.menzil *= D.yukseltmeMenzil; k.parlama = 0.6;
  }

  function kuleMenusuAc(){
    if (!seciliKule) return;
    const k = seciliKule;
    document.getElementById("kmBaslik").textContent = k.tip.ad + " (Sv." + k.seviye + ")";
    document.getElementById("kmBilgi").textContent =

      " | Yükseltme: " + yukseltmeFiyati(k) + " altın | Satış: " + Math.floor(k.yatirim*D.satisOrani) + " altın";
    document.getElementById("kmYukselt").disabled = (k.seviye>=D.maxSeviye || altin<yukseltmeFiyati(k));
    document.getElementById("kuleMenu").classList.remove("gizli");
  }
  function yukseltmeFiyati(k){ return Math.round(k.tip.fiyat * D.yukseltmeFiyat * k.seviye); }

  document.getElementById("kmYukselt").addEventListener("click", ()=>{

  document.getElementById("baslaBtn").addEventListener("click", basla);
