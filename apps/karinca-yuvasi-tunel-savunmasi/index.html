<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Karınca yuvası tünel savunması</title>
<style>
  html,body{margin:0;padding:0;overflow:hidden;background:#0b0f19;font-family:system-ui,sans-serif;}
  #sahne{position:relative;width:100vw;height:100vh;}
  canvas{display:block;width:100%;height:100%;touch-action:none;}
  .overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
           background:rgba(5,8,15,.82);z-index:20;}
  .overlay.gizli{display:none;pointer-events:none;}
  .panel{background:rgba(17,24,39,.95);border:1px solid rgba(255,255,255,.12);
         border-radius:16px;padding:28px 32px;max-width:520px;text-align:center;color:#e5e7eb;}
  .btn{background:#2563eb;color:#fff;border:none;border-radius:10px;padding:12px 26px;
       font-size:16px;font-weight:600;cursor:pointer;margin-top:14px;}
  .btn:hover{background:#1d4ed8;}
  .btn.ikincil{background:#374151;}
  #hud{position:absolute;top:0;left:0;right:0;z-index:10;display:flex;gap:14px;flex-wrap:wrap;
       padding:10px 14px;background:linear-gradient(180deg,rgba(5,8,15,.85),rgba(5,8,15,0));
       color:#e5e7eb;font-size:14px;font-weight:600;pointer-events:none;}
  #hud .kutu{background:rgba(17,24,39,.7);border:1px solid rgba(255,255,255,.1);
             border-radius:10px;padding:6px 12px;}
  #kulePanel{position:absolute;bottom:0;left:0;right:0;z-index:10;display:flex;gap:8px;
             justify-content:center;flex-wrap:wrap;padding:10px;
             background:linear-gradient(0deg,rgba(5,8,15,.9),rgba(5,8,15,0));}
  .kule-btn{background:rgba(17,24,39,.92);border:2px solid rgba(255,255,255,.15);color:#e5e7eb;
            border-radius:12px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;
            min-width:96px;}
  .kule-btn.secili{border-color:#38bdf8;box-shadow:0 0 0 2px rgba(56,189,248,.35);}
  .kule-btn:disabled{opacity:.45;cursor:not-allowed;}
  #uyari{position:absolute;top:44%;left:0;right:0;z-index:12;text-align:center;color:#fbbf24;
         font-size:26px;font-weight:800;text-shadow:0 2px 10px rgba(0,0,0,.8);
         opacity:0;transition:opacity .3s;pointer-events:none;}
  #uyari.gorunur{opacity:1;}
  #vinyet{position:absolute;inset:0;z-index:9;pointer-events:none;opacity:0;
          transition:opacity .4s;
          background:radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(220,38,38,.55) 100%);}
  .text-3xl{font-size:30px;} .text-2xl{font-size:24px;} .text-sm{font-size:13px;}
  .font-bold{font-weight:700;} .mb-3{margin-bottom:12px;} .mb-2{margin-bottom:8px;}
  .text-slate-300{color:#cbd5e1;} .text-slate-400{color:#94a3b8;}
</style>
</head>
<body>
<div id="sahne">
  <canvas id="oyunCanvas"></canvas>

  <div id="hud">
    <div class="kutu">Can: <span id="hudCan">20</span></div>
    <div class="kutu">Altın: <span id="hudAltin">0</span></div>
    <div class="kutu">Dalga: <span id="hudDalga">0</span>/<span id="hudToplamDalga">10</span></div>
    <div class="kutu">Skor: <span id="hudSkor">0</span></div>
    <div class="kutu" id="hudCombo" style="display:none">Combo x<span id="hudComboSayi">1</span></div>
  </div>

  <div id="uyari"></div>
  <div id="vinyet"></div>

  <div id="kulePanel"></div>

  <div id="menuOverlay" class="overlay">
    <div class="panel">
      <h1 id="menuBaslik" class="text-3xl font-bold mb-3">Karınca yuvası tünel savunması</h1>
      <p id="menuAciklama" class="text-slate-300 mb-2"></p>
      <p class="text-slate-400 text-sm">Kule seçmek için alttaki panele, yerleştirmek için haritaya dokun.
         Kurulu kuleye dokunarak yükselt veya sat.</p>
      <button id="baslaBtn" class="btn">Oyunu Başlat</button>
    </div>
  </div>

  <div id="sonOverlay" class="overlay gizli">
    <div class="panel">
      <h2 id="sonBaslik" class="text-3xl font-bold mb-2">Oyun Bitti</h2>
      <p id="sonMetin" class="text-slate-300"></p>
      <button id="yenidenBtn" class="btn">Yeniden Başlat</button>
    </div>
  </div>

  <div id="kuleMenu" class="overlay gizli">
    <div class="panel">
      <h3 id="kmBaslik" class="text-2xl font-bold mb-2">Kule</h3>
      <p id="kmBilgi" class="text-slate-300 mb-2"></p>
      <button id="kmYukselt" class="btn">Yükselt</button>
      <button id="kmSat" class="btn ikincil">Sat</button>
      <button id="kmKapat" class="btn ikincil">Kapat</button>
    </div>
  </div>
</div>

<script>
/* ============================================================
   TEMA EKLENTİSİ (Gemini tarafından üretilir)
   ============================================================ */
const TEMA = {
  ad: "Karınca Yuvası Savunması",
  aciklama: "Derinlerdeki karınca kolonini, tünellerden inen böcek istilacılara karşı savun.",
  palet: {
    arka1: "#3a2a1a", // Koyu toprak kahverengisi (arka planın en koyu kısmı)
    arka2: "#4e3b2c", // Orta toprak kahverengisi (arka planın açık kısmı)
    yol: "#6b4d36", // Tünel yolu, kırmızımsı kahverengi
    yolKenar: "#2c1f13", // Tünel kenarı, çok koyu kahverengi
    dusman: "#5b0f0f", // Koyu kırmızı böcek
    dusman2: "#2d2d2d", // Koyu gri örümcek
    kule: "#4a7e4a", // Bitki temalı kule için yeşil
    mermi: "#ccff33", // Parlak misket limonu yeşili (zehir/spor)
    vurgu: "#ffd700" // Vurgu ve UI öğeleri için altın sarısı
  },
  yol: [
    {x: 640, y: -20},    // Haritanın üstünden, ortadan giriş
    {x: 640, y: 150},    // Düz aşağı
    {x: 400, y: 280},    // Çapraz sol-aşağı
    {x: 880, y: 350},    // Çapraz sağ-aşağı (geniş zikzak)
    {x: 400, y: 450},    // Çapraz sol-aşağı
    {x: 640, y: 600},    // Çapraz sağ-aşağı (merkeze yaklaşır)
    {x: 640, y: 740}     // Haritanın altından, ortadan çıkış
  ],
  dusmanTipleri: [
    {ad:"Küçük Böcek", can:60, hiz:62, altin:12, yaricap:14, renk:"#5b0f0f"},
    {ad:"Hızlı Örümcek", can:42, hiz:96, altin:14, yaricap:12, renk:"#2d2d2d"},
    {ad:"Zırhlı Kurbağa", can:155, hiz:44, altin:23, yaricap:18, renk:"#0a4a0a"}
  ],
  kuleTipleri: [
    {ad:"Bitki Dikeni", fiyat:50, menzil:150, hasar:18, atisHizi:1.2, mermiHizi:360, renk:"#4a7e4a"},
    {ad:"Yapışkan Salgı", fiyat:90, menzil:125, hasar:44, atisHizi:0.55, mermiHizi:270, renk:"#8a5e3a", alan:48},
    {ad:"Kaya Mancınığı", fiyat:70, menzil:135, hasar:8, atisHizi:0.9, mermiHizi:330, renk:"#6a6a6a", yavaslat:0.5}
  ],

  arkaplanCiz(c, W, H, t) {
    c.save();

    // Katman 1: Ana Zemin Gradienti - Yüzeyden derin yeraltına geçiş
    let gradBg = c.createLinearGradient(0, 0, 0, H);
    gradBg.addColorStop(0, this.palet.arka2); // Yüzeye yakın açık kahverengi
    gradBg.addColorStop(0.3, this.palet.arka1); // Orta toprak rengi
    gradBg.addColorStop(0.7, "#2a1e14"); // En derin toprak rengi, daha koyu
    gradBg.addColorStop(1, "#1a120e"); // En alt için daha da koyu
    c.fillStyle = gradBg;
    c.fillRect(0, 0, W, H);

    // Yeni Katman: Uzak Gökkuşağı/Yüzey Işığı (çok hafif ve yukarıda)
    let radialLight = c.createRadialGradient(W / 2, 0, 0, W / 2, 0, W * 0.5);
    radialLight.addColorStop(0, "rgba(255, 200, 100, 0.05)"); // Çok hafif sarımsı ışık
    radialLight.addColorStop(1, "rgba(255, 200, 100, 0)");
    c.fillStyle = radialLight;
    c.fillRect(0, 0, W, H * 0.3); // Sadece üst kısma uygula

    // Katman 2: En uzak silüet - Uzak kökler/kaya oluşumları
    // Renkleri paletten veya onlara yakın seçerek daha bütüncül bir görüntü.
    c.fillStyle = "rgba(40, 25, 15, 0.3)"; // Koyu toprak tonu, daha opak
    c.beginPath();
    c.moveTo(0, H * 0.6 + Math.sin(t * 0.1) * 10);
    c.quadraticCurveTo(W * 0.2, H * 0.5 + Math.cos(t * 0.08) * 15, W * 0.5, H * 0.7 + Math.sin(t * 0.12) * 10);
    c.quadraticCurveTo(W * 0.8, H * 0.8 + Math.cos(t * 0.09) * 12, W, H * 0.7 + Math.sin(t * 0.11) * 8);
    c.lineTo(W, H);
    c.lineTo(0, H);
    c.closePath();
    c.fill();
    
    c.fillStyle = "rgba(40, 25, 15, 0.2)";
    c.beginPath();
    c.arc(W * 0.15, H * 0.9, 60 + Math.sin(t * 0.2) * 5, 0, Math.PI * 2);
    c.arc(W * 0.85, H * 0.8, 70 + Math.cos(t * 0.15) * 6, 0, Math.PI * 2);
    c.fill();

    // Katman 3: Orta mesafe dekor - Yeraltı mantarları, kristaller, kökler
    c.globalAlpha = 0.3; 
    
    // Bioluminescent Mantar Kümesi 1
    const fungusColor1 = "#7e9f7e"; // Yeşile çalan mantar rengi
    const fungusGlow1 = c.createRadialGradient(W * 0.18, H * 0.65, 5, W * 0.18, H * 0.65, 40);
    fungusGlow1.addColorStop(0, "rgba(180, 255, 180, 0.6)");
    fungusGlow1.addColorStop(1, "rgba(180, 255, 180, 0)");
    c.fillStyle = fungusColor1;
    c.shadowColor = "rgba(180, 255, 180, 0.8)";
    c.shadowBlur = 15;
    c.beginPath(); // Mantar şapka
    c.ellipse(W * 0.18, H * 0.65, 30 + Math.sin(t * 0.3) * 3, 20 + Math.cos(t * 0.2) * 2, 0, 0, Math.PI * 2); c.fill();
    c.fillRect(W * 0.18 - 5, H * 0.65, 10, 30); // Sap
    c.shadowBlur = 0;
    c.fillStyle = fungusGlow1;
    c.fill(); // Glow

    // Kristal oluşumu
    const crystalColor1 = "#a0d0e0"; // Maviye çalan kristal
    const crystalGlow1 = c.createRadialGradient(W * 0.7, H * 0.5, 5, W * 0.7, H * 0.5, 30);
    crystalGlow1.addColorStop(0, "rgba(150, 200, 255, 0.5)");
    crystalGlow1.addColorStop(1, "rgba(150, 200, 255, 0)");
    c.fillStyle = crystalColor1;
    c.shadowColor = "rgba(150, 200, 255, 0.7)";
    c.shadowBlur = 12;
    c.beginPath();
    c.moveTo(W * 0.7, H * 0.5);
    c.lineTo(W * 0.75, H * 0.45);
    c.lineTo(W * 0.72, H * 0.4);
    c.lineTo(W * 0.68, H * 0.42);
    c.closePath();
    c.fill();
    c.shadowBlur = 0;
    c.fillStyle = crystalGlow1;
    c.fill();

    // Kalınlaşan kökler/damarlar (daha belirgin)
    c.strokeStyle = "rgba(80, 50, 20, 0.4)"; // Koyu kahve tonu
    c.lineWidth = 4 + Math.sin(t * 0.4) * 1;
    c.lineCap = "round";
    c.lineJoin = "round";
    for (let i = 0; i < 3; i++) {
        c.beginPath();
        c.moveTo(W * (0.3 + i * 0.2), H * 0.3 + Math.sin(t * 0.2 + i) * 15);
        c.bezierCurveTo(W * (0.35 + i * 0.2), H * 0.4 + Math.cos(t * 0.15 + i) * 10,
                         W * (0.28 + i * 0.2), H * 0.5 + Math.sin(t * 0.25 + i) * 12,
                         W * (0.32 + i * 0.2), H * 0.6 + Math.cos(t * 0.18 + i) * 8);
        c.stroke();
    }
    
    c.globalAlpha = 1;

    // Katman 4: Yakın zemin dokusu - Toprak deseni (daha organik)
    c.fillStyle = "rgba(100, 70, 40, 0.06)"; // Açık kahverengi, çok hafif
    for (let i = 0; i < 50; i++) { // Daha az, daha büyük parçalar
      const size = 3 + Math.random() * 5;
      c.fillRect(Math.random() * W, H * 0.6 + Math.random() * H * 0.4, size, size * (0.8 + Math.sin(t * 0.1 + i) * 0.2));
    }
    c.fillStyle = "rgba(50, 30, 10, 0.1)"; // Koyu kahverengi, daha hafif
    for (let i = 0; i < 40; i++) {
      const size = 2 + Math.random() * 4;
      c.fillRect(Math.random() * W, H * 0.7 + Math.random() * H * 0.3, size, size * (0.9 + Math.cos(t * 0.15 + i) * 0.1));
    }

    // Katman 5: Hareketli/animasyonlu öğe - Parlayan sporlar/toz tanecikleri
    c.fillStyle = "rgba(255, 255, 100, 0.4)"; 
    c.shadowBlur = 10 + Math.sin(t * 2) * 3; // hafif parıltı animasyonu
    c.shadowColor = "rgba(255, 255, 100, 0.8)";
    for (let i = 0; i < 20; i++) { // Biraz daha fazla parçacık
      const x = (i * 73 + t * 25 + Math.sin(t * (i + 5) * 0.3) * 50) % W;
      const y = (i * 97 + t * 50 + Math.cos(t * (i + 3) * 0.2) * 50) % (H + 50) - 50; 
      c.beginPath();
      c.arc(x, y, 2 + Math.sin(t * (i + 1) * 0.5) * 1.5, 0, Math.PI * 2); // Boyut animasyonu daha belirgin
      c.fill();
    }
    c.shadowBlur = 0; 

    // Tema varlığı: Yolun bittiği alanda karınca kolonisinin çekirdeği (savunulan yapı)
    const coreX = W / 2;
    const coreY = H - 50;
    const coreRadius = 70;

    // Çekirdek için gradient ve daha detaylı çizim
    let coreGrad = c.createLinearGradient(coreX, coreY - coreRadius, coreX, coreY + coreRadius);
    coreGrad.addColorStop(0, "#a05a2d"); // Üst kısım açık
    coreGrad.addColorStop(0.5, "#8b4513"); // Orta kısım ana renk
    coreGrad.addColorStop(1, "#6a3a10"); // Alt kısım koyu
    c.fillStyle = coreGrad;
    c.strokeStyle = "#4a2a1a"; 
    c.lineWidth = 4;
    c.shadowColor = "rgba(0,0,0,0.6)";
    c.shadowBlur = 15;

    c.beginPath();
    c.arc(coreX, coreY, coreRadius, Math.PI, 0, true); 
    c.quadraticCurveTo(coreX + coreRadius + 40, coreY - 25, coreX + coreRadius, coreY - 70); 
    c.quadraticCurveTo(coreX, coreY - coreRadius - 40, coreX - coreRadius, coreY - 70); 
    c.quadraticCurveTo(coreX - coreRadius - 40, coreY - 25, coreX - coreRadius, coreY); 
    c.closePath();
    c.fill();
    c.stroke();
    
    // Çekirdek üzerine iç doku/ışıklandırma
    let innerGlow = c.createRadialGradient(coreX, coreY - 30, 10, coreX, coreY - 30, 60);
    innerGlow.addColorStop(0, "rgba(255, 200, 100, " + (0.3 + Math.sin(t*0.5)*0.1) + ")");
    innerGlow.addColorStop(1, "rgba(255, 200, 100, 0)");
    c.fillStyle = innerGlow;
    c.beginPath();
    c.arc(coreX, coreY - 30, coreRadius * 0.8, 0, Math.PI * 2);
    c.fill();

    // Çekirdeğe giriş
    c.fillStyle = "#2c1f13"; 
    c.beginPath();
    c.ellipse(coreX, coreY + 10, 30, 20, 0, 0, Math.PI * 2);
    c.fill();

    // Karınca kolonisi detayları (iç yapıyı gösteren parlak noktalar)
    c.fillStyle = "rgba(255, 255, 255, 0.3)"; 
    c.beginPath();
    c.arc(coreX - 25 + Math.sin(t * 0.7) * 5, coreY - 20 + Math.cos(t * 0.8) * 4, 10 + Math.sin(t * 0.9) * 2, 0, Math.PI * 2);
    c.arc(coreX + 30 + Math.cos(t * 0.6) * 5, coreY - 30 + Math.sin(t * 0.7) * 4, 8 + Math.cos(t * 1.0) * 1.5, 0, Math.PI * 2);
    c.arc(coreX + Math.sin(t * 0.8) * 3, coreY - 50 + Math.cos(t * 0.9) * 3, 12 + Math.sin(t * 1.1) * 2.5, 0, Math.PI * 2);
    c.fill();

    c.shadowBlur = 0; 
    c.restore();
  },

  yolCiz(c, yol, t) {
    c.save();
    c.lineJoin = "round";
    c.lineCap = "round";

    // Yolun ana gövdesine derinlik katmak için gradient
    c.lineWidth = 80;
    // W ve H tanımlı değil, ancak burası çizim fonksiyonu olduğundan global W, H kullanılabilir veya parametre olarak eklenebilir.
    // Varsayılan olarak canvas boyutunu kullanıyorum. Ancak test ortamında W, H parametre olarak zaten aktarılıyor.
    // pathGrad'in x,y değerleri dinamik olarak yolun başlangıç ve bitişine göre ayarlanabilir.
    // Basit bir örnek için, başlangıç ve bitiş noktalarını kullanıyorum.
    const startPoint = yol[0];
    const endPoint = yol[yol.length - 1];
    let pathGrad = c.createLinearGradient(startPoint.x, startPoint.y, endPoint.x, endPoint.y); 
    pathGrad.addColorStop(0, this.palet.yol);
    pathGrad.addColorStop(0.5, "#805c43"); // Hafif daha açık ve sıcak ton
    pathGrad.addColorStop(1, this.palet.yol);
    c.strokeStyle = pathGrad;
    c.beginPath();
    c.moveTo(yol[0].x, yol[0].y);
    for (let i = 1; i < yol.length; i++) {
      c.lineTo(yol[i].x, yol[i].y);
    }
    c.stroke();

    // Yol kenarlarını daha katmanlı çiz (tünel duvarı etkisi)
    c.lineWidth = 100; // Geniş dış kenar
    c.strokeStyle = this.palet.yolKenar;
    c.beginPath();
    c.moveTo(yol[0].x, yol[0].y);
    for (let i = 1; i < yol.length; i++) {
      c.lineTo(yol[i].x, yol[i].y);
    }
    c.stroke();
    
    c.lineWidth = 90; // İç kenar için biraz daha açık renk
    c.strokeStyle = "rgba(44, 31, 19, 0.8)"; // yolKenar'ın hafif şeffafı
    c.beginPath();
    c.moveTo(yol[0].x, yol[0].y);
    for (let i = 1; i < yol.length; i++) {
      c.lineTo(yol[i].x, yol[i].y);
    }
    c.stroke();

    // Yol yüzeyine çatlaklar ve taş dokusu
    c.lineWidth = 2;
    c.strokeStyle = "rgba(0,0,0,0.3)";
    c.setLineDash([5, 15]); // Daha kısa aralıklı çatlak deseni
    for (let i = 0; i < yol.length - 1; i++) {
      const p1 = yol[i];
      const p2 = yol[i + 1];
      const angle = Math.atan2(p2.y - p1.y, p2.x - p1.x);
      const perpAngle1 = angle + Math.PI / 2;
      const perpAngle2 = angle - Math.PI / 2;

      // Yolun ortasından geçen rastgele çatlaklar
      for (let j = 0; j < 2; j++) {
        c.beginPath();
        const offset = (Math.sin(t * 0.3 + i * 1.2 + j) * 20);
        c.moveTo(p1.x + Math.cos(perpAngle1) * offset * 0.5, p1.y + Math.sin(perpAngle1) * offset * 0.5);
        c.lineTo(p2.x + Math.cos(perpAngle2) * offset * 0.5, p2.y + Math.sin(perpAngle2) * offset * 0.5);
        c.stroke();
      }
    }
    c.setLineDash([]); 

    // Yol kenarlarına kökler/mantarlar ekle (animasyonlu)
    for (let i = 0; i < yol.length; i++) {
      const p = yol[i];
      const angle = (i < yol.length - 1) ? Math.atan2(yol[i+1].y - p.y, yol[i+1].x - p.x) : Math.atan2(p.y - yol[i-1].y, p.x - yol[i-1].x);
      const perpAngle = angle + Math.PI / 2;
      
      // Sağ kenardaki kökler
      c.strokeStyle = "rgba(80, 50, 20, 0.6)";
      c.lineWidth = 3 + Math.sin(t * 0.5 + i * 2) * 1;
      c.beginPath();
      c.moveTo(p.x + Math.cos(perpAngle) * 40, p.y + Math.sin(perpAngle) * 40);
      c.bezierCurveTo(
        p.x + Math.cos(perpAngle) * 50 + Math.sin(t * 0.8 + i) * 5, p.y + Math.sin(perpAngle) * 50 + Math.cos(t * 0.7 + i) * 5,
        p.x + Math.cos(perpAngle) * 60 + Math.cos(t * 0.9 + i) * 7, p.y + Math.sin(perpAngle) * 60 + Math.sin(t * 1.0 + i) * 7,
        p.x + Math.cos(perpAngle) * 70 + Math.sin(t * 0.6 + i) * 8, p.y + Math.sin(perpAngle) * 70 + Math.cos(t * 0.5 + i) * 8
      );
      c.stroke();

      // Sol kenardaki parlayan mantarlar
      c.shadowColor = "rgba(100, 255, 100, " + (0.7 + Math.sin(t * 1.5 + i) * 0.3) + ")";
      c.shadowBlur = 10 + Math.cos(t * 1.5 + i) * 5;
      let fungusGrad = c.createRadialGradient(p.x - Math.cos(perpAngle) * 45, p.y - Math.sin(perpAngle) * 45, 2, p.x - Math.cos(perpAngle) * 45, p.y - Math.sin(perpAngle) * 45, 10);
      fungusGrad.addColorStop(0, "rgba(150, 255, 150, 0.8)");
      fungusGrad.addColorStop(1, "rgba(150, 255, 150, 0)");
      c.fillStyle = fungusGrad;
      c.beginPath();
      c.arc(p.x - Math.cos(perpAngle) * 45, p.y - Math.sin(perpAngle) * 45, 5 + Math.sin(t * 1.5 + i) * 2, 0, Math.PI * 2);
      c.fill();
      c.shadowBlur = 0;
    }

    c.restore();
  },

  dusmanCiz(c, d, t) {
    c.save();
    c.translate(d.x, d.y);

    const scale = 1 + Math.sin(d.faz * Math.PI * 2) * 0.1; 
    const headNod = Math.sin(d.faz * Math.PI * 4) * 0.1; 
    const legWiggle = Math.sin(d.faz * Math.PI * 6 + t * 2); 

    // Düşman rengini kullanarak gradientler oluştur
    const primaryColor = d.renk;
    const darkColor = "rgba(0,0,0,0.8)"; // Ortak dış kontur rengi
    const highlightColor = "rgba(255, 255, 255, 0.4)"; // Ortak vurgu rengi

    // Gölge
    c.shadowColor = "rgba(0,0,0,0.5)";
    c.shadowBlur = 8;

    // Gövde (karınca benzeri segment)
    let bodyGrad = c.createRadialGradient(0, 0, 1, 0, 0, d.yaricap * 1.1 * scale);
    bodyGrad.addColorStop(0, primaryColor);
    bodyGrad.addColorStop(0.8, darkColor);
    bodyGrad.addColorStop(1, primaryColor); // Kenarları hafifçe parlak
    c.fillStyle = bodyGrad;
    c.strokeStyle = darkColor;
    c.lineWidth = 2;
    c.beginPath();
    c.ellipse(0, 0, d.yaricap * 1.1 * scale, d.yaricap * 0.7 * scale, 0, 0, Math.PI * 2);
    c.fill();
    c.stroke();
    // Vurgu
    c.fillStyle = highlightColor;
    c.beginPath();
    c.ellipse(0, -d.yaricap * 0.3 * scale, d.yaricap * 0.8 * scale, d.yaricap * 0.4 * scale, 0, 0, Math.PI);
    c.fill();

    // Kafa
    let headGrad = c.createRadialGradient(d.yaricap * 0.8 * scale, -d.yaricap * 0.2 * scale + headNod * 5, 1, d.yaricap * 0.8 * scale, -d.yaricap * 0.2 * scale + headNod * 5, d.yaricap * 0.6 * scale);
    headGrad.addColorStop(0, primaryColor);
    headGrad.addColorStop(0.8, darkColor);
    headGrad.addColorStop(1, primaryColor);
    c.fillStyle = headGrad;
    c.beginPath();
    c.arc(d.yaricap * 0.8 * scale, -d.yaricap * 0.2 * scale + headNod * 5, d.yaricap * 0.6 * scale, 0, Math.PI * 2);
    c.fill();
    c.stroke();
    // Vurgu
    c.fillStyle = highlightColor;
    c.beginPath();
    c.arc(d.yaricap * 0.8 * scale, -d.yaricap * 0.4 * scale + headNod * 5, d.yaricap * 0.4 * scale, 0, Math.PI);
    c.fill();

    // Gözler (glowing)
    c.shadowColor = "red";
    c.shadowBlur = 10;
    let eyeGrad = c.createRadialGradient(d.yaricap * 1.1 * scale, -d.yaricap * 0.3 * scale + headNod * 5, 1, d.yaricap * 1.1 * scale, -d.yaricap * 0.3 * scale + headNod * 5, d.yaricap * 0.15 * scale);
    eyeGrad.addColorStop(0, "white");
    eyeGrad.addColorStop(1, "red");
    c.fillStyle = eyeGrad;
    c.beginPath();
    c.arc(d.yaricap * 1.1 * scale, -d.yaricap * 0.3 * scale + headNod * 5, d.yaricap * 0.15 * scale, 0, Math.PI * 2);
    c.fill();
    c.shadowBlur = 0; // Göz gölgesini sıfırla

    // Kuyruk/Karın
    let tailGrad = c.createRadialGradient(-d.yaricap * 1.0 * scale, 0, 1, -d.yaricap * 1.0 * scale, 0, d.yaricap * 0.9 * scale);
    tailGrad.addColorStop(0, primaryColor);
    tailGrad.addColorStop(0.8, darkColor);
    tailGrad.addColorStop(1, primaryColor);
    c.fillStyle = tailGrad;
    c.beginPath();
    c.ellipse(-d.yaricap * 1.0 * scale, 0, d.yaricap * 0.9 * scale, d.yaricap * 0.8 * scale, 0, 0, Math.PI * 2);
    c.fill();
    c.stroke();
    // Vurgu
    c.fillStyle = highlightColor;
    c.beginPath();
    c.ellipse(-d.yaricap * 1.0 * scale, -d.yaricap * 0.4 * scale, d.yaricap * 0.7 * scale, d.yaricap * 0.3 * scale, 0, 0, Math.PI);
    c.fill();

    // Bacaklar (daha kalın ve segmentli)
    c.lineWidth = 3;
    c.strokeStyle = darkColor;
    for (let i = -1; i <= 1; i++) {
      const legX = i * d.yaricap * 0.6 * scale;
      const legY = d.yaricap * 0.5 * scale;
      const wiggleOffset = legWiggle * (i % 2 === 0 ? 1 : -1) * 3;

      // Sol bacaklar
      c.beginPath();
      c.moveTo(legX, legY + wiggleOffset);
      c.lineTo(legX - d.yaricap * 0.5 * scale, legY + d.yaricap * 0.5 * scale + wiggleOffset);
      c.lineTo(legX - d.yaricap * 0.8 * scale, legY + d.yaricap * 0.8 * scale + wiggleOffset);
      c.stroke();
      // Sağ bacaklar
      c.beginPath();
      c.moveTo(legX, -legY - wiggleOffset);
      c.lineTo(legX - d.yaricap * 0.5 * scale, -legY - d.yaricap * 0.5 * scale - wiggleOffset);
      c.lineTo(legX - d.yaricap * 0.8 * scale, -legY - d.yaricap * 0.8 * scale - wiggleOffset);
      c.stroke();
    }
    
    // Düşman tipine göre ek detaylar
    if (d.tip.ad === "Zırhlı Kurbağa") { 
        c.strokeStyle = darkColor; 
        c.lineWidth = 1.5;
        // Zırh plakaları
        c.fillStyle = "rgba(0, 70, 0, 0.7)"; // Koyu yeşil zırh
        c.beginPath();
        c.ellipse(0, 0, d.yaricap * 0.9 * scale, d.yaricap * 0.5 * scale, 0, Math.PI/2, Math.PI * 3/2); // Üst plaka
        c.fill();
        c.stroke();
        c.beginPath();
        c.ellipse(-d.yaricap * 0.7 * scale, 0, d.yaricap * 0.7 * scale, d.yaricap * 0.4 * scale, 0, Math.PI/2, Math.PI * 3/2); // Arka plaka
        c.fill();
        c.stroke();
    } else if (d.tip.ad === "Hızlı Örümcek") {
        c.lineWidth = 1;
        c.strokeStyle = darkColor;
        c.fillStyle = "rgba(20,20,20,0.5)"; // hafif tüylü doku
        // Daha fazla bacak
        for (let i = -2; i <= 2; i += 0.5) { // 8 bacak gibi
            const legX = i * d.yaricap * 0.3 * scale;
            const legY = d.yaricap * 0.4 * scale;
            const wiggleOffset = Math.sin(t * 5 + i * 2) * 2;
            c.beginPath();
            c.moveTo(legX, legY + wiggleOffset);
            c.lineTo(legX - d.yaricap * 0.7 * scale, legY + d.yaricap * 1.0 * scale + wiggleOffset);
            c.stroke();
            c.beginPath();
            c.moveTo(legX, -legY - wiggleOffset);
            c.lineTo(legX - d.yaricap * 0.7 * scale, -legY - d.yaricap * 1.0 * scale - wiggleOffset);
            c.stroke();
        }
    }


    c.shadowBlur = 0; 
    c.restore();
  },

  kuleCiz(c, k, t) {
    c.save();
    c.translate(k.x, k.y);

    c.strokeStyle = "#000000";
    c.lineWidth = 2;
    c.shadowColor = "rgba(0,0,0,0.4)";
    c.shadowBlur = 8;
    
    // Kule tabanı (ortak ve detaylı)
    let baseGrad = c.createRadialGradient(0, 0, 5, 0, 0, 20);
    baseGrad.addColorStop(0, "#8b4513"); // Orta kahverengi
    baseGrad.addColorStop(0.7, "#6a3a10"); // Koyu kahverengi
    baseGrad.addColorStop(1, "#2c1f13"); // En koyu kenar
    c.fillStyle = baseGrad;
    c.beginPath();
    c.arc(0, 0, 20, 0, Math.PI * 2);
    c.fill();
    c.stroke();
    // Taban dokusu
    c.fillStyle = "rgba(0,0,0,0.1)";
    for (let i = 0; i < 15; i++) {
        c.beginPath();
        c.arc(Math.random() * 30 - 15, Math.random() * 30 - 15, 2 + Math.random() * 2, 0, Math.PI * 2);
        c.fill();
    }

    // Seviye göstergesi (arka planlı ve parlayan)
    c.shadowColor = this.palet.vurgu;
    c.shadowBlur = 10 + Math.sin(t * 3) * 5; // hafif parıltı animasyonu
    c.fillStyle = this.palet.vurgu;
    c.beginPath();
    c.arc(0, -35, 12, 0, Math.PI * 2); // Yuvarlak arka plan
    c.fill();
    c.shadowBlur = 0; // Gölgeyi sıfırla

    c.fillStyle = "#333333"; // Sayı için koyu renk
    c.font = "bold 14px Arial";
    c.textAlign = "center";
    c.textBaseline = "middle";
    c.fillText(k.seviye, 0, -35); 

    // Tipine göre kuleye özgü çizim
    switch (k.tip.ad) {
      case "Bitki Dikeni": {
        const plantColor = k.tip.renk;
        const darkPlant = "#2a5e2a";
        const lightPlant = "#8af08a";

        // Taban Sapı (gradientli)
        let stemGrad = c.createLinearGradient(-10, 0, 10, 0);
        stemGrad.addColorStop(0, darkPlant);
        stemGrad.addColorStop(0.5, plantColor);
        stemGrad.addColorStop(1, darkPlant);
        c.fillStyle = stemGrad;
        c.strokeStyle = darkPlant;
        c.lineWidth = 2;
        c.beginPath();
        c.ellipse(0, 0, 10, 18, 0, 0, Math.PI * 2);
        c.fill();
        c.stroke();

        // Ana dikenler/yapraklar (gradientli ve seviyeye göre artan detay)
        const drawSpike = (offsetY, length, width, level) => {
            let spikeGrad = c.createLinearGradient(0, -offsetY - length, 0, -offsetY);
            spikeGrad.addColorStop(0, lightPlant);
            spikeGrad.addColorStop(1, plantColor);
            c.fillStyle = spikeGrad;
            c.strokeStyle = darkPlant;

            c.beginPath();
            c.moveTo(0, -offsetY);
            c.lineTo(width, -offsetY - length);
            c.lineTo(0, -offsetY - length * 0.8);
            c.lineTo(-width, -offsetY - length);
            c.closePath();
            c.fill();
            c.stroke();

            // Yaprak damarları
            if (level >= 2) {
                c.strokeStyle = "rgba(0,0,0,0.3)";
                c.lineWidth = 1;
                c.beginPath();
                c.moveTo(0, -offsetY - length * 0.3);
                c.lineTo(width * 0.5, -offsetY - length * 0.6);
                c.moveTo(0, -offsetY - length * 0.3);
                c.lineTo(-width * 0.5, -offsetY - length * 0.6);
                c.stroke();
            }
        };

        drawSpike(18, 10, 10, k.seviye);
        if (k.seviye >= 2) drawSpike(14, 14, 12, k.seviye);
        if (k.seviye >= 3) drawSpike(10, 18, 14, k.seviye);

        // Namlu/Ağız (döner, daha organik)
        c.rotate(k.aci);
        let muzzleGrad = c.createRadialGradient(20, 0, 1, 20, 0, 10);
        muzzleGrad.addColorStop(0, this.palet.mermi); // Parlak mermi rengi
        muzzleGrad.addColorStop(1, lightPlant);
        c.fillStyle = muzzleGrad;
        c.strokeStyle = darkPlant;
        c.beginPath();
        c.moveTo(0, -8);
        c.bezierCurveTo(15, -15, 25, -5, 30, 0);
        c.bezierCurveTo(25, 5, 15, 15, 0, 8);
        c.closePath();
        c.fill();
        c.stroke();

        // Ateş parlaması (spor bulutu)
        if (k.flas > 0) {
          c.shadowColor = this.palet.mermi;
          c.shadowBlur = 15 * k.flas;
          let flashGrad = c.createRadialGradient(30, 0, 1, 30, 0, 10 + k.flas * 10);
          flashGrad.addColorStop(0, "rgba(255, 255, 150, " + k.flas * 0.8 + ")");
          flashGrad.addColorStop(1, "rgba(255, 255, 150, 0)");
          c.fillStyle = flashGrad;
          for(let i=0; i<5; i++){
              c.beginPath();
              c.arc(30 + Math.random()*10*k.flas, Math.random()*10*k.flas - 5*k.flas, 5 + k.flas * 5, 0, Math.PI * 2);
              c.fill();
          }
        }
        c.shadowBlur = 0;
        c.rotate(-k.aci); 
        break;
      }

      case "Yapışkan Salgı": {
        const gooColor = k.tip.renk;
        const darkGoo = "#5e3a1a";
        const lightGoo = "#a87a4a";

        // Blob Tabanı (gradientli, yarı saydam)
        let blobGrad = c.createRadialGradient(0, 5, 5, 0, 5, 25);
        blobGrad.addColorStop(0, lightGoo);
        blobGrad.addColorStop(0.7, gooColor);
        blobGrad.addColorStop(1, darkGoo);
        c.fillStyle = blobGrad;
        c.strokeStyle = darkGoo;
        c.lineWidth = 2;
        c.beginPath();
        c.ellipse(0, 0, 25, 15, 0, 0, Math.PI * 2);
        c.fill();
        c.stroke();

        // İç desen - baloncuklar
        c.fillStyle = "rgba(255, 255, 255, 0.2)";
        for (let i = 0; i < 5; i++) {
            c.beginPath();
            c.arc(Math.sin(t * 1.5 + i) * 10, Math.cos(t * 1.8 + i) * 8, 3 + Math.sin(t * 2 + i) * 1, 0, Math.PI * 2);
            c.fill();
        }

        // Yapışkan havuzu (Seviye 2+, daha geniş)
        if (k.seviye >= 2) {
          let poolGrad = c.createRadialGradient(0, 0, 5, 0, 0, 30);
          poolGrad.addColorStop(0, "rgba(180, 110, 60, 0.7)");
          poolGrad.addColorStop(1, "rgba(180, 110, 60, 0.3)");
          c.fillStyle = poolGrad;
          c.beginPath();
          c.ellipse(0, 0, 28 + Math.sin(t * 0.5) * 2, 18 + Math.cos(t * 0.4) * 1.5, 0, 0, Math.PI * 2);
          c.fill();
          c.stroke();
        }
        
        // Yapışkan kollar/Ağız (namlu) - Döner, daha sıvı görünümlü
        c.rotate(k.aci);
        c.strokeStyle = darkGoo;
        c.lineWidth = 2;
        
        const drawTentacle = (baseWidth, tipWidth, length, level) => {
            let tentacleGrad = c.createLinearGradient(0, -baseWidth, length, baseWidth);
            tentacleGrad.addColorStop(0, lightGoo);
            tentacleGrad.addColorStop(1, gooColor);
            c.fillStyle = tentacleGrad;
            
            c.beginPath();
            c.moveTo(0, 0);
            c.bezierCurveTo(length * 0.5, -baseWidth, length * 0.8, -tipWidth, length, 0);
            c.bezierCurveTo(length * 0.8, tipWidth, length * 0.5, baseWidth, 0, 0);
            c.fill();
            c.stroke();
        };

        drawTentacle(8, 4, 30, k.seviye);
        if (k.seviye >= 3) drawTentacle(10, 5, 35, k.seviye); // Daha büyük ve güçlü

        // Ateş parlaması (yapışkan sıçraması)
        if (k.flas > 0) {
          c.shadowColor = lightGoo;
          c.shadowBlur = 12 * k.flas;
          let flashGrad = c.createRadialGradient(32, 0, 1, 32, 0, 12 + k.flas * 8);
          flashGrad.addColorStop(0, "rgba(255, 200, 100, " + k.flas * 0.8 + ")");
          flashGrad.addColorStop(1, "rgba(255, 200, 100, 0)");
          c.fillStyle = flashGrad;
          for(let i=0; i<3; i++){
              c.beginPath();
              c.arc(32 + Math.random()*8*k.flas, Math.random()*8*k.flas - 4*k.flas, 6 + k.flas * 6, 0, Math.PI * 2);
              c.fill();
          }
        }
        c.shadowBlur = 0;
        c.rotate(-k.aci); 
        break;
      }

      case "Kaya Mancınığı": {
        const rockColor = k.tip.renk;
        const darkRock = "#4a4a4a";
        const lightRock = "#9a9a9a";

        // Taban Platformu (gradientli)
        let platformGrad = c.createLinearGradient(-20, -10, 20, 10);
        platformGrad.addColorStop(0, darkRock);
        platformGrad.addColorStop(0.5, rockColor);
        platformGrad.addColorStop(1, darkRock);
        c.fillStyle = platformGrad;
        c.strokeStyle = darkRock;
        c.lineWidth = 2;
        c.beginPath();
        c.rect(-20, -10, 40, 20);
        c.fill();
        c.stroke();
        // Taş dokusu
        c.fillStyle = "rgba(0,0,0,0.15)";
        c.fillRect(-15, -5, 10, 5);
        c.fillRect(5, 2, 8, 4);

        // Destek Sütunu (gradientli)
        let columnGrad = c.createLinearGradient(0, -20, 10, -10);
        columnGrad.addColorStop(0, lightRock);
        columnGrad.addColorStop(1, rockColor);
        c.fillStyle = columnGrad;
        c.beginPath();
        c.moveTo(0, -10);
        c.lineTo(0, -20);
        c.lineTo(10, -20);
        c.lineTo(10, -10);
        c.closePath();
        c.fill();
        c.stroke();

        // Mancınık Kolu (namlu) - Döner, daha güçlü görünüm
        c.rotate(k.aci);
        let armGrad = c.createLinearGradient(-5, -10, 25, 10);
        armGrad.addColorStop(0, darkRock);
        armGrad.addColorStop(0.5, lightRock);
        armGrad.addColorStop(1, darkRock);
        c.fillStyle = armGrad;
        c.strokeStyle = darkRock;
        c.lineWidth = 2;
        c.beginPath();
        c.moveTo(-5, -5);
        c.lineTo(25, -10);
        c.lineTo(25, 10);
        c.lineTo(-5, 5);
        c.closePath();
        c.fill();
        c.stroke();

        // Mermi tutucu / sepet (Seviye 2+)
        if (k.seviye >= 2) {
          let basketGrad = c.createRadialGradient(28, 0, 2, 28, 0, 8);
          basketGrad.addColorStop(0, lightRock);
          basketGrad.addColorStop(1, darkRock);
          c.fillStyle = basketGrad;
          c.beginPath();
          c.arc(28, 0, 8, 0, Math.PI * 2);
          c.fill();
          c.stroke();
        }

        // Ek karşı ağırlık/detay (Seviye 3+)
        if (k.seviye >= 3) {
            let counterWeightGrad = c.createLinearGradient(-15, -15, -5, -5);
            counterWeightGrad.addColorStop(0, lightRock);
            counterWeightGrad.addColorStop(1, darkRock);
            c.fillStyle = counterWeightGrad;
            c.beginPath();
            c.rect(-15, -15, 10, 10);
            c.fill();
            c.stroke();
            // Küçük bir mekanik detay
            c.fillStyle = "#333333";
            c.beginPath();
            c.arc(-10, -10, 3, 0, Math.PI * 2);
            c.fill();
        }

        // Ateş parlaması (kaya fırlatma - toz ve taş)
        if (k.flas > 0) {
          c.shadowColor = "#aaaaaa";
          c.shadowBlur = 10 * k.flas;
          let flashGrad = c.createRadialGradient(35, 0, 1, 35, 0, 12 + k.flas * 10);
          flashGrad.addColorStop(0, "rgba(200, 200, 200, " + k.flas * 0.8 + ")");
          flashGrad.addColorStop(1, "rgba(200, 200, 200, 0)");
          c.fillStyle = flashGrad;
          for(let i=0; i<4; i++){
              c.beginPath();
              c.arc(35 + Math.random()*12*k.flas, Math.random()*12*k.flas - 6*k.flas, 4 + k.flas * 8, 0, Math.PI * 2);
              c.fill();
          }
        }
        c.shadowBlur = 0;
        c.rotate(-k.aci); 
        break;
      }
    }

    c.shadowBlur = 0; 
    c.restore();
  }
};

  ];

        const o = kalan / (yolUzunluklari[i] || 1);
        return {x: yol[i].x + (yol[i+1].x-yol[i].x)*o,
                y: yol[i].y + (yol[i+1].y-yol[i].y)*o,
                aci: Math.atan2(yol[i+1].y-yol[i].y, yol[i+1].x-yol[i].x)};
      }
      kalan -= yolUzunluklari[i];
    }
    const s = yol[yol.length-1];
    return {x:s.x, y:s.y, aci:0};
  }

  // ---------- Tip tanımları ----------
  const varsayilanDusmanlar = [
    {ad:"Asker", can:60, hiz:60, altin:12, yaricap:14, renk:P.dusman},
    {ad:"Koşucu", can:40, hiz:95, altin:14, yaricap:12, renk:P.dusman2},
    {ad:"Zırhlı", can:150, hiz:42, altin:22, yaricap:18, renk:P.vurgu}
  ];
  const varsayilanKuleler = [
    {ad:"Nişancı", fiyat:50, menzil:150, hasar:18, atisHizi:1.1, mermiHizi:340, renk:P.kule},
    {ad:"Top", fiyat:90, menzil:120, hasar:42, atisHizi:0.55, mermiHizi:260, renk:P.mermi, alan:46},
    {ad:"Yavaşlatıcı", fiyat:70, menzil:135, hasar:8, atisHizi:0.9, mermiHizi:320, renk:P.vurgu, yavaslat:0.55}
  ];
  const DUSMAN_TIPLERI = (T.dusmanTipleri && T.dusmanTipleri.length) ? T.dusmanTipleri : varsayilanDusmanlar;
  const KULE_TIPLERI  = (T.kuleTipleri && T.kuleTipleri.length)  ? T.kuleTipleri  : varsayilanKuleler;

  // ---------- Yardımcı ----------
  function rastgele(a,b){ return a + Math.random()*(b-a); }
  function mesafe(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }

  function boyutlandir(){
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.floor(window.innerWidth * dpr);
    canvas.height = Math.floor(window.innerHeight * dpr);
    const o = Math.min(canvas.width/REF_W, canvas.height/REF_H);
    olcek = o;
    kaydirX = (canvas.width - REF_W*o)/2;
    kaydirY = (canvas.height - REF_H*o)/2;
  }
  window.addEventListener("resize", boyutlandir);

  function olayNoktasi(e){
    const r = canvas.getBoundingClientRect();
    const kx = (e.touches && e.touches[0]) ? e.touches[0].clientX :
               (e.changedTouches && e.changedTouches[0]) ? e.changedTouches[0].clientX : e.clientX;
    const ky = (e.touches && e.touches[0]) ? e.touches[0].clientY :
               (e.changedTouches && e.changedTouches[0]) ? e.changedTouches[0].clientY : e.clientY;
    const px = (kx - r.left) * (canvas.width / r.width);
    const py = (ky - r.top) * (canvas.height / r.height);
    return {x: (px - kaydirX)/olcek, y: (py - kaydirY)/olcek};
  }

  function yolaYakinMi(p, esik){
    for (let i=0;i<yol.length-1;i++){
      const a=yol[i], b=yol[i+1];
      const dx=b.x-a.x, dy=b.y-a.y;
      const uzun = dx*dx+dy*dy || 1;
      let t = ((p.x-a.x)*dx + (p.y-a.y)*dy)/uzun;
      t = Math.max(0, Math.min(1, t));
      const px=a.x+dx*t, py=a.y+dy*t;
      if (Math.hypot(p.x-px, p.y-py) < esik) return true;
    }
    return false;
  }

  // ---------- Dalga üretimi ----------
  function dalgaOlustur(n){
    const bos = (n % 5 === 0);           // 5. ve 10. dalga boss
    const adet = bos ? 1 + Math.floor(n/3) : 5 + n*2;
    const gucCarpani = Math.pow(1.28, n-1);
    const liste = [];
    for (let i=0;i<adet;i++){
      const tip = DUSMAN_TIPLERI[Math.min(DUSMAN_TIPLERI.length-1,
                    Math.floor(Math.random()*Math.min(DUSMAN_TIPLERI.length, 1+Math.floor(n/3))))];
      liste.push({tip:tip, bos: bos && i===0, guc:gucCarpani});
    }
    return liste;
  }

  function dusmanEkle(kayit){
    const t = kayit.tip;
    const bosCarpan = kayit.bos ? 6 : 1;
    dusmanlar.push({
      tip:t, mesafe:-rastgele(0,40),
      maxCan: t.can*kayit.guc*bosCarpan, can: t.can*kayit.guc*bosCarpan,
      hiz: t.hiz*(kayit.bos?0.72:1), altin: Math.round(t.altin*(kayit.bos?8:1)),
      yaricap: (t.yaricap||14)*(kayit.bos?1.9:1), renk: t.renk||P.dusman,
      bos: !!kayit.bos, yavaslama:1, yavaslamaSayac:0, faz: Math.random()*6.28,
      vurulmaZaman:0, x:0, y:0, aci:0
    });
  }

  // ---------- Oyun kontrolü ----------
  function sifirla(){
    can=BASLANGIC_CAN; altin=BASLANGIC_ALTIN; dalga=0; skor=0; combo=1; comboZaman=0;
    dusmanlar=[]; kuleler=[]; mermiler=[]; parcaciklar=[]; yaziEfektleri=[];
    dalgaKuyrugu=[]; spawnKuyrugu=[]; dalgaAraSayac=3; dalgaAktif=false; spawnSayac=0;
    seciliKule=null; seciliKuleTipi=0; ekranSarsinti=0; donmaSuresi=0;
    kulePaneliCiz();
    hudGuncelle();
  }

  function basla(){
    sifirla();
    asama="oyunda";
    document.getElementById("menuOverlay").classList.add("gizli");
    document.getElementById("sonOverlay").classList.add("gizli");
    document.getElementById("kuleMenu").classList.add("gizli");
  }

  function bitir(kazandiMi){
    asama = kazandiMi ? "kazandi" : "kaybetti";
    document.getElementById("sonBaslik").textContent = kazandiMi ? "Kazandın!" : "Kaybettin";
    document.getElementById("sonMetin").textContent =
      (kazandiMi ? "Tüm dalgaları püskürttün. " : "Savunma çöktü. ") + "Skor: " + skor;
    document.getElementById("sonOverlay").classList.remove("gizli");
    document.getElementById("kuleMenu").classList.add("gizli");
  }

  function uyariGoster(metin){
    const u = document.getElementById("uyari");
    u.textContent = metin;
    u.classList.add("gorunur");
    setTimeout(()=>u.classList.remove("gorunur"), 1400);
  }

  // ---------- HUD ----------
  function hudGuncelle(){
    document.getElementById("hudCan").textContent = Math.max(0, can);
    document.getElementById("hudAltin").textContent = altin;
    document.getElementById("hudDalga").textContent = dalga;
    document.getElementById("hudToplamDalga").textContent = TOPLAM_DALGA;
    document.getElementById("hudSkor").textContent = skor;
    // JUICE: can azaldıkça kırmızı vinyet belirginleşir (renk dili / durum uyarısı)
    const oran = can / BASLANGIC_CAN;
    document.getElementById("vinyet").style.opacity =
      oran < 0.35 ? String((1 - oran/0.35) * 0.85) : "0";
    const c = document.getElementById("hudCombo");
    if (combo > 1){ c.style.display="block";
      document.getElementById("hudComboSayi").textContent = combo; }
    else c.style.display="none";
    Array.from(document.querySelectorAll(".kule-btn")).forEach((b,i)=>{
      b.disabled = altin < KULE_TIPLERI[i].fiyat;
      b.classList.toggle("secili", i===seciliKuleTipi);
    });
  }

  function kulePaneliCiz(){
    const panel = document.getElementById("kulePanel");
    panel.innerHTML = "";
    KULE_TIPLERI.forEach((k,i)=>{
      const b = document.createElement("button");
      b.className = "kule-btn" + (i===0 ? " secili" : "");
      b.innerHTML = k.ad + "<br><span style='opacity:.7'>" + k.fiyat + " altın</span>";
      b.addEventListener("click", (e)=>{ e.stopPropagation(); seciliKuleTipi=i; hudGuncelle(); });
      panel.appendChild(b);
    });
  }

  // ---------- Etkileşim ----------
  function haritayaDokun(e){
    if (asama !== "oyunda") return;
    e.preventDefault();
    const p = olayNoktasi(e);

    // Kurulu kuleye dokunulduysa menü aç
    for (const k of kuleler){
      if (mesafe(p,k) < 26){ seciliKule = k; kuleMenusuAc(); return; }
    }
    // Yeni kule kur
    const tip = KULE_TIPLERI[seciliKuleTipi];
    if (altin < tip.fiyat){ uyariGoster("Yetersiz altın!"); return; }
    if (yolaYakinMi(p, 34)){ uyariGoster("Yola kule kurulamaz!"); return; }
    for (const k of kuleler){ if (mesafe(p,k) < 40){ uyariGoster("Çok yakın!"); return; } }
    if (p.x<10||p.y<10||p.x>REF_W-10||p.y>REF_H-10) return;

    kuleler.push({x:p.x, y:p.y, tip:tip, seviye:1, sayac:0, aci:-Math.PI/2,
                  menzil:tip.menzil, hasar:tip.hasar, yatirim:tip.fiyat, flas:0});
    altin -= tip.fiyat;
    hudGuncelle();
  }
  canvas.addEventListener("click", haritayaDokun);
  canvas.addEventListener("touchstart", haritayaDokun, {passive:false});

  function kuleMenusuAc(){
    if (!seciliKule) return;
    const k = seciliKule;
    document.getElementById("kmBaslik").textContent = k.tip.ad + " (Sv." + k.seviye + ")";
    document.getElementById("kmBilgi").textContent =
      "Hasar: " + Math.round(k.hasar) + " | Menzil: " + Math.round(k.menzil) +
      " | Yükseltme: " + yukseltmeFiyati(k) + " altın | Satış: " + Math.floor(k.yatirim*0.6) + " altın";
    document.getElementById("kmYukselt").disabled = (k.seviye>=3 || altin<yukseltmeFiyati(k));
    document.getElementById("kuleMenu").classList.remove("gizli");
  }
  function yukseltmeFiyati(k){ return Math.round(k.tip.fiyat * 0.8 * k.seviye); }

  document.getElementById("kmYukselt").addEventListener("click", ()=>{
    const k = seciliKule; if (!k) return;
    const f = yukseltmeFiyati(k);
    if (k.seviye<3 && altin>=f){
      altin-=f; k.yatirim+=f; k.seviye++;
      k.hasar*=1.6; k.menzil*=1.15;
    }
    document.getElementById("kuleMenu").classList.add("gizli");
    seciliKule=null; hudGuncelle();
  });
  document.getElementById("kmSat").addEventListener("click", ()=>{
    if (seciliKule){
      altin += Math.floor(seciliKule.yatirim*0.6);
      kuleler = kuleler.filter(x=>x!==seciliKule);
    }
    document.getElementById("kuleMenu").classList.add("gizli");
    seciliKule=null; hudGuncelle();
  });
  document.getElementById("kmKapat").addEventListener("click", ()=>{
    document.getElementById("kuleMenu").classList.add("gizli"); seciliKule=null;
  });
  document.getElementById("baslaBtn").addEventListener("click", basla);
  document.getElementById("yenidenBtn").addEventListener("click", basla);

  // ---------- Efektler ----------
  function patlamaEkle(x,y,renk,adet){
    for (let i=0;i<(adet||10);i++){
      const a = Math.random()*Math.PI*2, h = rastgele(60,190);
      parcaciklar.push({x:x,y:y,vx:Math.cos(a)*h,vy:Math.sin(a)*h,
                        omur:rastgele(0.3,0.75), yas:0, renk:renk, boyut:rastgele(2,4.5)});
    }
  }
  function yaziEkle(x,y,metin,renk){
    yaziEfektleri.push({x:x,y:y,metin:metin,renk:renk||P.metin,omur:0.9,yas:0});
  }

  // ---------- Güncelleme ----------
  function guncelle(dt){
    zaman += dt;
    if (ekranSarsinti>0) ekranSarsinti = Math.max(0, ekranSarsinti - dt*2.2);  // JUICE: sönümlen
    if (asama !== "oyunda") return;

    // Combo zaman aşımı
    if (combo>1){ comboZaman-=dt; if (comboZaman<=0){ combo=1; hudGuncelle(); } }

    // Dalga yönetimi
    if (!dalgaAktif && spawnKuyrugu.length===0 && dusmanlar.length===0){
      dalgaAraSayac -= dt;
      if (dalgaAraSayac<=0){
        if (dalga >= TOPLAM_DALGA){ bitir(true); return; }
        dalga++;
        spawnKuyrugu = dalgaOlustur(dalga);
        dalgaAktif = true; spawnSayac = 0;
        uyariGoster("Dalga " + dalga + " geliyor!");
        hudGuncelle();
      }
    }
    if (dalgaAktif){
      spawnSayac -= dt;
      if (spawnSayac<=0 && spawnKuyrugu.length){
        dusmanEkle(spawnKuyrugu.shift());
        spawnSayac = 0.75;
      }
      if (spawnKuyrugu.length===0) dalgaAktif=false;
    }
    if (!dalgaAktif && spawnKuyrugu.length===0 && dusmanlar.length===0 && dalgaAraSayac<=0){
      dalgaAraSayac = DALGA_ARASI;
    }

    // Düşmanlar
    for (let i=dusmanlar.length-1;i>=0;i--){
      const d = dusmanlar[i];
      if (d.vurulmaZaman>0) d.vurulmaZaman = Math.max(0, d.vurulmaZaman - dt);
      if (d.yavaslamaSayac>0){ d.yavaslamaSayac-=dt; if (d.yavaslamaSayac<=0) d.yavaslama=1; }
      d.mesafe += d.hiz * d.yavaslama * dt;
      const n = yolNoktasi(d.mesafe);
      d.x=n.x; d.y=n.y; d.aci=n.aci;
      if (T.dusmanGuncelle) { try { T.dusmanGuncelle(d, dt, zaman); } catch(e){} }
      if (d.mesafe >= yolToplam){
        dusmanlar.splice(i,1);
        can -= d.bos ? 5 : 1;
        combo=1;
        ekranSarsinti = Math.min(1, ekranSarsinti + (d.bos ? 0.55 : 0.3));  // JUICE
        patlamaEkle(d.x,d.y,"#ef4444",8);
        hudGuncelle();
        if (can<=0){ can=0; hudGuncelle(); bitir(false); return; }
      }
    }

    // Kuleler
    for (const k of kuleler){
      k.sayac -= dt;
      if (k.flas>0) k.flas-=dt;
      let hedef=null, enYakin=1e9;
      for (const d of dusmanlar){
        const m = mesafe(k,d);
        if (m<=k.menzil && d.mesafe>enYakin*0-1 && m<enYakin){ enYakin=m; hedef=d; }
      }
      if (hedef){
        k.aci = Math.atan2(hedef.y-k.y, hedef.x-k.x);
        if (k.sayac<=0){
          k.sayac = 1/(k.tip.atisHizi||1);
          k.flas = 0.08;
          mermiler.push({x:k.x,y:k.y,hedef:hedef,hiz:k.tip.mermiHizi||320,
                         hasar:k.hasar, renk:k.tip.renk||P.mermi,
                         alan:k.tip.alan||0, yavaslat:k.tip.yavaslat||0, iz:[]});
        }
      }
    }

    // Mermiler
    for (let i=mermiler.length-1;i>=0;i--){
      const m = mermiler[i];
      if (!m.hedef || m.hedef.can<=0 || dusmanlar.indexOf(m.hedef)===-1){ mermiler.splice(i,1); continue; }
      const dx=m.hedef.x-m.x, dy=m.hedef.y-m.y, uz=Math.hypot(dx,dy)||1;
      m.iz.push({x:m.x,y:m.y}); if (m.iz.length>6) m.iz.shift();
      m.x += dx/uz*m.hiz*dt; m.y += dy/uz*m.hiz*dt;
      if (uz < 14){
        vurus(m, m.hedef);
        mermiler.splice(i,1);
      }
    }

    // Parçacıklar / yazılar
    for (let i=parcaciklar.length-1;i>=0;i--){
      const p=parcaciklar[i]; p.yas+=dt;
      if (p.yas>=p.omur){ parcaciklar.splice(i,1); continue; }
      p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=180*dt;
    }
    for (let i=yaziEfektleri.length-1;i>=0;i--){
      const y=yaziEfektleri[i]; y.yas+=dt; y.y-=26*dt;
      if (y.yas>=y.omur) yaziEfektleri.splice(i,1);
    }
    if (T.guncelle) { try { T.guncelle(dt, zaman, {dusmanlar,kuleler,dalga}); } catch(e){} }
  }

  function vurus(m, d){
    const hedefler = m.alan ? dusmanlar.filter(x=>mesafe(x,d)<=m.alan) : [d];
    for (const h of hedefler){
      h.can -= m.hasar;
      h.vurulmaZaman = 0.14;  // JUICE: sıkışma-esneme animasyonu tetiklenir
      if (m.yavaslat){ h.yavaslama=m.yavaslat; h.yavaslamaSayac=1.6; }
      if (h.can<=0){
        const idx = dusmanlar.indexOf(h);
        if (idx>-1){
          dusmanlar.splice(idx,1);
          const kazanc = Math.round(h.altin*combo);
          altin += kazanc; skor += Math.round(10*combo*(h.bos?5:1));
          combo = Math.min(5, combo+1); comboZaman = 3;
          patlamaEkle(h.x,h.y,h.renk, h.bos?22:11);
          yaziEkle(h.x,h.y,"+"+kazanc, "#fbbf24");
          if (h.bos){                          // JUICE: boss ölümünde ağırlık hissi
            donmaSuresi = Math.max(donmaSuresi, 0.09);
            ekranSarsinti = Math.min(1, ekranSarsinti + 0.7);
          }
          hudGuncelle();
        }
      } else {
        yaziEkle(h.x, h.y-10, "-"+Math.round(m.hasar), "#fca5a5");
      }
    }
    patlamaEkle(m.x,m.y,m.renk,4);
  }

  // ---------- Çizim ----------
  function varsayilanArkaplan(c,W,H,t){
    const g = c.createLinearGradient(0,0,0,H);
    g.addColorStop(0,P.arka1); g.addColorStop(1,P.arka2);
    c.fillStyle=g; c.fillRect(0,0,W,H);
  }
  function varsayilanYol(c){
    c.lineCap="round"; c.lineJoin="round";
    c.strokeStyle=P.yolKenar; c.lineWidth=46;
    c.beginPath(); c.moveTo(yol[0].x,yol[0].y);
    for (let i=1;i<yol.length;i++) c.lineTo(yol[i].x,yol[i].y);
    c.stroke();
    c.strokeStyle=P.yol; c.lineWidth=36; c.stroke();
  }
  function varsayilanDusman(c,d,t){
    c.save(); c.translate(d.x,d.y);
    const sal = Math.sin(t*6+d.faz)*0.12;
    c.rotate(sal);
    c.fillStyle="rgba(0,0,0,.28)";
    c.beginPath(); c.ellipse(0,d.yaricap*0.8,d.yaricap*0.9,d.yaricap*0.35,0,0,6.29); c.fill();
    c.fillStyle=d.renk;
    c.beginPath(); c.arc(0,0,d.yaricap,0,6.29); c.fill();
    c.fillStyle="rgba(255,255,255,.85)";
    c.beginPath(); c.arc(-d.yaricap*0.3,-d.yaricap*0.25,d.yaricap*0.18,0,6.29);
    c.arc(d.yaricap*0.3,-d.yaricap*0.25,d.yaricap*0.18,0,6.29); c.fill();
    c.restore();
  }
  function varsayilanKule(c,k,t){
    c.save(); c.translate(k.x,k.y);
    c.fillStyle="rgba(0,0,0,.3)";
    c.beginPath(); c.ellipse(0,14,20,7,0,0,6.29); c.fill();
    c.fillStyle="#1f2937";
    c.beginPath(); c.arc(0,0,19,0,6.29); c.fill();
    c.fillStyle=k.tip.renk||P.kule;
    c.beginPath(); c.arc(0,0,14,0,6.29); c.fill();
    c.rotate(k.aci);
    c.fillStyle="#111827"; c.fillRect(0,-4,26,8);
    if (k.flas>0){ c.fillStyle="#fff"; c.beginPath(); c.arc(28,0,7,0,6.29); c.fill(); }
    c.restore();
    for (let i=0;i<k.seviye-1;i++){
      c.fillStyle=P.vurgu;
      c.beginPath(); c.arc(k.x-6+i*6, k.y-24, 3, 0, 6.29); c.fill();
    }
  }

  function canBari(c,d){
    if (d.can>=d.maxCan) return;
    const g = d.bos?60:30, y=d.y-d.yaricap-10;
    c.fillStyle="rgba(0,0,0,.6)"; c.fillRect(d.x-g/2,y,g,d.bos?7:4);
    c.fillStyle= d.bos?"#f43f5e":"#22c55e";
    c.fillRect(d.x-g/2,y,g*Math.max(0,d.can/d.maxCan),d.bos?7:4);
  }

  // ---------- PERFORMANS: Kule sprite önbelleği ----------
  // Her kule tipi+seviye+açı kombinasyonu bir kez offscreen canvas'a çizilir,
  // sonrasında sadece drawImage ile kopyalanır (gradient/shadow/path maliyeti
  // her karede değil, sadece ilk seferde ödenir). Ateş flaşı önbelleğe alınmaz
  // (üstteki ışık halesi zaten k.flas ile canlı pulslanıyor), böylece flaş
  // efekti kaybolmaz.
  const kuleSpriteOnbellek = new Map();
  const ACI_ADIM = 32;  // 11.25°'lik dilimler; gözle fark edilmeyecek kadar ince

  function kuleSpriteAl(k){
    const tipIdx = KULE_TIPLERI.indexOf(k.tip);
    const adim = (Math.PI*2)/ACI_ADIM;
    const aciQ = ((Math.round(k.aci/adim) % ACI_ADIM) + ACI_ADIM) % ACI_ADIM;
    const anahtar = tipIdx + "_" + k.seviye + "_" + aciQ;
    let s = kuleSpriteOnbellek.get(anahtar);
    if (s) return s;

    const boyut = 96;
    const off = document.createElement("canvas");
    off.width = boyut; off.height = boyut;
    const octx = off.getContext("2d");
    octx.translate(boyut/2, boyut/2);
    octx.save();
    octx.beginPath(); octx.rect(-46,-46,92,92); octx.clip();
    const sahteK = Object.assign({}, k, {x:0, y:0, aci: aciQ*adim, flas:0});
    try { (T.kuleCiz || varsayilanKule)(octx, sahteK, 0); }
    catch(e){ varsayilanKule(octx, sahteK, 0); }
    octx.restore();

    s = {canvas: off, boyut: boyut};
    kuleSpriteOnbellek.set(anahtar, s);
    return s;
  }

  function ambiyansCiz(c,t){
    c.save(); c.globalAlpha=.3; c.fillStyle = P.vurgu;
    for (const a of ambiyansParcaciklari){
      const y = ((a.y + t*a.hiz) % (REF_H+20)) - 10;
      const x = a.x + Math.sin(t*0.5+a.faz)*14;
      c.beginPath(); c.arc(x,y,a.boyut,0,6.29); c.fill();
    }
    c.restore();
  }

  function ciz(){
    ctx.setTransform(1,0,0,1,0,0);
    ctx.fillStyle="#05080f"; ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.setTransform(olcek,0,0,olcek,kaydirX,kaydirY);

    // JUICE: ekran sarsıntısı (sadece dünyayı etkiler, HUD ayrı DOM katmanında olduğu için sarsılmaz)
    if (ekranSarsinti>0.01){
      const guc = ekranSarsinti*ekranSarsinti;
      ctx.translate((Math.random()*2-1)*10*guc, (Math.random()*2-1)*10*guc);
    }

    try { (T.arkaplanCiz || varsayilanArkaplan)(ctx, REF_W, REF_H, zaman); }
    catch(e){ varsayilanArkaplan(ctx, REF_W, REF_H, zaman); }

    // JUICE: evrensel atmosfer katmanı — Gemini'nin arka planı ne kadar basit olursa
    // olsun her sahneye otomatik derinlik katar (üstten yumuşak ışık + kenarlarda vinyet)
    try {
      ctx.save();
      const isik = ctx.createLinearGradient(0,0,0,REF_H);
      isik.addColorStop(0, "rgba(255,255,255,.10)");
      isik.addColorStop(0.4, "rgba(255,255,255,0)");
      ctx.fillStyle = isik; ctx.fillRect(0,0,REF_W,REF_H);
      ctx.globalCompositeOperation = "multiply";
      const vin = ctx.createRadialGradient(REF_W/2,REF_H/2,REF_H*0.35,
                                            REF_W/2,REF_H/2,REF_H*0.85);
      vin.addColorStop(0, "rgba(255,255,255,1)");
      vin.addColorStop(1, "rgba(140,140,150,1)");
      ctx.fillStyle = vin; ctx.fillRect(0,0,REF_W,REF_H);
      ctx.restore();
    } catch(e){}
    ambiyansCiz(ctx, zaman);  // JUICE: her temada otomatik yüzen parıltı zerreleri
    try { (T.yolCiz || varsayilanYol)(ctx, yol, zaman); }
    catch(e){ varsayilanYol(ctx); }

    // Seçili kule tipinin menzil önizlemesi yok; kurulu kulelerin menzili seçiliyken
    if (seciliKule){
      ctx.strokeStyle="rgba(56,189,248,.55)"; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(seciliKule.x,seciliKule.y,seciliKule.menzil,0,6.29); ctx.stroke();
    }

    for (const k of kuleler){
      // JUICE: kule altında yumuşak ışık halesi (her tema için otomatik, Gemini'ye bağlı değil)
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      const renk = (k.tip.renk || P.kule);
      const glowR = 30 + Math.sin(zaman*2 + k.x*0.01)*3 + (k.flas>0 ? 16 : 0);
      try {
        const g = ctx.createRadialGradient(k.x,k.y,0,k.x,k.y,glowR);
        g.addColorStop(0, renk+"33"); g.addColorStop(1, renk+"00");
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(k.x,k.y,glowR,0,6.29); ctx.fill();
      } catch(e){}
      ctx.restore();

      // PERFORMANS: canlı çizim yerine önbellekten kopyala (bkz. kuleSpriteAl)
      const sprite = kuleSpriteAl(k);
      ctx.drawImage(sprite.canvas, k.x - sprite.boyut/2, k.y - sprite.boyut/2);
    }
    for (const d of dusmanlar){
      // Kontrast halkası: eklenti düşmanı zeminle aynı renk yapsa bile ayrışsın
      ctx.save();
      ctx.strokeStyle="rgba(0,0,0,.55)"; ctx.lineWidth=3;
      ctx.beginPath(); ctx.arc(d.x,d.y,d.yaricap*1.05,0,6.29); ctx.stroke();
      ctx.strokeStyle="rgba(255,255,255,.35)"; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.arc(d.x,d.y,d.yaricap*1.05,0,6.29); ctx.stroke();
      ctx.restore();

      // JUICE: vurulunca sıkışma-esneme (squash & stretch)
      let sx=1, sy=1;
      if (d.vurulmaZaman>0){
        const o = d.vurulmaZaman/0.14;
        sx = 1 + 0.22*o; sy = 1 - 0.22*o;
      }
      ctx.save();
      ctx.translate(d.x,d.y); ctx.scale(sx,sy); ctx.translate(-d.x,-d.y);
      ctx.beginPath(); ctx.rect(d.x-d.yaricap*2, d.y-d.yaricap*2.4,
                                d.yaricap*4, d.yaricap*4.4); ctx.clip();
      try { (T.dusmanCiz || varsayilanDusman)(ctx,d,zaman); }
      catch(e){ varsayilanDusman(ctx,d,zaman); }
      ctx.restore();
      canBari(ctx,d);
    }
    for (const m of mermiler){
      ctx.strokeStyle=m.renk; ctx.lineWidth=2; ctx.globalAlpha=.5;
      ctx.beginPath();
      m.iz.forEach((p,i)=> i? ctx.lineTo(p.x,p.y) : ctx.moveTo(p.x,p.y));
      ctx.stroke(); ctx.globalAlpha=1;
      ctx.fillStyle=m.renk; ctx.beginPath(); ctx.arc(m.x,m.y,4,0,6.29); ctx.fill();
    }
    for (const p of parcaciklar){
      ctx.globalAlpha = Math.max(0, 1-p.yas/p.omur);
      ctx.fillStyle=p.renk;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.boyut,0,6.29); ctx.fill();
    }
    ctx.globalAlpha=1;
    ctx.textAlign="center"; ctx.font="bold 15px system-ui";
    for (const y of yaziEfektleri){
      ctx.globalAlpha = Math.max(0, 1-y.yas/y.omur);
      ctx.fillStyle=y.renk; ctx.fillText(y.metin,y.x,y.y);
    }
    ctx.globalAlpha=1;

    if (T.ustCiz){ try { T.ustCiz(ctx, REF_W, REF_H, zaman, {dalga,can,altin}); } catch(e){} }
  }

  // ---------- Döngü ----------
  let sonZaman = performance.now();
  function dongu(su){
    let dt = (su - sonZaman)/1000;
    sonZaman = su;
    if (dt > 0.05) dt = 0.05;     // sekme arka plandayken sıçrama olmasın
    if (donmaSuresi > 0){ donmaSuresi -= dt; dt = 0; }  // JUICE: boss ölümünde kısa "vuruş anı" donması
    guncelle(dt);
    ciz();
    window.OYUN_DURUMU = {asama:asama, dalga:dalga||0, can:can||0, skor:skor||0, altin:altin||0};
    requestAnimationFrame(dongu);
  }

  // ---------- Başlat ----------
  boyutlandir();
  sifirla();
  asama="menu";
  if (T.ad) { document.getElementById("menuBaslik").textContent = T.ad;
              document.title = T.ad; }
  if (T.aciklama) document.getElementById("menuAciklama").textContent = T.aciklama;
  window.OYUN_DURUMU = {asama:"menu", dalga:0, can:BASLANGIC_CAN, skor:0, altin:BASLANGIC_ALTIN};
  requestAnimationFrame(dongu);
})();
</script>
